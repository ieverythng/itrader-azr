repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: check-merge-conflict
      - id: check-yaml
      - id: end-of-file-fixer
        exclude: ^docs/(artifacts/.*-evidence|audits/.*/evidence)/
      - id: trailing-whitespace
        exclude: ^docs/(artifacts/.*-evidence|audits/.*/evidence)/

  - repo: local
    hooks:
      - id: itrader-healthcheck
        name: itrader healthcheck
        entry: python itrader/tools/run_repo_python.py itrader/tools/healthcheck.py
        language: system
        pass_filenames: false

      - id: itrader-tests-core
        name: itrader core tests
        entry: python itrader/tools/run_repo_python.py -m pytest -q itrader/tests
        language: system
        pass_filenames: false

      - id: gitnexus-advisory
        name: gitnexus advisory freshness check
        entry: ./tools/knowledge/pre_commit_advisory.sh
        language: system
        pass_filenames: false
        stages: [manual]

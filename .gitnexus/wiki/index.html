rimary host | Local testing without loading main PC; same-machine Codex/Cursor is default |\n\n## Configuration Files\n\n| File | Purpose |\n|------|---------|\n| `.codex/config.toml` | Codex project configuration with MCP settings |\n| `.cursor/mcp.json` | Cursor MCP configuration |\n| `~/.gitnexus/config.json` | GitNexus user-level config (API keys, not committed) |\n\n## Current Index Status\n\nAs of the last index:\n- **Commit**: `42595f2157b49a087f3183735cd22363fddef79b`\n- **Files**: 129\n- **Nodes**: 1070\n- **Edges**: 2212\n- **Communities**: 59\n- **Processes**: 86\n\nRun `tools/knowledge/status.sh` for current status.","other-docs":"# Other — docs\n\n# iTrader Documentation Module\n\n## Overview\n\nThe `docs/` module contains the canonical planning, architecture, and operational documentation for the iTrader project. These documents define the system's evolution from Phase A (baseline training) through Phase B (proposer-solver loop) to Phase C (coupled offline/online architecture).\n\n## Document Index\n\n| Document | Purpose | Audience |\n|----------|---------|----------|\n| `architecture.md` | Current baseline and target architecture overview | All developers |\n| `iTRADER_Codex_Implementation_Spec.md` | Detailed implementation specification for Phase B/C | Implementers, Codex sessions |\n| `ops_runbook.md` | Local execution workflow and reproducibility | Operators, developers |\n| `phase_b_plan.md` | Concrete milestone breakdown for Phase B | Project leads, implementers |\n| `phase_b_handoff_2026-03-04.md` | Session continuation point with validated state | Codex sessions, new contributors |\n\n## Architecture Overview\n\n### Phase Progression\n\n```mermaid\nflowchart LR\n    A[Phase A<br/>Baseline Training] --> B[Phase B<br/>Proposer-Solver Loop]\n    B --> C[Phase C<br/>Offline/Online Coupled]\n    \n    A --> A1[solo_V2 training]\n    A --> A2[TaskSpec contracts]\n    A --> A3[PPO + FiLM solver]\n    \n    B --> B1[CurriculumProposer]\n    B --> B2[Multi-head solver]\n    B --> B3[CapabilityProfile]\n    \n    C --> C1[MarketFramer]\n    C --> C2[DecisionGate]\n    C --> C3[RiskEngine]\n    C --> C4[Executor]\n```\n\n### Current Baseline (Phase A)\n\nThe active training path uses:\n\n- **Entry point**: `itrader/rl_lib/train/train_solo_V2.py`\n- **Environment**: `itrader/envs/itrader_env.py` (`ITraderEnv`)\n- **Reward computation**: `itrader/rl_lib/tasks/rewards.py` via `RewardEngine`\n- **Model**: `itrader/models/solver_mlp_film.py` (`SolverMLPFiLM`)\n- **Observability**: `itrader/rl_lib/callbacks/ps_metrics.py`, `auto_plotter.py`\n\nKey runtime components:\n\n1. **Data layer**: OHLCV parquet input at `itrader/data/ohlcv.parquet`\n2. **Environment**: Emits `flattened_price_window + task_embedding` observations\n3. **Task layer**: `TaskSpec` contract with `TaskSampler00` for stochastic generation\n4. **Solver**: PPO (RLlib) with FiLM-conditioned policy\n\n### Target Architecture (Phase B/C)\n\nThe implementation spec defines a coupled architecture:\n\n**Offline path**:\n```\nHistorical windows → Summarizer → CurriculumProposer → TaskSpecs → Solver → Metrics\n```\n\n**Online path**:\n```\nLive window → MarketFramer → CandidateTasks → Solver → DecisionGate → RiskEngine → Executor\n```\n\n## Key Contracts\n\n### TaskSpec\n\nThe canonical contract for task definition. Required fields:\n\n| Field | Description |\n|-------|-------------|\n| `task_family` | Task family identifier (e.g., `\"00\"`, `\"01\"`) |\n| `bar_resolution` | Time resolution (e.g., `\"1m\"`, `\"5m\"`) — **required** to eliminate ambiguity |\n| `horizon_bars` | Number of bars in task horizon |\n| `start_idx` | Starting index reference |\n| `reward_config` | Reward function configuration |\n| `regime_tags` | Market regime labels |\n| `difficulty_target` | Target solve probability range |\n| `metadata` | Source tracking and fingerprints |\n\n### New Contracts (Phase B/C)\n\nThe spec introduces additional contracts:\n\n- **`ExecutionIntent`**: Defines how a candidate task would be traded (entry/exit logic, TTL, confidence bands)\n- **`CandidateTask`**: Combines `TaskSpec` with execution framing and rationale\n- **`CapabilityProfile`**: Tracks solver capability by family/regime/horizon\n- **`DecisionRecord`**: Immutable audit trail for decision cycles\n\n## Task Families\n\n| Family | Name | Purpose |\n|--------|------|---------|\n| `00` | Directional predictor | Current proven path — **lock and preserve** |\n| `01` | Breakout/expansion | Trend-following opportunities |\n| `02` | Mean reversion | Snapback opportunities |\n| `03` | Trade management | Hold/trim/exit decisions for open positions |\n| `04` | Abstain/unsuitable | Detect no-trade regimes |\n\n**Implementation order**: Lock `00` → Add `01` → Add `02` → Optionally `03` → Add `04`\n\n## Operations Workflow\n\n### Environment Setup\n\n```bash\n# Create and activate environment\nconda env create -f itrader/environment.yml\nconda activate itrader\n\n# Validate runtime\npython itrader/tools/healthcheck.py\npython -m pytest -q itrader/tests\n\n# Freeze lock after validation\nconda env export --from-history > env.lock.yml\npip freeze > itrader/constraints.lock.txt\n```\n\n### Canonical Entry Points\n\n| Operation | Command |\n|-----------|---------|\n| Training | `python -m itrader.rl_lib.train.train_solo_V2 ...` |\n| Health check | `python itrader/tools/healthcheck.py` |\n| Tests | `python -m pytest -q itrader/tests` |\n| Ablation | `python -m itrader.scripts.experiments.run_ablation <config.json>` |\n| Task pool generation | `python -m itrader.scripts.gen_task_pool --backend <backend> ...` |\n\n### Proposer Backends\n\n| Backend | Use Case | Notes |\n|---------|----------|-------|\n| `rule_based` | CI/smoke tests | Fast, deterministic fallback |\n| `ollama` | Local experimentation | Requires model compatibility |\n| `vllm` | High-throughput serving | Preferred for main PC |\n| `sglang` | Alternative serving | Advanced inference support |\n\n### Metrics Locations\n\n- **Ray results**: `~/ray_results/<experiment_name>/...`\n- **Stable mirror**: `~/ray_results/_stable_metrics/<trial_dir>/`\n  - `metrics_full.jsonl`\n  - `report_rows.csv`\n  - `plots/`\n\n## Phase B Milestones\n\n| Milestone | Focus | Key Deliverables |\n|-----------|-------|------------------|\n| M0 | Stabilization | Remove secrets, fix entrypoints, dependency lock |\n| M1 | Contract layer | `BaseProposer` interface, validation, fallback |\n| M2 | AZR loop | Runnable `train_AZR.py`, CLI flags, manifests |\n| M3 | Guardrails | Integration tests, regression checks, comparison scripts |\n\n## Architectural Gaps (Current)\n\n1. **AZR loop**: `train_AZR.py` is conceptual pseudocode, not runnable\n2. **Proposer integration**: LLM proposer exists but not wired into training\n3. **Contract clarity**: Module boundaries for proposer/sampler/solver not explicit\n4. **Dependency drift**: Multiple manifests with divergent versions\n5. **Legacy surface**: Stale entrypoints and cached artifacts create confusion\n\n## Implementation Principles\n\n1. **Single executable truth** for each workflow\n2. **Typed contracts** before additional model complexity\n3. **Deterministic and inspectable** control paths\n4. **Extension over rewrite** — preserve working Phase A paths\n5. **WAIT is first-class** — online stack must support abstention natively\n\n## Security\n\nNever hardcode API keys. Required environment variables:\n\n```bash\nexport POLYGON_API_KEY=\"your_key_here\"\n# Optional:\nexport POLYGON_WS_URL=\"wss://...\"\n```\n\n## Pre-Run Checklist\n\n1. `git status` clean or intentionally dirty\n2. `healthcheck` passes required packages\n3. Tests pass or skips are understood\n4. Dataset path exists and matches intended snapshot\n5. Experiment name and seed are explicitly set\n\n## Handoff Protocol\n\nFor Codex session continuation, use `phase_b_handoff_2026-03-04.md` which provides:\n\n- Validated branch state and commit reference\n- Exact commands for sanity checks\n- Backend-specific task generation commands\n- Known blockers and workarounds\n\n## Definition of Done (Phase B Initial)\n\nPhase B initial is complete when:\n\n1. `train_AZR.py` (or equivalent) is executable\n2. Proposer backend is switchable via CLI\n3. Smoke run passes with stable metrics + manifests\n4. At least one proposer-vs-baseline comparison is reproducible","other-env-lock-yml":"# Other — env.lock.yml\n\n# Environment Lock File (env.lock.yml)\n\n## Overview\n\n`env.lock.yml` is a **conda environment lock file** that defines the complete, reproducible dependency specification for the `itrader` project. This file ensures consistent environment reproduction across different machines and deployments by pinning exact package versions.\n\n## Purpose\n\n- **Reproducibility**: Guarantees identical package versions across all installations\n- **Dependency Resolution**: Pre-resolved dependency tree to avoid conflicts during environment creation\n- **Version Control**: Serves as a single source of truth for the project's Python environment\n\n## Usage\n\n### Creating the Environment\n\n```bash\n# Create environment from lock file\nconda env create -f env.lock.yml\n\n# Activate the environment\nconda activate itrader\n```\n\n### Updating the Environment\n\n```bash\n# Apply changes after modifying the lock file\nconda env update -f env.lock.yml --prune\n```\n\n### Exporting from Existing Environment\n\n```bash\n# Generate a new lock file from current environment\nconda env export > env.lock.yml\n```\n\n## Dependency Categories\n\n### Core Runtime\n\n| Package | Version | Purpose |\n|---------|---------|---------|\n| `python` | 3.11 | Language runtime |\n| `numpy` | 1.26 | Numerical computing foundation |\n| `pandas` | 2.2 | Data manipulation and analysis |\n| `pyarrow` | 13.0.0 | Arrow columnar format, Parquet support |\n| `duckdb` | 0.10.2 | In-process analytical database |\n\n### Machine Learning & Deep Learning\n\n| Package | Version | Purpose |\n|---------|---------|---------|\n| `pytorch` | 2.3 | Deep learning framework |\n| `torchvision` | 0.18 | Computer vision utilities |\n| `transformers` | 4.41.1 | Hugging Face model hub |\n| `accelerate` | 0.27.2 | Distributed training utilities |\n| `llama-cpp-python` | 0.3.9 | LLM inference bindings |\n\n### Reinforcement Learning\n\n| Package | Version | Purpose |\n|---------|---------|---------|\n| `ray[rllib]` | 2.47.1 | Distributed RL framework |\n| `gymnasium` | ≥0.29,<1.0 | RL environment interface |\n| `pettingzoo` | 1.24.1 | Multi-agent RL environments |\n\n### Trading & Finance\n\n| Package | Version | Purpose |\n|---------|---------|---------|\n| `ta-lib` | (latest) | Technical analysis indicators |\n| `vectorbt` | 0.26.0 | Vectorized backtesting |\n\n### Networking & APIs\n\n| Package | Version | Purpose |\n|---------|---------|---------|\n| `requests` | (latest) | HTTP client |\n| `websockets` | (latest) | WebSocket protocol support |\n\n### Data Quality\n\n| Package | Version | Purpose |\n|---------|---------|---------|\n| `great_expectations` | ≥0.19 | Data validation and profiling |\n\n### Development Tools\n\n| Package | Version | Purpose |\n|---------|---------|---------|\n| `pytest` | (latest) | Testing framework |\n| `black` | (latest) | Code formatter |\n| `isort` | (latest) | Import sorter |\n\n## Version Pinning Strategy\n\nThe file uses three pinning approaches:\n\n1. **Exact pin** (`==2.47.1`): Strict version lock for critical dependencies\n2. **Minimum version** (`>=0.19`): Allows compatible upgrades\n3. **Range constraint** (`>=0.29,<1.0`): Accepts minor/patch updates within major version\n\n## Channels\n\nDependencies are resolved from two channels in order:\n\n1. **conda-forge**: Community-maintained packages (primary source)\n2. **pytorch**: Official PyTorch distributions\n\nChannel order matters for package resolution. Packages are pulled from the first channel that contains them.\n\n## Mixed Dependency Sources\n\nThis configuration uses both conda and pip:\n\n```yaml\ndependencies:\n  - pip  # Required to enable pip installs\n  - pip:\n      - ray[rllib]==2.47.1  # pip-only packages\n```\n\nPip dependencies are installed after conda packages resolve. Use pip for packages unavailable in conda channels or when specific extras (like `[rllib]`) are required.\n\n## Maintenance Notes\n\n### When to Update\n\n- Security vulnerabilities in dependencies\n- Required features in newer versions\n- Compatibility with new Python versions\n\n### Regenerating the Lock File\n\n```bash\n# After modifying env.yml (flexible spec)\nconda env create -f env.yml\nconda activate itrader\nconda env export > env.lock.yml\n```\n\n### Common Issues\n\n| Issue | Resolution |\n|-------|------------|\n| Platform mismatch | Regenerate lock file on target platform |\n| Package not found | Check channel availability or use pip |\n| Version conflict | Use `conda config --set allow_conda_downgrades true` |","other-itrader-infra":"# Other — itrader-infra\n\n# itrader-infra\n\nInfrastructure configuration module for deploying the iTrader system using Ray cluster orchestration.\n\n## Overview\n\nThis module contains configuration files for provisioning and managing Ray clusters. Currently, it provides a local development configuration optimized for single-machine development with GPU support for reinforcement learning workloads.\n\n## Configuration Files\n\n### cluster.yaml\n\nRay cluster configuration for local development environments.\n\n#### Key Settings\n\n| Setting | Value | Purpose |\n|---------|-------|---------|\n| `cluster_name` | `itrader-local` | Identifier shown in Ray dashboard |\n| `head_resources.CPU` | 4 | CPU cores reserved for head node |\n| `head_resources.GPU` | 1 | GPU reserved for learner/training |\n| `min_workers` | 0 | No worker nodes in local dev |\n| `max_workers` | 0 | Head-only deployment |\n\n#### Docker Configuration\n\n```yaml\ndocker:\n  image: pytorch/pytorch:2.3.0-cuda12.2-cudnn8-runtime\n```\n\nUses the official PyTorch runtime image with:\n- PyTorch 2.3.0\n- CUDA 12.2\n- cuDNN 8\n\nThis image provides GPU-accelerated PyTorch without development tools, keeping container size minimal.\n\n#### File Mounts\n\n```yaml\nfile_mounts:\n  /workspace/iTrader: .\n```\n\nSyncs the repository root to `/workspace/iTrader` inside the container. This enables live code changes without rebuilding the image.\n\n#### Setup Commands\n\nInstalls required Python packages on cluster startup:\n\n| Package | Purpose |\n|---------|---------|\n| `ray[air]==2.47` | Ray with AIR (RL/training APIs) |\n| `gymnasium` | RL environment interface |\n| `pandas` | Data manipulation |\n| `duckdb` | Embedded analytical database |\n| `ta` | Technical analysis indicators |\n\n## Usage\n\n### Starting the Cluster\n\n```bash\nray up itrader/infra/cluster.yaml\n```\n\n### Accessing the Dashboard\n\nAfter startup, the Ray dashboard is available at `http://localhost:8265` showing the `itrader-local` cluster.\n\n### Stopping the Cluster\n\n```bash\nray down itrader/infra/cluster.yaml\n```\n\n## Design Decisions\n\n### Head-Only Architecture\n\nThe local configuration runs all workloads on the head node (`max_workers: 0`). This simplifies development by:\n\n1. Eliminating worker node provisioning overhead\n2. Providing direct access to logs and debugging\n3. Reducing resource requirements for development machines\n\n### GPU Reservation\n\nThe head node reserves 1 GPU specifically for the learner component. This ensures training workloads have guaranteed GPU access without competing with other Ray actors.\n\n## Integration Points\n\nThis configuration supports the broader iTrader system:\n\n- **Ray AIR**: Provides distributed training infrastructure for RL agents\n- **Gymnasium environments**: Trading environments run as Ray actors\n- **Learner component**: Consumes GPU resources for policy optimization\n- **Data pipeline**: DuckDB and pandas support market data processing\n\n## Extending for Production\n\nFor production deployments, create additional cluster configurations with:\n\n```yaml\nmin_workers: 2\nmax_workers: 10\nworker_default_resources:\n  CPU: 4\n```\n\nProduction configs should be added as separate files (e.g., `cluster-aws.yaml`, `cluster-gcp.yaml`) in this directory.","other-itrader-rl-lib":"# Other — itrader-rl_lib\n\n# Other — itrader-rl_lib\n\n## Overview\n\nThis module contains a Prometheus configuration file for monitoring Ray-based applications. It provides the scrape configuration needed to collect metrics from Ray drivers and workers.\n\n## Purpose\n\nThe `prometheus_ray.yml` file configures Prometheus to scrape metrics from Ray processes. This enables observability for reinforcement learning workloads distributed across Ray clusters, allowing developers to monitor:\n\n- Task execution metrics\n- Memory usage across workers\n- Actor lifecycle events\n- Custom application metrics exposed via Ray's metrics API\n\n## Configuration Details\n\n### Active Configuration\n\n```yaml\nglobal:\nscrape_configs:\n  - job_name: ray\n    metrics_path: /metrics\n    static_configs:\n      - targets:\n          - \"127.0.0.1:8888\"\n```\n\n**Parameters:**\n\n| Field | Value | Description |\n|-------|-------|-------------|\n| `job_name` | `ray` | Identifier for this scrape job in Prometheus |\n| `metrics_path` | `/metrics` | HTTP endpoint path where Ray exposes metrics |\n| `targets` | `127.0.0.1:8888` | Default address for Ray driver metrics |\n\n### Commented Configuration (Workers)\n\nThe file includes a commented template for scraping Ray workers:\n\n```yaml\n# - job_name: ray_workers\n#   metrics_path: /metrics\n#   static_configs:\n#     - targets:\n#         # must match the ports you configured above:\n```\n\nThis section is disabled by default because worker ports are typically dynamic and environment-specific. Enable this when you need to collect metrics from individual Ray worker processes.\n\n## Usage\n\n### Starting Prometheus with This Configuration\n\n```bash\nprometheus --config.file=itrader/rl_lib/prometheus_ray.yml\n```\n\n### Integration with Ray\n\nRay must be configured to expose metrics on the expected port. When initializing Ray in your application:\n\n```python\nimport ray\n\nray.init(\n    metrics_export_port=8888,  # Must match Prometheus target port\n    # ... other init parameters\n)\n```\n\n### Scaling to Multiple Workers\n\nFor distributed workloads with multiple workers, uncomment and configure the `ray_workers` job with the appropriate worker ports. Worker ports are typically assigned dynamically, so you may need to:\n\n1. Configure Ray workers to use fixed ports via `object_store_memory` and related settings\n2. Use a service discovery mechanism (e.g., file-based SD or DNS SD) instead of static targets\n3. Deploy Prometheus alongside your Ray cluster with dynamic configuration\n\n## Integration Points\n\nThis configuration file integrates with:\n\n- **Ray Runtime**: Expects Ray to expose metrics at the configured endpoint\n- **Prometheus Server**: Loaded at startup to define scrape behavior\n- **Grafana/Alertmanager**: Downstream consumers of the collected metrics\n\n## Related Files\n\nThis configuration is typically used alongside:\n- Ray application code that exposes custom metrics\n- Grafana dashboards for visualizing Ray performance\n- Alerting rules for cluster health monitoring","other-itrader-scripts":"# Other — itrader-scripts\n\n# Experiment Harness\n\nThe `itrader/scripts/experiments` module provides a configuration-driven framework for running reproducible A/B ablation studies. It enables systematic comparison of training variants by executing controlled experiments with shared baselines and isolated parameter changes.\n\n## Overview\n\nThis harness standardizes experiment execution by:\n\n1. **Declarative configuration** — Define experiments via JSON with validated schemas\n2. **Variant isolation** — Run multiple training configurations with controlled differences\n3. **Automated comparison** — Generate comparative plots and metrics across variants\n4. **Reproducibility** — Consistent output structure and metric collection\n\n## Running Experiments\n\nExecute an ablation study by passing a configuration file:\n\n```bash\npython -m itrader.scripts.experiments.run_ablation \\\n  itrader/scripts/experiments/configs/ablation_start_idx.example.json\n```\n\n## Configuration Structure\n\nExperiments are defined in JSON files following the schema in `schemas/ablation.schema.json`.\n\n### Top-Level Fields\n\n| Field | Required | Description |\n|-------|----------|-------------|\n| `name` | Yes | Experiment identifier used for output directory |\n| `python_exe` | No | Python executable (defaults to `python`) |\n| `train_module` | No | Training module path (defaults to `itrader.rl_lib.train.train_solo_V2`) |\n| `common_args` | Yes | Shared arguments applied to all variants |\n| `variants` | Yes | Array of variant configurations (minimum 2) |\n\n### Variant Structure\n\nEach variant in the `variants` array requires:\n\n```json\n{\n  \"id\": \"variant_identifier\",\n  \"args\": {\n    // Variant-specific overrides to common_args\n  }\n}\n```\n\nThe `args` object merges with `common_args`, with variant values taking precedence.\n\n## Configuration Parameters\n\n### Execution Control\n\n| Parameter | Type | Description |\n|-----------|------|-------------|\n| `iters` | integer ≥ 1 | Number of training iterations |\n| `workers` | integer ≥ 0 | Number of parallel workers |\n| `timeout_hours` | number ≥ 0 | Maximum runtime in hours |\n| `window` | integer ≥ 2 | Rolling window size for metrics |\n| `seed` | integer | Random seed for reproducibility |\n\n### PPO Hyperparameters\n\n| Parameter | Type | Range | Description |\n|-----------|------|-------|-------------|\n| `gamma` | number | [0.0, 1.0] | Discount factor |\n| `lambda` | number | [0.0, 1.0] | GAE lambda |\n| `lr` | number | > 0.0 | Learning rate |\n| `train_batch_size` | integer | ≥ 1 | Samples per training batch |\n| `sgd_minibatch_size` | integer | ≥ 1 | Minibatch size for SGD |\n| `num_sgd_iter` | integer | ≥ 1 | SGD iterations per batch |\n| `clip_param` | number | ≥ 0.0 | PPO clip parameter |\n| `vf_clip_param` | number | ≥ 0.0 | Value function clip parameter |\n| `vf_loss_coeff` | number | ≥ 0.0 | Value function loss coefficient |\n\n### Episode/Stream Control\n\n| Parameter | Type | Values | Description |\n|-----------|------|--------|-------------|\n| `start_idx_mode` | string | `random_episode`, `stream_worker`, `task_spec` | Episode initialization strategy |\n| `ret_norm_reset` | string | `episode`, `stream` | Return normalization reset scope |\n| `stream_jump_every_episodes` | integer | ≥ 0 | Stream jump frequency |\n| `stream_jump_on_wrap` | boolean | — | Jump on data wrap |\n| `stream_stride` | integer | ≥ 0 | Stream stride offset |\n\n### Checkpoint & PBT\n\n| Parameter | Type | Description |\n|-----------|------|-------------|\n| `pbt` | boolean | Enable Population Based Training |\n| `cpu_pbt` | boolean | Use CPU-based PBT |\n| `pop` | integer ≥ 1 | Population size for PBT |\n| `restore_ckpt` | string | Path to checkpoint for restoration |\n| `best_params_json` | string | Path to best parameters JSON |\n\n### Data & Output\n\n| Parameter | Type | Description |\n|-----------|------|-------------|\n| `data_path` | string | Path to OHLCV data file |\n| `experiment_name` | string | Experiment name override |\n| `auto_plot_on_end` | boolean | Generate plots on training completion |\n\n## Output Structure\n\nEach experiment run creates an output directory under:\n\n```\nitrader/scripts/experiments/configs/outputs/<run_tag>/\n```\n\n### Generated Files\n\n| File | Description |\n|------|-------------|\n| `ablation_compare.csv` | Tabular comparison data across variants |\n| `ablation_compare.png` | Primary comparison visualization |\n| `ablation_compare_entropy.png` | Entropy comparison plot |\n| `ablation_compare_episode_len.png` | Episode length comparison |\n| `ablation_compare_diagnostics.png` | Diagnostic metrics comparison |\n| `summary.json` | Aggregated experiment summary |\n\n### Per-Variant Metrics\n\nEach variant generates individual plots under:\n\n```\n~/ray_results/_stable_metrics/<trial_dir_name>/plots/\n```\n\nThe training module writes per-iteration metrics to:\n\n```\n~/ray_results/_stable_metrics/<trial_dir_name>/metrics_full.jsonl\n~/ray_results/_stable_metrics/<trial_dir_name>/report_rows.csv\n```\n\n## Example Configurations\n\n### Smoke Test (Quick Validation)\n\nThe `ablation_smoke_quick.json` provides a minimal configuration for rapid testing:\n\n- 3 iterations, 2 workers\n- Compares `random_episode` vs `stream_worker` start modes\n- 1-hour timeout ceiling\n\n### Learning Rate Ablation\n\nThe `ablation_start_idx.example.json` demonstrates hyperparameter comparison:\n\n- Two variants with different learning rates (0.005 vs 0.0005)\n- Different `ret_norm_reset` strategies\n- 30 iterations for meaningful comparison\n\n### Checkpoint Restoration\n\nThe `pbt_winner_retrain_compare_20260216.json` shows checkpoint-based comparison:\n\n- Restores from specific PBT trial checkpoints\n- Compares peak vs final checkpoint performance\n- Uses `stream_worker` mode with periodic jumps\n\n## Configuration Validation\n\nAll configurations must conform to `schemas/ablation.schema.json`. The schema enforces:\n\n- Required fields: `name`, `common_args`, `variants`\n- Minimum 2 variants per experiment\n- Type constraints on all parameters\n- Enum constraints on `start_idx_mode` and `ret_norm_reset`\n\nValidate a configuration before running:\n\n```python\nimport json\nimport jsonschema\n\nwith open('schemas/ablation.schema.json') as f:\n    schema = json.load(f)\n\nwith open('configs/your_experiment.json') as f:\n    config = json.load(f)\n\njsonschema.validate(config, schema)\n```\n\n## Integration with Training Pipeline\n\n```mermaid\nflowchart LR\n    A[Config JSON] --> B[run_ablation.py]\n    B --> C[Variant 1]\n    B --> D[Variant 2]\n    B --> E[Variant N]\n    C --> F[train_solo_V2]\n    D --> F\n    E --> F\n    F --> G[Ray Results]\n    G --> H[_stable_metrics]\n    H --> I[Comparison Output]\n```\n\nThe harness invokes `train_solo_V2` for each variant, collecting metrics in a standardized location independent of Ray's trial directory structure. This ensures consistent metric access regardless of Ray's internal organization.","other-itrader-tests":"# Other — itrader-tests\n\n# itrader-tests Module\n\n## Overview\n\nThe `itrader/tests` module provides comprehensive test coverage for the itrader reinforcement learning trading system. It validates core components including the trading environment, reward computation, task specification contracts, LLM-based task proposers, neural network models, and training configuration.\n\n## Test Organization\n\n```\nitrader/tests/\n├── conftest.py              # Shared fixtures and pytest configuration\n├── env_check.py             # Dependency availability verification\n├── sanity.py                # Reward engine sanity checks\n├── test_env_core.py         # Trading environment behavior tests\n├── test_llm.py              # LLM proposer JSON parsing tests\n├── test_no_nan_forward.py   # Model forward pass robustness tests\n├── test_ps_metrics.py       # Episode metrics callback tests\n├── test_rewards.py          # Reward engine computation tests\n├── test_rule_based_proposer.py  # Task proposer factory and implementations\n├── test_task_contracts.py   # Task specification contract tests\n├── test_task_validation.py  # Task validation and normalization tests\n└── test_train_config.py     # Training configuration builder tests\n```\n\n## Fixtures\n\n### `tiny_ohlcv_path`\n\nDefined in `conftest.py`, this fixture creates a minimal OHLCV dataset for environment tests:\n\n```python\n@pytest.fixture\ndef tiny_ohlcv_path(tmp_path: Path) -> Path\n```\n\n**Behavior:**\n- Generates 500 bars of synthetic price data\n- Creates a trending base price from 100.0 to 120.0 with sinusoidal noise\n- Writes to a temporary parquet file\n- Returns the path for use in environment instantiation\n\n**Usage:**\n```python\ndef test_my_feature(tiny_ohlcv_path):\n    env = ITraderEnv({\"df_path\": str(tiny_ohlcv_path), ...})\n```\n\n## Test Categories\n\n### Environment Tests (`test_env_core.py`)\n\nValidates `ITraderEnv` behavior:\n\n| Test | Purpose |\n|------|---------|\n| `test_env_reset_and_step_outputs_are_finite` | Ensures observations and rewards are finite after reset/step |\n| `test_env_start_idx_respects_bounds` | Validates episode start index stays within valid range |\n| `test_env_seeded_reset_is_reproducible_across_instances` | Confirms identical seeds produce identical task parameters |\n| `test_env_applies_terminal_drawdown_penalty_on_final_step` | Verifies terminal drawdown penalty application |\n\n### Reward Engine Tests (`test_rewards.py`, `sanity.py`)\n\nValidates `RewardEngine` computation:\n\n```python\n# Computing rewards with explicit parameters\nreward, components = RewardEngine.compute(\n    \"pnl_linear\",\n    {\"pnl_w\": 1.0, \"turnover_w\": 0.01, \"dd_w\": 0.2},\n    {\"pnl_delta\": 0.5, \"turnover_t\": 1.0, \"dd_inc\": 0.3, ...}\n)\n```\n\n**Key validations:**\n- Unknown reward IDs raise `KeyError`\n- NaN/Inf inputs produce finite outputs\n- Component signs are correct (PnL positive, turnover/drawdown negative)\n- Terminal drawdown penalty only applies on terminal step\n- Custom reward functions preserve arbitrary component names\n\n### Task Contract Tests (`test_task_contracts.py`, `test_task_validation.py`)\n\nValidates the task specification system:\n\n```mermaid\ngraph TD\n    A[Raw Task Dict] --> B[validate_and_clamp_task]\n    B --> C[TaskSpec]\n    C --> D[TaskSampler]\n    D --> E[Sampled Task]\n    E --> F[Environment]\n    \n    G[CandidateTask] --> H[DecisionRecord]\n    G --> I[ExecutionIntent]\n    J[CapabilityProfile] --> G\n```\n\n**Contract types tested:**\n- `TaskSpec` - Core task specification with family, price, horizon, reward\n- `ExecutionIntent` - Entry/exit logic, confidence bands, risk envelope\n- `CandidateTask` - Task spec + execution intent + metadata\n- `CapabilityProfile` - Agent capability tracking per family/horizon\n- `DecisionRecord` - Full decision trace with candidates and outcomes\n\n**Validation behaviors:**\n- Populates required defaults for missing fields\n- Clamps out-of-range values to valid bounds\n- Normalizes GPT-style aliases to canonical field names\n- Preserves unknown reward parameters for future extensibility\n\n### Proposer Tests (`test_rule_based_proposer.py`, `test_llm.py`)\n\nValidates task proposal generation:\n\n```python\n# Factory pattern for proposer creation\nproposer = build_proposer(\"rule_based\", seed=1)\nproposer = build_proposer(\"ollama\", model=\"qwen2.5:7b-instruct\")\nproposer = build_proposer(\"vllm\", model=\"Qwen/Qwen3.5-9B\", base_url=\"...\")\n```\n\n**Key validations:**\n- Deterministic output for identical seeds\n- Correct task shape fields (obs_dim, action_dim)\n- Reward-specific parameter shapes\n- JSON parsing with repair for malformed LLM output\n\n### Model Tests (`test_no_nan_forward.py`)\n\nValidates `SolverMLPFiLM` robustness:\n\n```python\ndef test_forward_no_nan_inf_in_logits():\n    # Model receives NaN/Inf inputs\n    x[0, 0] = float(\"nan\")\n    x[1, 1] = float(\"inf\")\n    x[2, 2] = float(\"-inf\")\n    \n    logits, _ = model.forward({\"obs\": x}, [], None)\n    assert torch.isfinite(logits).all()  # Must produce finite outputs\n```\n\n### Training Configuration Tests (`test_train_config.py`)\n\nValidates `build_base_config` function:\n\n| Test | Purpose |\n|------|---------|\n| `test_build_base_config_sets_seed_in_all_required_places` | Seed propagation to all config sections |\n| `test_build_base_config_pbt_disables_prometheus` | PBT mode disables metrics export |\n| `test_build_base_config_wires_task_pool_when_path_is_set` | Task pool path integration |\n| `test_build_base_config_defaults_new_ppo_args_when_missing` | PPO hyperparameter defaults |\n| `test_build_base_config_respects_explicit_ppo_args` | CLI argument override behavior |\n\n## Running Tests\n\n### Prerequisites\n\nCore dependencies (always required):\n- numpy, pandas, torch, ray, gymnasium, duckdb\n\nOptional dependencies:\n- `llama_cpp` - LLM proposer backends (tests skip if unavailable)\n- `transformers` - ProposerLLM tests\n- `pydantic` - Configuration validation tests\n\n### Execution\n\n```bash\n# Run all tests\npytest itrader/tests/\n\n# Run specific test file\npytest itrader/tests/test_env_core.py\n\n# Run with verbose output\npytest itrader/tests/ -v\n\n# Run only fast tests (skip integration tests)\npytest itrader/tests/ -m \"not slow\"\n```\n\n## Test Data Patterns\n\n### Environment Configuration\n\nTests use a standard environment configuration pattern:\n\n```python\ndef _make_env(df_path: str, start_idx_mode: str = \"random_episode\", seed: int = 1234):\n    return ITraderEnv({\n        \"df_path\": df_path,\n        \"window_size\": 30,\n        \"start_idx_mode\": start_idx_mode,\n        \"ret_norm_reset\": \"episode\",\n        \"task_sampler\": {\n            \"seed\": seed,\n            \"window_size\": 30,\n            \"n_features\": 5,\n            \"t_embed_dim\": 32,\n            \"action_dim\": 3,\n            \"horizons\": [64],\n            \"reward_ids\": [\"pnl_linear\"],\n        },\n    })\n```\n\n### Task Validation Pattern\n\n```python\n# Raw input with potential issues\nraw_task = {\"horizon\": 99999, \"start_idx\": -10, ...}\n\n# Validation clamps and normalizes\nvalidated = validate_and_clamp_task(\n    raw_task,\n    {\"window_size\": 30, \"n_features\": 5, \"t_embed_dim\": 32, \"action_dim\": 3},\n    fallback_seed=123\n)\n\n# Convert to typed spec\nspec = TaskSpec.from_dict(validated)\n```\n\n## Key Assertions\n\nThe test suite enforces several critical invariants:\n\n1. **Finite outputs**: All environment observations, rewards, and model outputs must be finite\n2. **Reproducibility**: Seeded environments produce identical task parameters across instances\n3. **Bounds respect**: Start indices stay within valid episode ranges\n4. **Contract normalization**: All task specs normalize to canonical field names\n5. **Metric preservation**: Dynamic reward components flow through to episode metrics","other-itrader-tools":"# Other — itrader-tools\n\n# itrader-tools: run_repo_python.sh\n\n## Overview\n\n`run_repo_python.sh` is a utility script that ensures Python commands execute using a repository-local virtual environment interpreter. It provides a consistent entry point for running Python scripts within the project, eliminating ambiguity about which Python interpreter to use.\n\n## Purpose\n\nThis script solves a common problem in multi-developer environments: ensuring all Python execution uses the correct virtual environment. Rather than relying on developers to manually activate a virtual environment or remember the correct interpreter path, this script:\n\n- Automatically locates the repository root\n- Points to a dedicated `.itrader_env` virtual environment\n- Validates the interpreter exists before execution\n- Passes through all arguments to the Python interpreter\n\n## Usage\n\n### Basic Usage\n\n```bash\n# Run a Python script\n./itrader/tools/run_repo_python.sh script.py\n\n# Run Python with arguments\n./itrader/tools/run_repo_python.sh -m pytest tests/\n\n# Start an interactive Python session\n./itrader/tools/run_repo_python.sh\n```\n\n### Integration with Other Scripts\n\n```bash\n#!/usr/bin/env bash\n# Example: A script that needs Python\nSCRIPT_DIR=\"$(dirname \"${BASH_SOURCE[0]}\")\"\nPYTHON=\"${SCRIPT_DIR}/../itrader/tools/run_repo_python.sh\"\n\n$PYTHON -c \"import sys; print(sys.prefix)\"\n```\n\n## Prerequisites\n\nBefore using this script, create the virtual environment:\n\n```bash\ncd /path/to/repo/root\npython3 -m venv .itrader_env\nsource .itrader_env/bin/activate\npip install -r requirements.txt  # or project-specific setup\n```\n\n## How It Works\n\n```bash\nset -euo pipefail\n```\nEnables strict mode:\n- `-e`: Exit immediately if any command fails\n- `-u`: Treat unset variables as an error\n- `-o pipefail`: Pipeline fails if any command in it fails\n\n```bash\nREPO_ROOT=\"$(cd \"$(dirname \"${BASH_SOURCE[0]}\")/../..\" && pwd)\"\n```\nDetermines the repository root by navigating relative to the script location. This approach works regardless of where the script is called from.\n\n```bash\nPYTHON_BIN=\"${REPO_ROOT}/.itrader_env/bin/python\"\n```\nConstructs the path to the virtual environment's Python interpreter.\n\n```bash\nif [[ ! -x \"${PYTHON_BIN}\" ]]; then\n  echo \"Missing repo-local interpreter: ${PYTHON_BIN}\" >&2\n  echo \"Create it first (example): python3 -m venv .itrader_env\" >&2\n  exit 1\nfi\n```\nValidates the interpreter exists and is executable. If not, provides a helpful error message with remediation steps.\n\n```bash\nexec \"${PYTHON_BIN}\" \"$@\"\n```\nReplaces the current shell process with Python, passing through all arguments. Using `exec` ensures Python inherits the same process ID and that signals are handled correctly.\n\n## Error Handling\n\n| Scenario | Behavior |\n|----------|----------|\n| Virtual environment doesn't exist | Prints error to stderr, exits with code 1 |\n| Python binary not executable | Prints error to stderr, exits with code 1 |\n| Python script fails | Exit code propagates from Python |\n\n## Design Decisions\n\n**Why `exec`?** Using `exec` replaces the bash process rather than spawning a child. This means:\n- Python receives signals directly (no bash wrapper)\n- Exit codes pass through without modification\n- No zombie processes\n\n**Why `.itrader_env`?** The hidden directory (leading dot) keeps the virtual environment out of sight during normal filesystem navigation while remaining discoverable for those who need it.\n\n**Why validate existence?** Failing fast with a helpful message is better than a cryptic \"command not found\" error later in execution.","other-itrader":"# Other — itrader\n\n# itrader Module\n\n## Overview\n\nThe `itrader` module is an experimental trading research environment configured for reinforcement learning-based trading strategies. It provides the dependency baseline and environment configuration for Phase B development, integrating RL frameworks, technical analysis tools, and LLM capabilities.\n\n**Note:** This module currently contains only configuration scaffolding. No runtime code, classes, or functions are implemented yet.\n\n## Purpose\n\n- Establish a canonical dependency baseline for trading research\n- Configure a reproducible conda environment for Phase B development\n- Define testing and linting standards for future code\n\n## Dependencies Architecture\n\nThe module's dependencies reveal its intended architecture:\n\n```mermaid\ngraph TB\n    subgraph \"RL Training\"\n        RL[Ray RLlib 2.47.1]\n        GYM[Gymnasium]\n        PZ[PettingZoo]\n    end\n    \n    subgraph \"Data Layer\"\n        PANDAS[Pandas 2.2]\n        DUCK[DuckDB 0.10.2]\n        ARROW[PyArrow 13.0]\n    end\n    \n    subgraph \"Trading\"\n        TA[Technical Analysis]\n        VBT[VectorBT 0.26]\n    end\n    \n    subgraph \"LLM Integration\"\n        TRANS[Transformers 4.41]\n        LLAMA[llama-cpp-python]\n    end\n    \n    RL --> GYM\n    RL --> PZ\n    PANDAS --> DUCK\n    PANDAS --> ARROW\n```\n\n### Core Dependencies\n\n| Category | Package | Version | Purpose |\n|----------|---------|---------|---------|\n| **Reinforcement Learning** | `ray[rllib]` | 2.47.1 | Distributed RL training framework |\n| | `gymnasium` | ≥0.29, <1.0 | Environment interface standard |\n| | `pettingzoo` | 1.24.1 | Multi-agent RL environments |\n| **Data Processing** | `numpy` | 1.26.* | Numerical computing |\n| | `pandas` | 2.2.* | DataFrame operations |\n| | `duckdb` | 0.10.2 | In-process analytical database |\n| | `pyarrow` | 13.0.0 | Columnar data format |\n| **Trading** | `ta` | ≥0.11.0 | Technical analysis indicators |\n| | `vectorbt` | 0.26.0 | Vectorized backtesting |\n| **LLM** | `transformers` | 4.41.1 | Hugging Face model hub |\n| | `llama-cpp-python` | 0.3.9 | Local LLM inference |\n| **Validation** | `great_expectations` | ≥0.19 | Data quality validation |\n\n## Environment Setup\n\n### Using Conda (Recommended)\n\n```bash\n# Create environment from specification\nconda env create -f itrader/environment.yml\n\n# Activate environment\nconda activate itrader\n```\n\n### Using pip with Constraints\n\n```bash\n# Create virtual environment\npython -m venv .venv\nsource .venv/bin/activate\n\n# Install with constraints\npip install -r itrader/constraints.txt\n```\n\n### Post-Installation\n\nAfter environment creation, generate a concrete lock file on the target machine:\n\n```bash\npip freeze > requirements.lock\n```\n\n## Project Structure\n\n```\nitrader/\n├── README.md           # Project overview\n├── constraints.txt     # pip constraint baseline\n├── environment.yml     # conda environment specification\n└── pyproject.toml      # pytest configuration\n```\n\n## Testing Configuration\n\nThe `pyproject.toml` defines the testing standards:\n\n| Setting | Value |\n|---------|-------|\n| `minversion` | pytest 7.0+ |\n| `testpaths` | `[\"tests\"]` |\n| `python_files` | `test_*.py`, `*_test.py` |\n| `addopts` | `-ra` (show extra test summary) |\n| `console_output_style` | `progress` |\n\n### Running Tests\n\n```bash\n# Run all tests\npytest\n\n# Run with verbose output\npytest -v\n\n# Run specific test file\npytest tests/test_example.py\n```\n\n## Development Tools\n\n| Tool | Purpose |\n|------|---------|\n| `pytest` | Test framework |\n| `black` | Code formatting |\n| `isort` | Import sorting |\n\n### Linting Workflow\n\n```bash\n# Format code\nblack itrader/\n\n# Sort imports\nisort itrader/\n\n# Run both with checks\nblack --check itrader/ && isort --check-only itrader/\n```\n\n## Key Integration Points\n\nBased on the dependency configuration, the module is designed to integrate with:\n\n1. **Ray RLlib** — For distributed training of trading agents\n2. **Gymnasium/PettingZoo** — Custom trading environment implementations\n3. **VectorBT** — Backtesting trained strategies\n4. **DuckDB + PyArrow** — Efficient market data storage and retrieval\n5. **Great Expectations** — Data quality validation for market data pipelines\n6. **LLM Components** — Potential use for strategy generation or market analysis\n\n## Notes\n\n- The `constraints.txt` explicitly states it is \"not a full transitive lock\" — generate locks on target machines\n- Python 3.11 is the canonical version\n- PyTorch 2.3.* is included via conda, not pip\n- `ta-lib` requires conda-forge channel (C library dependency)","other-pbt-setup-guide-md":"# Other — PBT_SETUP_GUIDE.md\n\n# PBT Setup Guide Documentation\n\n## Overview\n\nThe `PBT_SETUP_GUIDE.md` is a comprehensive operational reference for running Population-Based Training (PBT) sweeps in the RL training pipeline. It serves as the primary documentation for developers setting up long-running hyperparameter exploration jobs, managing checkpoints, and extracting optimal model configurations.\n\n## Purpose\n\nThis guide addresses the operational complexity of PBT workflows:\n\n- **Phase 1**: CPU-based multi-trial exploration with PBT to discover optimal hyperparameters\n- **Phase 2**: GPU-based retraining of the best checkpoint for final model optimization\n\nThe two-phase approach separates exploration (many trials, CPU-efficient) from exploitation (single trial, GPU-optimized), reducing computational costs while maintaining hyperparameter search breadth.\n\n## Document Structure\n\n### Quick Start Checklist\n\nProvides immediate actionable commands for launching PBT sweeps. Key flags:\n\n| Flag | Purpose | Recommended Value |\n|------|---------|-------------------|\n| `--cpu_pbt` | Enables CPU-optimized PBT mode | Required for Phase 1 |\n| `--pbt` | Activates population-based training | Required |\n| `--pop` | Population size (number of trials) | 10 for initial runs |\n| `--workers` | Parallel workers per trial | 4 for CPU PBT |\n| `--iters` | Training iterations | 200 for exploration |\n| `--timeout_hours` | Maximum run duration | 12-24 hours |\n\n### Checkpoint Management\n\nDocuments the checkpoint storage hierarchy and extraction procedures:\n\n```\n~/ray_results/Phase_A/\n├── <trial_id_1>/\n│   ├── rllib_checkpoints/\n│   │   ├── checkpoint_000003/\n│   │   ├── checkpoint_000006/\n│   │   └── ...\n│   ├── progress.csv\n│   └── stdout/stderr logs\n├── <trial_id_2>/\n└── ...\n```\n\nThe guide provides code examples for:\n- Loading experiment results via `tune.ExperimentAnalysis`\n- Identifying best trials by `custom_metrics/episode_return_mean`\n- Restoring checkpoints for continued training\n\n### Monitoring Long Runs\n\nCovers four monitoring approaches:\n\n1. **Ray Dashboard** (`localhost:8265`) — Real-time trial status, actor health, resource allocation\n2. **Progress Files** (`progress.csv`) — Per-trial metrics for mid-run analysis\n3. **Log Files** — Trial-level stdout/stderr for debugging\n4. **Resource Monitoring** — System-level CPU/memory/disk tracking\n\n### Troubleshooting\n\nDocuments six common failure modes with symptoms, causes, and fixes:\n\n| Issue | Root Cause | Resolution |\n|-------|------------|------------|\n| Port Conflicts | Prometheus conflicts across trials | Auto-disabled when `--pbt` set |\n| Checkpoint Save Failures | Disk space/permissions | Verify `~/ray_results` writable |\n| Trial Failures | OOM, NaN gradients, env errors | Check logs, `max_failures=3` retry |\n| Plot Directory Flooding | Callback misconfiguration | `MetricsOnlyCallback` for PBT |\n| Memory Issues | Too many concurrent trials | Reduce `--pop` or `--workers` |\n| Checkpoint Restoration | First iteration has no checkpoint | Expected on first iter only |\n\n### Best Practices\n\nProvides operational recommendations:\n\n- **Pre-run validation**: Quick 3-iteration test before full sweep\n- **Resource planning**: CPU/memory/disk requirements per trial\n- **Early stopping**: `TimeoutStopper` configuration\n- **Checkpoint frequency**: Balance between PBT exploitation and I/O overhead\n- **Recovery procedures**: Resume from interruption points\n\n### Results Extraction\n\nPost-PBT analysis workflow:\n\n```python\n# Standard extraction pattern\nanalysis = tune.ExperimentAnalysis(\"~/ray_results/Phase_A\")\ndf_sorted = analysis.results_df.sort_values(\n    'custom_metrics/episode_return_mean', \n    ascending=False\n)\nbest_config = analysis.best_config\n```\n\n### Performance Optimization\n\nPlatform-specific tuning:\n\n- **CPU PBT**: Fewer workers (2-4), smaller batches, moderate population\n- **GPU Retraining**: More workers (6-8), larger batches, extended iterations\n\n### Expected Timelines\n\nProvides realistic runtime estimates:\n\n| Configuration | Per-Iteration | Full Run | Checkpoint Size |\n|---------------|---------------|----------|-----------------|\n| CPU PBT (10 trials, 200 iters) | 10-30 sec | 6-12 hours | ~100MB each |\n| GPU Retraining (1 trial, 500 iters) | 5-10 sec | 1-2 hours | Final only |\n\n## Integration with Training Pipeline\n\nThis guide references the training entry point:\n\n```\nitrader.rl_lib.train.train_solo_V2\n```\n\nThe guide assumes familiarity with:\n- Ray Tune PBT API\n- RLlib PPO algorithm configuration\n- Checkpoint restoration workflows\n\n## Usage Patterns\n\n### Typical Workflow\n\n```mermaid\nflowchart TD\n    A[Pre-run Validation] --> B[Launch CPU PBT]\n    B --> C[Monitor via Dashboard]\n    C --> D{Timeout or Complete?}\n    D -->|Timeout| E[Extract Best Checkpoint]\n    D -->|Complete| E\n    E --> F[GPU Retraining]\n    F --> G[Validate on Held-out Data]\n    G --> H[Phase B Integration]\n```\n\n### Command Sequence\n\n```bash\n# Phase 1: Exploration\npython -m itrader.rl_lib.train.train_solo_V2 \\\n    --cpu_pbt --pbt --pop 10 --workers 4 --iters 200 --timeout_hours 12\n\n# Phase 2: Exploitation (manual checkpoint extraction required)\npython -m itrader.rl_lib.train.train_solo_V2 \\\n    --restore <best_checkpoint_path> \\\n    --iters 500 --workers 6\n```\n\n## Key Configuration Dependencies\n\nThe guide references several configuration elements that must be properly set in the training code:\n\n- `checkpoint_interval=3` — Controls checkpoint frequency\n- `max_failures=3` — Trial retry tolerance\n- `reuse_actors=False` — Memory leak prevention\n- `metrics_sinks` — Empty for PBT (Prometheus disabled)\n- `MetricsOnlyCallback` vs `CombinedCallback` — Callback selection based on mode\n\n## Related Files\n\n| File | Relationship |\n|------|--------------|\n| `train_solo_V2.py` | Entry point for PBT commands |\n| `PBTConfig` | Hyperparameter search space definition |\n| `MetricsOnlyCallback` | Callback for PBT trials (no plots) |\n| `CombinedCallback` | Callback for single-train runs (with plots) |\n\n## Maintenance Notes\n\nWhen updating PBT configuration or adding new flags:\n\n1. Update the Quick Start Checklist with new parameters\n2. Add troubleshooting entries for new failure modes\n3. Adjust timeline estimates if iteration costs change\n4. Document any changes to checkpoint paths or formats","other-readme-md":"# Other — README.md\n\n# README.md — Project Documentation Index\n\n## Purpose\n\nThe `README.md` file serves as the primary entry point for the iTrader-AZR codebase. It provides a comprehensive overview of the autonomous trading research platform, its architecture, operational procedures, and development roadmap. This document functions as both an onboarding guide for new developers and a reference index for locating detailed documentation across the repository.\n\n## Document Structure\n\nThe README is organized into the following logical sections:\n\n| Section | Purpose |\n|---------|---------|\n| **Core Idea** | Explains the proposer-solver paradigm and RLVR principles |\n| **Repository Map** | Index of key source files with brief descriptions |\n| **Planning and Operations Docs** | Links to detailed architecture and operational documentation |\n| **Current Phase Status** | Development milestone tracking |\n| **How To Run** | Command-line reference for training, testing, and task generation |\n| **Engineering Gaps** | Technical debt and improvement priorities |\n| **Suggested Refactor Track** | Development roadmap with timeline |\n\n## Architecture Overview\n\nThe README introduces the fundamental architectural separation:\n\n```mermaid\nflowchart TB\n    subgraph PhaseA[\"Phase A (Current)\"]\n        TaskSpec[\"TaskSpec<br/>(parameterized tasks)\"]\n        Sampler[\"TaskSampler00\"]\n        Solver[\"SolverMLPFiLM<br/>(PPO + FiLM conditioning)\"]\n        Env[\"ITraderEnv<br/>(Gymnasium environment)\"]\n        Reward[\"Reward Registry<br/>(pnl_linear, pnl_sharpe, composed_linear)\"]\n    end\n    \n    subgraph PhaseB[\"Phase B (Active Development)\"]\n        Proposer[\"LLM Proposer<br/>(task curriculum generation)\"]\n        TaskPool[\"Task Pool\"]\n    end\n    \n    Proposer --> TaskPool\n    TaskPool --> Sampler\n    TaskSpec --> Sampler\n    Sampler --> Solver\n    Solver --> Env\n    Env --> Reward\n    Reward --> Solver\n```\n\n## Key Components Referenced\n\n### Core Training Pipeline\n\n| File | Role |\n|------|------|\n| `itrader/rl_lib/train/train_solo_V2.py` | Main training entry point for Phase A |\n| `itrader/rl_lib/train/train_AZR.py` | Bootstrap runner for proposer-solver handoff |\n| `itrader/envs/itrader_env.py` | Gymnasium environment with task-conditioned observations |\n| `itrader/models/solver_mlp_film.py` | FiLM-conditioned solver network |\n\n### Task System\n\n| File | Role |\n|------|------|\n| `itrader/rl_lib/tasks/spec.py` | `TaskSpec` contract definition |\n| `itrader/rl_lib/tasks/samplers.py` | Task generation and pool sampling |\n| `itrader/rl_lib/tasks/rewards.py` | Reward function registry |\n| `itrader/rl_lib/tasks/validation.py` | Task validation utilities |\n\n### Proposer Infrastructure\n\n| File | Role |\n|------|------|\n| `itrader/proposers/` | Proposer abstraction layer and `BaseProposer` |\n| `itrader/llm/proposer_llm.py` | LLM proposer integration |\n| `itrader/llm/engine.py` | LLM backend engine |\n\n## Command Reference\n\n### Training Commands\n\nThe README documents the primary training invocation:\n\n```bash\n# Standard training\npython -m itrader.rl_lib.train.train_solo_V2 --iters 200 --workers 6 --window 30 --seed 1234 --experiment_name Phase_A\n\n# CPU-safe smoke test\npython -m itrader.rl_lib.train.train_solo_V2 --cpu_pbt --iters 3 --workers 2 --window 30 --seed 2026 --experiment_name Phase_A_Smoke --data_path itrader/data/ohlcv.parquet\n```\n\n### Key CLI Flags\n\n| Flag | Values | Purpose |\n|------|--------|---------|\n| `--start_idx_mode` | `random_episode`, `stream_worker`, `task_spec` | Episode start index strategy |\n| `--ret_norm_reset` | `episode`, `stream` | Return normalization reset behavior |\n| `--stream_jump_every_episodes` | integer | Stream mode jump frequency |\n| `--stream_stride` | integer | Stream mode stride length |\n| `--auto_plot_on_end` | flag | Enable automatic plotting at run completion |\n\n### Task Generation Backends\n\n```bash\n# Rule-based (deterministic)\npython -m itrader.scripts.gen_task_pool --backend rule_based --out /tmp/tasks.jsonl --n_tasks 8\n\n# Ollama (local LLM)\npython -m itrader.scripts.gen_task_pool --backend ollama --ollama_model qwen2.5:3b --out /tmp/tasks.jsonl --n_tasks 8\n\n# vLLM/SGLang (OpenAI-compatible server)\npython -m itrader.scripts.gen_task_pool --backend vllm --api_base_url http://localhost:8000/v1 --api_model Qwen/Qwen3.5-9B --out /tmp/tasks.jsonl --n_tasks 8\n```\n\n## Output Artifacts\n\nThe README documents the training output structure:\n\n```\n~/ray_results/<experiment_name>/\n├── training_fn_*/           # Ray trial artifacts\n├── run_manifest_*.json      # Run metadata (git commit, config hash, dataset fingerprint, seed)\n└── _stable_metrics/\n    └── <trial_dir_name>/\n        ├── metrics_full.jsonl    # Flattened scalar metrics\n        ├── report_rows.csv       # Session report rows\n        └── plots/                # Auto-generated plots\n```\n\n## Documentation Hierarchy\n\nThe README serves as the root of a documentation tree:\n\n```\nREADME.md (this file)\n├── docs/architecture.md          # Baseline and target architecture\n├── docs/phase_b_plan.md           # Milestone plan and acceptance criteria\n├── docs/ops_runbook.md            # Setup and recovery procedures\n├── docs/knowledge/README.md       # GitNexus knowledge layer\n├── docs/daily_logs/COMMANDS.md    # Session logging workflow\n└── PBT_SETUP_GUIDE.md             # PBT sweep operations\n```\n\n## Development Roadmap\n\nThe README tracks engineering priorities:\n\n### Phase A (Mostly Complete)\n- Learnable reward infrastructure\n- Stable solver training with sanitization guards\n- PBT workflow with operational documentation\n\n### Phase B (Active)\n- LLM proposer integration into training loop\n- `stream_worker` stepping strategy validation\n- Full proposer-solver co-adaptation loop\n\n### Technical Debt Priorities\n\n1. **Configuration discipline** — Centralize YAML/TOML configs with schema validation\n2. **Interface contracts** — Typed interfaces between proposer, sampler, solver, environment\n3. **Testing layers** — Unit tests for reward math, integration tests for config assembly, regression tests for stability\n4. **Observability** — Standardize metric namespaces and experiment lineage tracking\n5. **Reproducibility** — Explicit seed policies, versioned dataset snapshots\n6. **Failure isolation** — Retry/recovery for checkpoint I/O and LLM task generation\n\n## Related Documentation\n\nFor detailed information on specific topics, refer to:\n\n- **Architecture details**: `docs/architecture.md`\n- **Phase B planning**: `docs/phase_b_plan.md`\n- **Operational procedures**: `docs/ops_runbook.md`\n- **PBT workflows**: `PBT_SETUP_GUIDE.md`\n- **Knowledge management**: `docs/knowledge/README.md`","other-tools-knowledge":"# Other — tools-knowledge\n\n# tools/knowledge — GitNexus Knowledge Layer\n\n## Overview\n\nThe `tools/knowledge` module provides a portable, self-contained knowledge infrastructure for repositories. It wraps GitNexus, a local code-intelligence backend, and manages:\n\n- **Repository indexing** — builds call graphs, symbol tables, and dependency maps\n- **MCP integration** — exposes GitNexus to AI agents via the Model Context Protocol\n- **Wiki generation** — creates LLM-backed documentation from the code graph\n- **Artifact synchronization** — keeps `docs/knowledge/` in sync with index state\n\nThe design is deliberately **advisory**: it augments normal development workflows without forcing agents to rely exclusively on graph-based queries. Direct file reads and grep remain valid fallbacks.\n\n## Architecture\n\n```mermaid\nflowchart TB\n    subgraph Bootstrap\n        init[init_repo_knowledge.sh]\n        templates[templates/*.tpl]\n    end\n\n    subgraph Runtime\n        lib[lib.sh]\n        gitnexus[gitnexus.sh]\n        setup[setup_gitnexus.sh]\n        index[index_repo.sh]\n        status[status.sh]\n        wiki[generate_wiki.sh]\n        http[serve_http_mcp.sh]\n        codex[codex_with_gitnexus.sh]\n    end\n\n    subgraph TargetRepo\n        tools[tools/knowledge/]\n        docs[docs/knowledge/]\n        codex_cfg[.codex/config.toml]\n        cursor_cfg[.cursor/mcp.json]\n    end\n\n    init --> tools\n    init --> docs\n    init --> codex_cfg\n    init --> cursor_cfg\n    templates --> init\n\n    lib --> gitnexus\n    lib --> index\n    lib --> wiki\n    lib --> http\n    lib --> setup\n    lib --> status\n```\n\n## Bootstrap System\n\n### `bootstrap/init_repo_knowledge.sh`\n\nSeeds a target repository with the complete knowledge layer. Run once per repo:\n\n```bash\n./tools/knowledge/bootstrap/init_repo_knowledge.sh /path/to/target-repo\n```\n\n**What it creates:**\n\n| Destination | Content |\n|-------------|---------|\n| `tools/knowledge/` | Runtime scripts (gitnexus.sh, lib.sh, etc.) |\n| `docs/knowledge/` | Skeleton files (README.md, QUICKSTART.md, WORKFLOWS.md, etc.) |\n| `.codex/config.toml` | MCP server configuration for Codex |\n| `.cursor/mcp.json` | MCP server configuration for Cursor |\n| `AGENTS.md` | Agent guidance file |\n\n**Design principle:** The bootstrap copies runtime scripts unconditionally (allowing updates) but skips existing guidance files. This lets repos customize `AGENTS.md` and workflow docs without merge conflicts on refresh.\n\n### Templates\n\nAll templates in `bootstrap/templates/` support `__REPO_NAME__` substitution:\n\n- `AGENTS.md.tpl` — Agent instructions for using GitNexus\n- `codex-config.toml.tpl` — Codex MCP configuration\n- `cursor-mcp.json.tpl` — Cursor MCP configuration\n- `docs-knowledge-*.tpl` — Documentation skeletons\n\n## Runtime Scripts\n\n### Core Library: `lib.sh`\n\nProvides shared functions for all other scripts:\n\n```bash\nsource \"${SCRIPT_DIR}/lib.sh\"\n```\n\n**Key functions:**\n\n| Function | Purpose |\n|----------|---------|\n| `ensure_gitnexus_installed` | Installs GitNexus to `~/.gitnexus-tooling/` if missing |\n| `run_gitnexus` | Executes GitNexus binary with arguments |\n| `sync_knowledge_artifacts` | Calls `sync_artifacts.py` to update `docs/knowledge/` |\n| `has_wiki_llm_config` | Checks for LLM API credentials |\n| `repo_name` | Returns the repository basename |\n\n**Environment variables:**\n\n| Variable | Default | Description |\n|----------|---------|-------------|\n| `GITNEXUS_VERSION` | `1.5.3` | GitNexus version to install |\n| `GITNEXUS_INSTALL_ROOT` | `~/.gitnexus-tooling/gitnexus-{version}` | Installation directory |\n| `GITNEXUS_CONFIG_FILE` | `~/.gitnexus/config.json` | GitNexus configuration path |\n\n### Entry Point: `gitnexus.sh`\n\nThin wrapper that sources `lib.sh` and passes all arguments to the GitNexus binary:\n\n```bash\n./tools/knowledge/gitnexus.sh <command> [args...]\n```\n\n### Setup: `setup_gitnexus.sh`\n\nVerifies GitNexus installation and reports configuration status:\n\n```bash\n./tools/knowledge/setup_gitnexus.sh\n```\n\nOutput includes:\n- GitNexus version and binary path\n- Tracked MCP configuration files\n- Next steps for indexing\n\n### Indexing: `index_repo.sh`\n\nAnalyzes the repository and builds the knowledge graph:\n\n```bash\n./tools/knowledge/index_repo.sh\n```\n\nThis:\n1. Runs `gitnexus analyze` on the repository root\n2. Calls `sync_knowledge_artifacts` to update `docs/knowledge/`\n3. Skips `AGENTS.md` regeneration (preserves customizations)\n\n### Status: `status.sh`\n\nReports index freshness and sync state:\n\n```bash\n./tools/knowledge/status.sh\n```\n\nWith `--advisory` flag, exits non-zero if the index is stale (useful for pre-commit hooks):\n\n```bash\n./tools/knowledge/status.sh --advisory\n```\n\n### Wiki Generation: `generate_wiki.sh`\n\nCreates LLM-backed documentation from the code graph:\n\n```bash\n./tools/knowledge/generate_wiki.sh\n```\n\n**Prerequisites:** One of:\n- `OPENAI_API_KEY` environment variable\n- `GITNEXUS_API_KEY` environment variable\n- `AZURE_OPENAI_API_KEY` environment variable\n- Saved `~/.gitnexus/config.json` with API credentials\n\n### HTTP MCP Server: `serve_http_mcp.sh`\n\nExposes GitNexus via HTTP for shared access:\n\n```bash\n./tools/knowledge/serve_http_mcp.sh\n```\n\n**Environment variables:**\n\n| Variable | Default | Description |\n|----------|---------|-------------|\n| `GITNEXUS_HTTP_HOST` | `0.0.0.0` | Bind address |\n| `GITNEXUS_HTTP_PORT` | `4747` | Listen port |\n\nMCP endpoint: `http://{host}:{port}/api/mcp`\n\n### Codex Integration: `codex_with_gitnexus.sh`\n\nLaunches Codex with GitNexus MCP configured:\n\n```bash\n# Uses stdio MCP (spawns GitNexus per session)\n./tools/knowledge/codex_with_gitnexus.sh\n\n# Uses HTTP MCP (shares existing server)\nGITNEXUS_USE_HTTP=1 ./tools/knowledge/codex_with_gitnexus.sh\n\n# Custom MCP URL\nGITNEXUS_MCP_URL=http://custom-host:port/api/mcp ./tools/knowledge/codex_with_gitnexus.sh\n```\n\nWhen using HTTP mode, `codex mcp list` shows the shared backend as `gitnexus_http`.\n\n### Post-Commit Refresh: `post_commit_refresh.sh`\n\nRefreshes the knowledge graph after commits:\n\n```bash\n./tools/knowledge/post_commit_refresh.sh\n```\n\nIntended for Git post-commit hooks or manual refresh after significant changes.\n\n### Pre-Commit Advisory: `pre_commit_advisory.sh`\n\nRuns status check in advisory mode:\n\n```bash\n./tools/knowledge/pre_commit_advisory.sh\n```\n\nNon-blocking — reports staleness but doesn't prevent commits.\n\n## Python Utilities\n\n### `sync_artifacts.py`\n\nSynchronizes GitNexus-generated artifacts into `docs/knowledge/`. Called automatically by `index_repo.sh` and `generate_wiki.sh`.\n\n### `status_summary.py`\n\nGenerates human-readable status summaries. Called by `status.sh`.\n\n## Typical Workflow\n\n```mermaid\nsequenceDiagram\n    participant Dev as Developer\n    participant Setup as setup_gitnexus.sh\n    participant Index as index_repo.sh\n    participant Status as status.sh\n    participant Codex as codex_with_gitnexus.sh\n\n    Dev->>Setup: Run once\n    Setup->>Setup: Install GitNexus binary\n    Setup->>Setup: Verify MCP configs\n\n    Dev->>Index: Run after major changes\n    Index->>Index: Analyze repository\n    Index->>Index: Sync artifacts\n\n    Dev->>Status: Check freshness\n    Status->>Status: Report index state\n\n    Dev->>Codex: Launch with GitNexus MCP\n    Codex->>Codex: Agent queries graph\n```\n\n## Integration Points\n\n### MCP Configuration\n\nThe bootstrap creates MCP configurations for both Codex and Cursor:\n\n**Codex (`.codex/config.toml`):**\n```toml\n[mcp_servers.gitnexus]\ncommand = \"./tools/knowledge/gitnexus.sh\"\nargs = [\"mcp\"]\n```\n\n**Cursor (`.cursor/mcp.json`):**\n```json\n{\n  \"mcpServers\": {\n    \"gitnexus\": {\n      \"command\": \"./tools/knowledge/gitnexus.sh\",\n      \"args\": [\"mcp\"]\n    }\n  }\n}\n```\n\n### Agent Guidance\n\n`AGENTS.md` instructs AI agents on preferred workflows:\n\n1. **Exploration:** `query` → `context` → source reads\n2. **Debugging:** `query` symptom → `context` suspect → source confirmation\n3. **Refactoring:** `context` + `impact` before edits, refresh after\n\nAgents are told to trust source code when GitNexus and files disagree, and to report mismatches.\n\n## Requirements\n\n- **Node.js ≥ 18** — Required by GitNexus\n- **Python 3** — Required by sync utilities\n- **npm** — Used for GitNexus installation\n- **git** — Required for repository operations\n\n## File Reference\n\n| File | Purpose |\n|------|---------|\n| `lib.sh` | Shared functions and environment |\n| `gitnexus.sh` | GitNexus binary wrapper |\n| `setup_gitnexus.sh` | Installation verification |\n| `index_repo.sh` | Repository analysis |\n| `status.sh` | Index status reporting |\n| `generate_wiki.sh` | LLM-backed wiki generation |\n| `serve_http_mcp.sh` | HTTP MCP server |\n| `codex_with_gitnexus.sh` | Codex launcher with MCP |\n| `post_commit_refresh.sh` | Post-commit graph refresh |\n| `pre_commit_advisory.sh` | Pre-commit status check |\n| `sync_artifacts.py` | Artifact synchronization |\n| `status_summary.py` | Status formatting |","other":"# Other\n\n# Other — Supporting Infrastructure & Documentation\n\n## Overview\n\nThe **Other** module aggregates supporting components that don't fit into the core source modules but are essential for project operation. These include documentation, configuration, infrastructure setup, development tools, and testing infrastructure.\n\n## Module Organization\n\n```mermaid\ngraph TB\n    subgraph \"Entry Points\"\n        README[README.md]\n        AGENTS[AGENTS.md]\n    end\n    \n    subgraph \"Documentation\"\n        DOCS[docs/]\n        DAILY[docs/daily_logs/]\n        KNOWLEDGE_DOCS[docs/knowledge/]\n    end\n    \n    subgraph \"Configuration\"\n        BEST[best_config.json]\n        ENV[env.lock.yml]\n        ITRADER[itrader/]\n    end\n    \n    subgraph \"Infrastructure\"\n        INFRA[itrader-infra/]\n        RLLIB[itrader-rl_lib/]\n        WAL[data-wal/]\n        DATA[data/]\n    end\n    \n    subgraph \"Development Tools\"\n        TOOLS[itrader-tools/]\n        SCRIPTS[itrader-scripts/]\n        KNOWLEDGE_TOOLS[tools/knowledge/]\n    end\n    \n    subgraph \"Testing\"\n        TESTS[itrader-tests/]\n    end\n    \n    README --> DOCS\n    AGENTS --> KNOWLEDGE_TOOLS\n    KNOWLEDGE_TOOLS --> KNOWLEDGE_DOCS\n```\n\n## Key Sub-modules\n\n### Documentation & Guidance\n\n| Module | Purpose |\n|--------|---------|\n| [README.md](Other-README.md) | Primary entry point and project index |\n| [AGENTS.md](Other-AGENTS.md) | Operational guidance for AI agents working in the repository |\n| [docs/](Other-docs.md) | Canonical planning, architecture, and operational documentation |\n| [docs/daily_logs/](Other-docs-daily_logs.md) | Session continuity and change tracking system |\n| [docs/knowledge/](Other-docs-knowledge.md) | Graph-native code intelligence layer |\n\n### Configuration\n\n| Module | Purpose |\n|--------|---------|\n| [best_config.json](Other-best_config.json) | Optimized RLlib PPO hyperparameters for training |\n| [env.lock.yml](Other-env.lock.yml) | Pinned conda environment for reproducibility |\n| [itrader/](Other-itrader.md) | Dependency baseline and environment configuration |\n\n### Infrastructure\n\n| Module | Purpose |\n|--------|---------|\n| [itrader-infra/](Other-itrader-infra.md) | Ray cluster configuration for local development |\n| [itrader-rl_lib/](Other-itrader-rl_lib.md) | Prometheus scrape configuration for Ray metrics |\n| [data-wal/](Other-data-wal.md) | Write-ahead log segments for crash recovery |\n| [data/](Other-data.md) | Active query state markers |\n\n### Development Tools\n\n| Module | Purpose |\n|--------|---------|\n| [itrader-tools/](Other-itrader-tools.md) | Utility script for consistent Python execution |\n| [itrader-scripts/](Other-itrader-scripts.md) | Configuration-driven A/B ablation experiment harness |\n| [tools/knowledge/](Other-tools-knowledge.md) | GitNexus wrapper for repository indexing and MCP integration |\n\n### Testing\n\n| Module | Purpose |\n|--------|---------|\n| [itrader-tests/](Other-itrader-tests.md) | Comprehensive test coverage for environment, models, and training config |\n\n## Cross-cutting Workflows\n\n### Knowledge Layer Integration\n\nThe repository uses a two-layer knowledge system:\n- [tools/knowledge/](Other-tools-knowledge.md) provides the GitNexus backend for indexing and MCP exposure\n- [docs/knowledge/](Other-docs-knowledge.md) stores the synchronized wiki and module tree\n- [AGENTS.md](Other-AGENTS.md) documents when to use knowledge queries vs. direct source inspection\n\n### Environment Setup\n\n1. Create environment from [env.lock.yml](Other-env.lock.yml)\n2. Use [itrader-tools/](Other-itrader-tools.md) for consistent Python execution\n3. Configure Ray cluster via [itrader-infra/](Other-itrader-infra.md)\n4. Enable monitoring with [itrader-rl_lib/](Other-itrader-rl_lib.md) Prometheus config\n\n### Training Pipeline\n\n1. Reference [best_config.json](Other-best_config.json) for optimized hyperparameters\n2. Follow [PBT_SETUP_GUIDE.md](Other-PBT_SETUP_GUIDE.md) for hyperparameter exploration\n3. Run ablation studies via [itrader-scripts/](Other-itrader-scripts.md)\n4. Validate with [itrader-tests/](Other-itrader-tests.md)\n\n### Session Continuity\n\nFor multi-session development:\n1. Log work in [docs/daily_logs/](Other-docs-daily_logs.md)\n2. Update architecture docs in [docs/](Other-docs.md)\n3. Sync knowledge layer via [tools/knowledge/](Other-tools-knowledge.md)","overview":"# itrader-azr — Wiki\n\n# iTrader-AZR\n\nAutonomous trading research platform implementing a proposer-solver architecture for Reinforcement Learning with Verifiable Rewards (RLVR). The system separates task generation from policy learning, enabling curriculum-based training with explicit, inspectable reward signals.\n\n## Core Concept\n\niTrader decouples the trading problem into two distinct roles:\n\n- **Solver** — Learns optimal trading behavior through PPO with a FiLM-conditioned neural network. The solver receives task specifications and learns to maximize shaped rewards.\n- **Proposer** — Generates task curricula for the solver. Currently supports rule-based sampling with a path toward LLM-native task generation.\n\nTraining follows RLVR principles: rewards are decomposed into measurable components (PnL, drawdown, turnover), tasks are sampled from parameterized specifications, and behavior is optimized under explicit constraints.\n\n## Architecture\n\n```mermaid\nflowchart TB\n    subgraph Entry[\"Entry Points\"]\n        CLI[CLI Gateway]\n        TRAIN[Training Pipeline]\n    end\n\n    subgraph Core[\"Core Loop\"]\n        PROPOSER[Task Proposer]\n        SOLVER[Solver Agent]\n        ENV[Trading Environment]\n    end\n\n    subgraph Config[\"Configuration Layer\"]\n        TASKS[Task System]\n        REWARDS[Reward System]\n    end\n\n    DATA[Data Pipeline]\n\n    CLI --> TRAIN\n    TRAIN --> PROPOSER\n    TRAIN --> SOLVER\n    PROPOSER --> TASKS\n    TASKS --> REWARDS\n    SOLVER --> ENV\n    ENV --> REWARDS\n    DATA --> ENV\n```\n\n## Key End-to-End Flows\n\n### Phase A: Solver Training\n\nThe [Training Pipeline](training-pipeline.md) orchestrates PPO training using Ray RLlib. The [Trading Environment](trading-environment.md) provides a Gymnasium-compatible interface with discrete actions (long/flat/short) and rolling OHLCV observations. The [Solver Agent](agent-architecture.md) uses neural networks from the [Neural Network Models](neural-network-models.md) module—typically `SolverMLPFiLM` for task-conditioned learning.\n\n### Phase B: AZR Bootstrap\n\nThe proposer generates task specifications that define training objectives. [Task Proposers](task-proposers.md) can use rule-based sampling, Ollama local inference, or OpenAI-compatible endpoints. The [LLM Integration](llm-integration.md) module provides both a lightweight llama.cpp engine and a full-featured Transformers-based proposer with 4-bit quantization.\n\n### Reward Computation\n\nThe [Reward System](reward-system.md) uses a registry-based architecture where reward functions are decoupled from environment logic. The [Task System](task-system.md) validates and clamps task parameters before passing them to the reward engine, ensuring verifiable reward shaping.\n\n## Development Phases\n\n| Phase | Focus | Status |\n|-------|-------|--------|\n| A | Stable solver learning with verifiable reward shaping | Active |\n| B | LLM-based proposer integration and AZR loop validation | Planned |\n\n## Getting Started\n\nThe [Core Application](core-application.md) module provides a unified CLI entry point:\n\n```bash\n# Train a solver (Phase A)\npython -m itrader train --config config.yaml\n\n# Train with AZR bootstrap (Phase B)\npython -m itrader train-azr --config config.yaml\n\n# Validate environment setup\npython -m itrader healthcheck\n```\n\nThe [Data Pipeline](data-pipeline.md) handles market data collection via Polygon API, storage in DuckDB, and ETL processing for training. Use the [Diagnostic Tools](diagnostic-tools.md) to validate your environment and inspect training runs.\n\n## Module Navigation\n\n- **Training**: [Training Pipeline](training-pipeline.md) → [Trading Environment](trading-environment.md) → [Agent Architecture](agent-architecture.md)\n- **Task Generation**: [Task Proposers](task-proposers.md) → [Task System](task-system.md) → [Reward System](reward-system.md)\n- **Infrastructure**: [Data Pipeline](data-pipeline.md) → [LLM Integration](llm-integration.md) → [Experiment Scripts](experiment-scripts.md)\n- **Utilities**: [Diagnostic Tools](diagnostic-tools.md) → [Knowledge Management](knowledge-management.md)","reward-system":"# Reward System\n\n# Reward System\n\nThe `rewards.py` module provides a registry-based reward computation framework for reinforcement learning environments. It decouples reward function implementations from environment logic, enabling configurable, extensible reward shaping for trading agents.\n\n## Architecture Overview\n\n```mermaid\ngraph TD\n    subgraph Registry\n        REG[_REGISTRY]\n        RS[RewardSpec]\n    end\n    \n    subgraph Engine\n        RE[RewardEngine]\n        RE -->|compute| REG\n        RE -->|normalize_params| REG\n        RE -->|sample_params| REG\n    end\n    \n    subgraph Functions\n        RPL[reward_pnl_linear]\n        RPS[reward_pnl_sharpe]\n        RCL[reward_composed_linear]\n    end\n    \n    RPL -->|register| REG\n    RPS -->|register| REG\n    RCL -->|register| REG\n    \n    subgraph Consumers\n        ENV[itrader_env.step]\n        VAL[validation.validate_and_clamp_task]\n        SAM[samplers._reward_params_for]\n    end\n    \n    ENV -->|compute| RE\n    VAL -->|normalize_params| RE\n    SAM -->|sample_params| RE\n```\n\n## Core Types\n\n### Type Aliases\n\n```python\nRewardFn = Callable[[dict[str, Any], dict[str, Any]], tuple[float, dict[str, float]]]\nRewardParamNormalizer = Callable[[dict[str, Any]], dict[str, Any]]\nRewardParamSampler = Callable[[Any], dict[str, Any]]\n```\n\n- **`RewardFn`**: Computes reward from parameters and context. Returns `(total_reward, component_dict)`.\n- **`RewardParamNormalizer`**: Validates and constrains parameters to valid ranges.\n- **`RewardParamSampler`**: Generates random parameter configurations using an RNG.\n\n### RewardSpec\n\n```python\n@dataclass(frozen=True)\nclass RewardSpec:\n    fn: RewardFn\n    normalize_params: Optional[RewardParamNormalizer] = None\n    sample_params: Optional[RewardParamSampler] = None\n```\n\nImmutable specification bundling a reward function with optional normalization and sampling logic.\n\n## RewardEngine\n\nStatic interface for reward computation and parameter management.\n\n### Methods\n\n| Method | Purpose |\n|--------|---------|\n| `compute(reward_id, params, ctx)` | Execute reward function, sanitize outputs |\n| `normalize_params(reward_id, params)` | Apply parameter validation/constraints |\n| `sample_params(reward_id, rng)` | Generate random valid parameters |\n| `registered_ids()` | List available reward functions |\n\n### Usage Example\n\n```python\nfrom rl_lib.tasks.rewards import RewardEngine\n\n# Compute reward\nreward, components = RewardEngine.compute(\n    reward_id=\"pnl_linear\",\n    params={\"pnl_w\": 1.0, \"dd_w\": 0.04},\n    ctx={\"pnl_delta\": 0.02, \"turnover_t\": 100, \"dd_inc\": 0.01}\n)\n\n# Sample random parameters\nparams = RewardEngine.sample_params(\"pnl_linear\", rng=numpy_random)\n```\n\n### Output Sanitization\n\n`RewardEngine.compute` guarantees finite outputs:\n- Non-finite rewards return `0.0`\n- Non-finite component values return `0.0`\n- Unknown `reward_id` raises `KeyError`\n\n## Registered Reward Functions\n\n### pnl_linear\n\nLinear combination of PnL delta, turnover cost, and drawdown penalty with configurable normalization.\n\n**Parameters:**\n\n| Parameter | Type | Default | Range | Description |\n|-----------|------|---------|-------|-------------|\n| `pnl_w` | float | 1.0 | [0.0, 10.0] | PnL weight |\n| `turnover_w` | float | 0.0 | [0.0, 0.01] | Turnover cost weight |\n| `dd_mode` | str | \"delta\" | {\"none\", \"delta\", \"terminal\"} | Drawdown calculation mode |\n| `dd_w` | float | 0.04 | [0.0, 0.2] | Drawdown weight (delta mode) |\n| `dd_T_weight` | float | 0.0 | [0.0, 1.0] | Terminal drawdown weight |\n| `turnover_cap` | float | 0.02 | [0.0, 0.1] | Maximum turnover penalty |\n| `dd_cap` | float | 0.05 | [0.0, 0.2] | Maximum drawdown penalty |\n| `reward_scale` | float | 1.0 | [0.1, 10.0] | Final reward multiplier |\n| `normalize` | bool | True | — | Enable unit normalization |\n| `norm_mode` | str | \"all\" | {\"all\", \"penalties\", \"off\"} | What to normalize |\n| `unit_clip` | float | 1e8 | [1.0, ∞) | Maximum unit value |\n\n**Context Fields:**\n\n| Field | Type | Description |\n|-------|------|-------------|\n| `pnl_delta` | float | Change in PnL |\n| `turnover_t` | float | Turnover at step t |\n| `dd_inc` | float | Drawdown increment (delta mode) |\n| `max_dd` | float | Maximum drawdown (terminal mode) |\n| `terminal` | bool | Episode termination flag |\n| `ret_unit` | float | Normalization unit |\n\n**Formula:**\n\n```\nr = pnl_w * pnl_delta * unit - turnover_w * turnover_t - dd_w * dd_inc * unit\nr *= reward_scale\n```\n\n### pnl_sharpe\n\nSimplified Sharpe-style reward with PnL, drawdown, and turnover components.\n\n**Parameters:**\n\n| Parameter | Type | Default | Range |\n|-----------|------|---------|-------|\n| `pnl_w` | float | 1.0 | [0.0, 10.0] |\n| `dd_w` | float | 0.0 | [0.0, 0.2] |\n| `turnover_w` | float | 0.0 | [0.0, 0.01] |\n\n**Context Fields:**\n\n| Field | Type | Description |\n|-------|------|-------------|\n| `pnl_t` | float | PnL at time t |\n| `pnl_t1` | float | PnL at time t+1 |\n| `dd_t1` | float | Drawdown at t+1 |\n| `turnover_t` | float | Turnover at step t |\n\n**Formula:**\n\n```\npnl_delta = pnl_t1 - pnl_t\nreward = pnl_w * pnl_delta - dd_w * dd_t1 - turnover_w * turnover_t\n```\n\n### composed_linear\n\nExtensible weighted sum over arbitrary context components. Automatically discovers weights from parameter keys ending in `_w`.\n\n**Usage:**\n\n```python\nparams = {\n    \"pnl_w\": 1.0,\n    \"dd_w\": 0.04,\n    \"turnover_w\": 0.001,\n    \"custom_w\": 0.5  # arbitrary component\n}\nctx = {\"pnl_delta\": 0.02, \"dd_t1\": 0.01, \"turnover_t\": 100, \"custom\": 0.5}\n```\n\n**Built-in Aliases:**\n\n| Alias | Context Key |\n|-------|-------------|\n| `dd` | `dd_t1` |\n| `turnover` | `turnover_t` |\n| `pnl_delta` | `pnl_delta` |\n| `ret` | `ret` |\n\n## Registration\n\nRegister custom reward functions using the `@register` decorator:\n\n```python\nfrom rl_lib.tasks.rewards import register, RewardEngine\n\n

var PAGES = {"agent-architecture":"# Agent Architecture\n\n# Agent Architecture Module\n\n## Overview\n\nThe `itrader.agents` module defines the agent abstraction layer for the trading system. Agents are autonomous decision-making components that observe market state and execute trading actions. This module provides the base interfaces and concrete implementations for different agent types.\n\n## Module Structure\n\n```\nitrader/agents/\n├── __init__.py           # Package initialization\n├── solver_base.py        # Abstract base class for all solvers\n├── solver_mlp.py         # MLP-based solver implementation\n└── proposer_lora.py      # LoRA-based proposer agent\n```\n\n## Core Components\n\n### SolverBase\n\nThe abstract base class that defines the contract for all solver agents. Every solver must implement two fundamental operations:\n\n```python\nclass SolverBase:\n    \"\"\"Abstract base for all solver agents.\"\"\"\n    def act(self, obs): raise NotImplementedError\n    def learn(self, *args, **kwargs): raise NotImplementedError\n```\n\n#### Methods\n\n| Method | Signature | Description |\n|--------|-----------|-------------|\n| `act` | `act(self, obs) -> Action` | Select an action given an observation. Must be implemented by all concrete solvers. |\n| `learn` | `learn(self, *args, **kwargs) -> None` | Update internal model parameters from experience. Signature is flexible to accommodate different learning paradigms. |\n\n#### Design Intent\n\n`SolverBase` establishes a minimal but complete interface that supports both:\n\n- **Inference**: The `act()` method handles real-time decision making\n- **Training**: The `learn()` method supports online learning, batch updates, or reinforcement learning\n\nConcrete implementations determine the actual learning algorithm and action selection strategy.\n\n## Agent Types\n\n### Solver Agents (`solver_mlp.py`)\n\nSolver agents are responsible for executing trading decisions. They receive observations and output actions. The MLP variant uses a multi-layer perceptron architecture for decision making.\n\n### Proposer Agents (`proposer_lora.py`)\n\nProposer agents suggest potential strategies or parameter configurations. The LoRA variant uses Low-Rank Adaptation for efficient fine-tuning, enabling rapid adaptation to changing market conditions.\n\n## Architecture Pattern\n\n```mermaid\nclassDiagram\n    class SolverBase {\n        <<abstract>>\n        +act(obs) Action\n        +learn(*args, **kwargs) void\n    }\n    \n    class SolverMLP {\n        -model: nn.Module\n        +act(obs) Action\n        +learn(*args, **kwargs) void\n    }\n    \n    class ProposerLoRA {\n        -base_model: nn.Module\n        -lora_adapter: Module\n        +propose(context) Proposal\n        +learn(*args, **kwargs) void\n    }\n    \n    SolverBase <|-- SolverMLP\n```\n\n## Integration Points\n\n### Environment Integration\n\nAgents receive observations from the trading environment and return actions that modify portfolio state:\n\n```\nEnvironment → observation → Agent → action → Environment\n```\n\n### Training Loop Integration\n\nThe `learn()` method integrates with the training pipeline:\n\n```python\n# Typical usage pattern\nsolver = SolverMLP(...)\nfor episode in training_loop:\n    obs = env.reset()\n    action = solver.act(obs)\n    next_obs, reward, done, info = env.step(action)\n    solver.learn(obs, action, reward, next_obs, done)\n```\n\n## Extending the Module\n\nTo implement a new solver:\n\n1. Subclass `SolverBase`\n2. Implement `act(self, obs)` to return valid actions\n3. Implement `learn(self, *args, **kwargs)` for your training paradigm\n4. Register in `__init__.py` for module-level exports\n\n```python\nfrom itrader.agents.solver_base import SolverBase\n\nclass MyCustomSolver(SolverBase):\n    def act(self, obs):\n        # Your action selection logic\n        return action\n    \n    def learn(self, *args, **kwargs):\n        # Your learning update logic\n        pass\n```","core-application":"# Core Application\n\n# Core Application Module\n\nThe `itrader` core module provides a unified command-line interface gateway for the entire application. It implements a dispatcher pattern that routes CLI commands to their respective handler modules.\n\n## Architecture Overview\n\n```mermaid\ngraph LR\n    A[\"python -m itrader\"] --> B[\"main()\"]\n    B --> C{command?}\n    C -->|help| D[\"print help\"]\n    C -->|train| E[\"itrader.rl_lib.train.train_solo_V2\"]\n    C -->|train-azr| F[\"itrader.rl_lib.train.train_AZR\"]\n    C -->|healthcheck| G[\"itrader.tools.healthcheck\"]\n    C -->|ablation| H[\"itrader.scripts.experiments.run_ablation\"]\n    C -->|gen-task-pool| I[\"itrader.scripts.gen_task_pool\"]\n    C -->|unknown| J[\"error exit 2\"]\n```\n\n## Entry Point\n\nThe module is invoked via `python -m itrader`. The `__main__.py` file handles this entry point and delegates execution to the appropriate submodule.\n\n## Command Registry\n\nCommands are defined in `COMMAND_TO_MODULE` dictionary:\n\n| Command | Target Module | Purpose |\n|---------|---------------|---------|\n| `train` | `itrader.rl_lib.train.train_solo_V2` | Standard training workflow |\n| `train-azr` | `itrader.rl_lib.train.train_AZR` | AZR training variant |\n| `healthcheck` | `itrader.tools.healthcheck` | System health verification |\n| `ablation` | `itrader.scripts.experiments.run_ablation` | Ablation experiment runner |\n| `gen-task-pool` | `itrader.scripts.gen_task_pool` | Task pool generation |\n\n## Execution Flow\n\n### Argument Parsing\n\nThe `_build_parser()` function creates a minimal `ArgumentParser` that:\n- Accepts a single positional `command` argument (defaults to `\"help\"`)\n- Passes any remaining arguments through to the target module\n\n### Command Dispatch\n\nThe `main()` function orchestrates the dispatch:\n\n1. Parses known arguments, separating the command from remainder args\n2. Normalizes command to lowercase\n3. Handles help requests (`help`, `-h`, `--help`) by printing usage and exiting cleanly\n4. Looks up the command in `COMMAND_TO_MODULE`\n5. On unknown command: prints help, shows error, returns exit code 2\n6. On valid command: rewrites `sys.argv` and uses `runpy.run_module()` to execute the target\n\n### Argument Forwarding\n\nRemaining CLI arguments are forwarded to the target module via `sys.argv` rewrite:\n\n```python\nsys.argv = [f\"python -m {module}\", *remainder]\n```\n\nThis allows submodules to define their own argument parsers without modification.\n\n## Adding New Commands\n\nTo register a new command:\n\n1. Add entry to `COMMAND_TO_MODULE`:\n   ```python\n   COMMAND_TO_MODULE = {\n       ...\n       \"new-command\": \"itrader.path.to.module\",\n   }\n   ```\n\n2. Ensure the target module has a `if __name__ == \"__main__\":` entry point\n\n## Exit Codes\n\n| Code | Meaning |\n|------|---------|\n| 0 | Success (including help display) |\n| 2 | Unknown command |\n\n## Usage Examples\n\n```bash\n# Show help\npython -m itrader help\npython -m itrader\n\n# Run training\npython -m itrader train --config config.yaml\n\n# Run healthcheck\npython -m itrader healthcheck\n\n# Run ablation with args forwarded\npython -m itrader ablation --experiment baseline\n```","data-pipeline":"# Data Pipeline\n\n# Data Pipeline Module\n\nThe `itrader/inputs` module provides a complete data pipeline for collecting, storing, and transforming market data. It handles historical backfill, real-time streaming, ETL processing, and data loading for downstream training workflows.\n\n## Architecture Overview\n\n```mermaid\nflowchart LR\n    subgraph Sources\n        A[Polygon REST API]\n        B[Polygon WebSocket]\n    end\n    \n    subgraph Storage\n        C[(DuckDB<br/>ticks table)]\n    end\n    \n    subgraph Processing\n        D[etl_job.py<br/>Resample + Features]\n    end\n    \n    subgraph Output\n        E[(ohlcv.parquet)]\n    end\n    \n    subgraph Consumers\n        F[PA_helpers.py<br/>load_market_data]\n    end\n    \n    A -->|backfill.py| C\n    B -->|live_data.py| C\n    C --> D\n    D --> E\n    E --> F\n```\n\n## Pipeline Stages\n\n### Stage 1: Data Ingestion\n\nTwo complementary ingestion paths populate the raw `ticks` table in DuckDB:\n\n| Path | Script | Use Case | Rate Limiting |\n|------|--------|----------|---------------|\n| Historical | `backfill.py` | Initial data load, gap filling | 5 calls/min (13s sleep) |\n| Real-time | `live_data.py` | Live trading, continuous updates | WebSocket (no limit) |\n\nBoth paths write to the same schema:\n```sql\nCREATE TABLE ticks(\n    ts TIMESTAMP,\n    symbol VARCHAR,\n    price DOUBLE,\n    size BIGINT\n);\n```\n\n### Stage 2: ETL Processing\n\n`etl_job.py` reads raw ticks, resamples to 1-minute OHLCV bars, adds technical indicators, and writes to Parquet for efficient downstream access.\n\n### Stage 3: Data Loading\n\n`PA_helpers.py` provides the interface consumed by Phase-A PPO training, loading the processed Parquet into GPU-ready float32 arrays.\n\n---\n\n## Components\n\n### backfill.py — Historical Data Ingestion\n\nFetches historical minute-bar data from Polygon's REST API with built-in resumability.\n\n**Key Features:**\n- **Rate limit compliance**: Enforces 13-second sleep between API calls (Polygon's 5 calls/min limit)\n- **Resumable**: Tracks progress per symbol in `_backfill_cursor` table\n- **Chunked fetching**: Processes data in 5-day slices to stay within API limits\n\n**Entry Point:**\n```python\ndef main() -> int:\n    # Orchestrates: args → symbols → date ranges → API calls → DB inserts\n```\n\n**Core Functions:**\n\n| Function | Purpose |\n|----------|---------|\n| `_parse_args()` | CLI argument parsing (--symbols, --days, --api-key) |\n| `_resolve_api_key(cli_key)` | Returns API key from CLI or `POLYGON_API_KEY` env var |\n| `_symbols_arg(raw_symbols)` | Parses comma-separated symbol list |\n| `_resume_date(con, symbol, start_date)` | Returns resume point from cursor table |\n| `_date_slices(start, end)` | Yields 5-day chunks as `(start, end)` tuples |\n| `grab(sym, date_from, date_to, api_key)` | Fetches bars from Polygon API |\n| `_insert_bars(con, symbol, bars)` | Writes bars to `ticks` table |\n| `_ensure_cursor_table(con)` | Creates/resets cursor tracking table |\n\n**Usage:**\n```bash\n# Single symbol, 2 years\npython itrader/inputs/backfill.py --symbols AAPL --days 730\n\n# Multiple symbols, 1 year\npython itrader/inputs/backfill.py --symbols AAPL,MSFT,AMZN --days 365\n\n# With explicit API key\npython itrader/inputs/backfill.py --symbols AAPL --days 365 --api-key YOUR_KEY\n```\n\n**Resume Behavior:**\nThe `_backfill_cursor` table stores the last successfully processed date per symbol. On restart, `_resume_date()` calculates where to continue, preventing duplicate data.\n\n---\n\n### live_data.py — Real-Time Streaming\n\nStreams live trade data via WebSocket into DuckDB.\n\n**Key Design Principle:** Raw tick data remains immutable. The ETL job reads from this table, ensuring reproducibility across multiple runs.\n\n**Entry Point:**\n```python\nasync def stream() -> None:\n    # WebSocket loop: auth → subscribe → receive → insert\n```\n\n**Core Functions:**\n\n| Function | Purpose |\n|----------|---------|\n| `_require_api_key()` | Validates `POLYGON_API_KEY` env var exists |\n| `_configured_symbols()` | Returns symbol list from `POLYGON_SYMBOLS` or defaults |\n| `_connect_db()` | Opens DuckDB connection, creates `ticks` table if needed |\n| `_trade_rows(messages)` | Extracts `(ts, symbol, price, size)` from WebSocket messages |\n\n**Configuration:**\n\n| Environment Variable | Default | Description |\n|---------------------|---------|-------------|\n| `POLYGON_API_KEY` | (required) | API key for authentication |\n| `POLYGON_SYMBOLS` | `AAPL,MSFT,AMZN` | Comma-separated symbol list |\n| `POLYGON_WS_URL` | `wss://socket.polygon.io/stocks` | WebSocket endpoint |\n| `ITRADER_DUCKDB_PATH` | `itrader/data/itrader.duckdb` | Database path |\n\n**Usage:**\n```bash\nexport POLYGON_API_KEY=your_key\nexport POLYGON_SYMBOLS=AAPL,MSFT\npython itrader/inputs/live_data.py\n```\n\n---\n\n### etl_job.py — OHLCV Bar Construction\n\nTransforms raw ticks into 1-minute OHLCV bars with technical indicators.\n\n**Entry Point:**\n```python\ndef main() -> int:\n    # Pipeline: load ticks → build bars → add features → write parquet\n```\n\n**Core Functions:**\n\n| Function | Purpose |\n|----------|---------|\n| `_load_ticks(con)` | Reads all ticks from DuckDB into DataFrame |\n| `_build_bars(ticks)` | Resamples to 1-min OHLCV via groupby aggregation |\n| `_add_features(bars)` | Adds RSI14 and SMA20 indicators per symbol |\n\n**Bar Construction Logic:**\n```python\n# Aggregation per (symbol, 1-minute bucket):\nopen   = first price\nhigh   = max price\nlow    = min price\nclose  = last price\nvolume = sum of sizes\n```\n\n**Technical Indicators:**\n- **RSI14**: 14-period Relative Strength Index (via `ta.momentum.rsi`)\n- **SMA20**: 20-period Simple Moving Average (via `ta.trend.sma_indicator`)\n\nBoth indicators are computed per-symbol using `groupby(\"symbol\").transform()`.\n\n**Output:**\n- Path: `itrader/data/ohlcv.parquet`\n- Format: Parquet, unindexed\n- Schema: `ts, symbol, open, high, low, close, volume, rsi14, sma20`\n\n**Usage:**\n```bash\npython itrader/inputs/etl_job.py\n```\n\n---\n\n### PA_helpers.py — Data Loading for Training\n\nLightweight utilities for loading processed data into training workflows.\n\n**Functions:**\n\n#### `load_market_data(path) → np.ndarray`\n\nLoads the Parquet file and returns a float32 NumPy array.\n\n```python\nfrom itrader.inputs.PA_helpers import load_market_data\n\n# Returns shape [T, 5] with columns: open, high, low, close, volume\narr = load_market_data(\"itrader/data/ohlcv.parquet\")\n```\n\n**Path Resolution:**\n1. Try path as-is\n2. Try path relative to repo root\n3. Raise `FileNotFoundError` with guidance\n\n**Column Handling:**\n- Expects columns: `open`, `high`, `low`, `close`, `volume` (case-insensitive)\n- Raises `ValueError` if any required column is missing\n- Sorts by index before extraction\n\n#### `compute_valid_indices(array, window_size) → np.ndarray`\n\nReturns all valid starting indices for sliding windows.\n\n```python\nfrom itrader.inputs.PA_helpers import compute_valid_indices\n\n# For array of length 1000 with window 50\nindices = compute_valid_indices(arr, window_size=50)\n# Returns [0, 1, 2, ..., 949] (950 valid starts)\n```\n\n**Internal Functions:**\n\n| Function | Purpose |\n|----------|---------|\n| `_resolve_input_path(path)` | Handles relative/absolute path resolution |\n| `_core_columns(df)` | Validates and returns OHLCV column names |\n\n---\n\n## Data Flow Summary\n\n```\n┌─────────────────────────────────────────────────────────────────┐\n│                        Ingestion Layer                          │\n│  backfill.py (historical)  │  live_data.py (real-time)          │\n│         ↓                  │         ↓                          │\n│  ┌─────────────────────────────────────────────────────────┐   │\n│  │              DuckDB: ticks table                         │   │\n│  │  (ts, symbol, price, size) — immutable raw data         │   │\n│  └─────────────────────────────────────────────────────────┘   │\n└─────────────────────────────────────────────────────────────────┘\n                              ↓\n┌─────────────────────────────────────────────────────────────────┐\n│                      Processing Layer                           │\n│  etl_job.py                                                     │\n│    • Resample to 1-min bars                                     │\n│    • Add RSI14, SMA20                                          │\n│    • Write to Parquet                                          │\n└─────────────────────────────────────────────────────────────────┘\n                              ↓\n┌─────────────────────────────────────────────────────────────────┐\n│                       Output Layer                              │\n│  ohlcv.parquet                                                  │\n│    • Sorted by timestamp                                        │\n│    • Float32-ready for GPU                                      │\n└─────────────────────────────────────────────────────────────────┘\n                              ↓\n┌─────────────────────────────────────────────────────────────────┐\n│                      Consumer Layer                             │\n│  PA_helpers.py                                                  │\n│    • load_market_data() → np.ndarray [T, 5]                    │\n│    • compute_valid_indices() → sliding window starts           │\n└─────────────────────────────────────────────────────────────────┘\n```\n\n---\n\n## Common Workflows\n\n### Initial Setup (Historical Data)\n\n```bash\n# 1. Set API key\nexport POLYGON_API_KEY=your_key\n\n# 2. Backfill historical data\npython itrader/inputs/backfill.py --symbols AAPL,MSFT,AMZN --days 365\n\n# 3. Run ETL to generate bars\npython itrader/inputs/etl_job.py\n```\n\n### Live Trading Setup\n\n```bash\n# Terminal 1: Start real-time stream\nexport POLYGON_API_KEY=your_key\nexport POLYGON_SYMBOLS=AAPL,MSFT\npython itrader/inputs/live_data.py\n\n# Terminal 2: Periodic ETL (e.g., via cron or manual)\npython itrader/inputs/etl_job.py\n```\n\n### Loading Data for Training\n\n```python\nfrom itrader.inputs.PA_helpers import load_market_data, compute_valid_indices\n\n# Load processed bars\ndata = load_market_data(\"itrader/data/ohlcv.parquet\")  # shape: [T, 5]\n\n# Get valid window starts for training\nwindow_size = 100\nvalid_starts = compute_valid_indices(data, window_size)\n```\n\n---\n\n## File Locations\n\n| File | Purpose |\n|------|---------|\n| `itrader/data/itrader.duckdb` | DuckDB database containing raw `ticks` table |\n| `itrader/data/ohlcv.parquet` | Processed OHLCV bars with indicators |\n\nBoth paths are configurable via environment variables (`ITRADER_DUCKDB_PATH`) or function parameters.","diagnostic-tools":"# Diagnostic Tools\n\n# Diagnostic Tools Module\n\nThe `itrader/tools` package provides three standalone CLI utilities for monitoring training runs, validating environments, and visualizing experiment results. These tools operate independently and do not import from the main itrader codebase.\n\n## Tools Overview\n\n| Tool | Purpose | Input | Output |\n|------|---------|-------|--------|\n| `healthcheck.py` | Validate runtime environment | None | JSON status report |\n| `diagnose_run.py` | Quick training diagnostics | Ray results directory | Console output with hints |\n| `plot_ray_results.py` | Generate metric visualizations | Trial directory or metrics file | PNG plots + summary |\n\n---\n\n## healthcheck.py\n\nLightweight environment validator for CI pipelines and local development. Checks that required dependencies are importable and reports CUDA availability.\n\n### Usage\n\n```bash\npython -m itrader.tools.healthcheck\n```\n\n### Output Structure\n\nReturns a JSON object with the following structure:\n\n```json\n{\n  \"python\": \"3.11.5\",\n  \"platform\": \"macOS-14.0-arm64\",\n  \"required\": {\n    \"numpy\": {\"ok\": true, \"version_or_error\": \"1.26.0\"},\n    \"pandas\": {\"ok\": true, \"version_or_error\": \"2.1.0\"},\n    \"torch\": {\"ok\": true, \"version_or_error\": \"2.1.0\"},\n    \"ray\": {\"ok\": true, \"version_or_error\": \"2.6.0\"},\n    \"gymnasium\": {\"ok\": true, \"version_or_error\": \"0.29.0\"},\n    \"duckdb\": {\"ok\": true, \"version_or_error\": \"0.9.0\"}\n  },\n  \"optional\": {\n    \"llama_cpp\": {\"ok\": false, \"version_or_error\": \"ModuleNotFoundError: ...\"},\n    \"transformers\": {\"ok\": true, \"version_or_error\": \"4.35.0\"}\n  },\n  \"cuda\": {\n    \"available\": true,\n    \"device_count\": 1,\n    \"device_name\": \"NVIDIA GeForce RTX 3080\"\n  }\n}\n```\n\n### Exit Codes\n\n- `0`: All required packages importable\n- `1`: One or more required packages failed to import\n\n### Implementation Details\n\nThe `_import_version()` function attempts to import a package and extract its `__version__` attribute, returning a tuple of `(success, version_or_error_message)`.\n\n---\n\n## diagnose_run.py\n\nQuick diagnostic tool for identifying common training issues. Reads the most recent trial's `progress.csv` and prints the last 30 iterations with actionable hints.\n\n### Usage\n\n```bash\npython -m itrader.tools.diagnose_run /path/to/ray_results/Phase_A\n```\n\n### Column Selection\n\nThe `_selected_columns()` function builds a column list from:\n\n1. **Base columns** (if present in the dataframe):\n   - `training_iteration`\n   - `episode_return_mean`\n   - `entropy`\n   - `policy_loss`\n   - `value_loss`\n   - `custom_metrics/success_mean`\n\n2. **Action columns**: All columns matching `custom_metrics/act_*_mean` (sorted)\n\n3. **Reward component columns**: All columns matching `custom_metrics/rc_*_mean` (sorted)\n\n### Diagnostic Hints\n\nAfter printing the table, the tool checks for:\n\n| Condition | Hint |\n|-----------|------|\n| `entropy < 0.05` | Policy collapsed. Increase `entropy_coeff` or check observation scaling. |\n| `episode_return_mean < 0` | Negative returns. Try zeroing penalties/fees to sanity-check learnability. |\n\n### Trial Selection\n\nThe `last_trial_dir()` function finds the most recently modified subdirectory:\n\n```python\ntrials = sorted(\n    (path for path in root.glob(\"*/\") if path.is_dir()),\n    key=lambda path: path.stat().st_mtime\n)\n```\n\n---\n\n## plot_ray_results.py\n\nComprehensive visualization tool for Ray Tune experiment results. Generates multiple plot types from trial data with robust fallback loading.\n\n### Usage\n\n```bash\n# From trial directory\npython -m itrader.tools.plot_ray_results /path/to/trial_dir\n\n# Direct metrics file\npython -m itrader.tools.plot_ray_results --metrics-jsonl /path/to/metrics_full.jsonl\n\n# Custom output location\npython -m itrader.tools.plot_ray_results /path/to/trial_dir --out /custom/output/dir\n```\n\n### Data Loading Pipeline\n\nThe `load_trial_df()` function attempts to load data from multiple sources in order:\n\n```mermaid\nflowchart TD\n    A[load_trial_df] --> B[_load_progress_csv]\n    B -->|success| H[Return DataFrame]\n    B -->|fail| C[_load_metrics_jsonl]\n    C -->|success| H\n    C -->|fail| D[_load_result_json]\n    D -->|success| H\n    D -->|fail| E[_load_stable_metrics_for_trial]\n    E -->|success| H\n    E -->|fail| F[SystemExit]\n```\n\n#### Source Priority\n\n1. **progress.csv**: Standard Ray CSV output (preferred)\n2. **metrics_full.jsonl**: JSONL metrics file in trial or `rllib/` subdirectory\n3. **result.json**: JSON result file in trial or `rllib/` subdirectory\n4. **Stable metrics**: Fallback to `~/.ray_results/_stable_metrics/{trial_name}/metrics_full.jsonl`\n\n### Output Files\n\n| File | Content |\n|------|---------|\n| `original_metrics.png` | Episode return, entropy/length, losses, action fractions |\n| `enhanced_metrics.png` | Extended view with reward components |\n| `task_sampler_metrics.png` | Success rate, task horizon, reward components, throughput |\n| `plot_summary.txt` | Metadata: source path, iteration count, column list |\n\n### X-Axis Selection\n\nThe `pick_x_axis()` function selects the x-axis column with this priority:\n\n1. `training_iteration`\n2. `iteration`\n3. `iterations_since_restore`\n4. `time_total_s`\n5. Falls back to integer index if none found\n\n### Plot Functions\n\nEach plot function follows the same pattern:\n\n```python\ndef plot_XXX_metrics(df: pd.DataFrame, out: Path, xcol: str | None):\n    # Create figure with subplots\n    fig, axes = plt.subplots(n_rows, 1, figsize=(width, height))\n    \n    # Plot series with _plot_series()\n    # Hide empty axes with _hide_axis_if_empty()\n    \n    # Save to out/filename.png\n```\n\nThe `_plot_series()` helper handles edge cases:\n- Single-point series: Plots as markers only (no line)\n- Multi-point series: Plots as line with small markers\n- Missing/NaN values: Filters to valid points only\n\n### JSON Flattening\n\nFor `result.json` files with nested structures, `_flatten_record()` recursively flattens dictionaries:\n\n```python\n# Input: {\"metrics\": {\"reward\": {\"mean\": 1.5}}}\n# Output: {\"metrics/reward/mean\": 1.5}\n```\n\n---\n\n## Common Patterns\n\n### Headless Operation\n\n`plot_ray_results.py` forces the Agg backend before importing pyplot:\n\n```python\nimport matplotlib\nmatplotlib.use(\"Agg\")\nimport matplotlib.pyplot as plt\n```\n\nThis ensures the tool works in CI environments without display.\n\n### Empty Data Handling\n\nMultiple guards prevent crashes on malformed data:\n\n```python\n# Check for empty/numeric columns\nif df.empty or _columns_look_numeric(df.columns):\n    return None\n\n# Check for plottable data\nif not y.notna().any():\n    continue\n```\n\n### Path Resolution\n\nOutput directory resolution follows this logic:\n\n1. Use `--out` argument if provided\n2. For `--metrics-jsonl`, use `{parent_dir}/plots`\n3. Check for stable metrics; use `{stable_trial_dir}/plots` if present\n4. Fall back to `{trial_dir}/plots`\n\n---\n\n## Integration Points\n\nThese tools are designed for offline analysis and do not integrate with the training pipeline directly. Typical workflow:\n\n1. Run `healthcheck.py` before training to validate environment\n2. During/after training, run `diagnose_run.py` for quick sanity checks\n3. Generate detailed visualizations with `plot_ray_results.py` for deeper analysis\n\nThe tools read standard Ray Tune output formats and require no itrader-specific configuration.","experiment-scripts":"# Experiment Scripts\n\n# Experiment Scripts Module\n\nThe `itrader.scripts` module provides command-line utilities for running experiments, generating training tasks, and analyzing results from RLlib training runs.\n\n## Module Overview\n\n```\nitrader/scripts/\n├── __init__.py\n├── experiments/\n│   └── run_ablation.py    # Ablation study runner\n├── gen_task_pool.py       # Task generation CLI\n├── inspect_ckpt.py        # Checkpoint inspection tool\n└── pbt_output.py          # Experiment result scanner\n```\n\n## Scripts\n\n### run_ablation.py — Ablation Study Runner\n\nRuns reproducible ablation experiments comparing multiple training variants with automated result collection and visualization.\n\n**Usage:**\n```bash\npython -m itrader.scripts.experiments.run_ablation config.json [--out-dir OUTPUT_DIR]\n```\n\n**Configuration Format (JSON):**\n```json\n{\n  \"name\": \"start_index_ablation\",\n  \"python_exe\": \"python\",\n  \"train_module\": \"itrader.rl_lib.train.train_solo_V2\",\n  \"common_args\": {\n    \"stop_iters\": 50,\n    \"num_workers\": 4\n  },\n  \"variants\": [\n    {\"id\": \"baseline\", \"args\": {\"start_index\": 0}},\n    {\"id\": \"mid_start\", \"args\": {\"start_index\": 500}},\n    {\"id\": \"late_start\", \"args\": {\"start_index\": 1000}}\n  ]\n}\n```\n\n**Workflow:**\n\n```mermaid\nflowchart TD\n    A[Load JSON Config] --> B[For Each Variant]\n    B --> C[Build CLI Args]\n    C --> D[Run Training Subprocess]\n    D --> E[Find Trial Directory]\n    E --> F[Locate Stable Metrics]\n    F --> G[Generate Per-Variant Plots]\n    G --> B\n    B --> H[Write Comparison CSVs]\n    H --> I[Generate Comparison Plots]\n    I --> J[Write summary.json]\n```\n\n**Key Functions:**\n\n| Function | Purpose |\n|----------|---------|\n| `_to_cli_args(arg_map)` | Converts dict to command-line argument list, handling boolean flags |\n| `_find_trial_dir(experiment_root)` | Locates the most recent trial directory under an experiment |\n| `_run_variant(...)` | Executes a single variant and collects results into `VariantResult` |\n| `_write_metric_compare(results, metric, out_csv)` | Writes per-iteration metric comparison across variants |\n| `_plot_metric(df, title, ylabel, out_png)` | Generates single-metric comparison plot |\n| `_plot_multi_metrics(metric_dfs, out_png)` | Generates 2×2 grid of key metrics |\n\n**Output Artifacts:**\n- `ablation_compare.csv` — Episode return comparison across iterations\n- `ablation_compare.png` — Episode return visualization\n- `ablation_compare_entropy.png` — Entropy comparison\n- `ablation_compare_episode_len.png` — Episode length comparison\n- `ablation_compare_diagnostics.png` — Multi-metric diagnostic grid\n- `summary.json` — Run metadata and artifact paths\n\n---\n\n### gen_task_pool.py — Task Pool Generator\n\nGenerates training tasks using configurable proposer backends (rule-based or LLM-based).\n\n**Usage:**\n```bash\npython -m itrader.scripts.gen_task_pool \\\n    --backend rule_based \\\n    --out task_pool.jsonl \\\n    --n_tasks 100 \\\n    --seed 42\n```\n\n**Backend Options:**\n\n| Backend | Description | Key Arguments |\n|---------|-------------|---------------|\n| `rule_based` | Deterministic task generation | `--seed`, `--window_size`, `--n_features` |\n| `llm` | HuggingFace transformers | `--model_id` |\n| `ollama` | Local Ollama server | `--ollama_model`, `--ollama_base_url` |\n| `vllm` | vLLM inference server | `--api_model`, `--api_base_url` |\n| `sglang` | SGLang inference server | `--api_model`, `--api_base_url` |\n\n**Generation Loop:**\n```python\nwhile n_generated < n_tasks:\n    raw_tasks = proposer.propose_tasks(market_summary, n=batch_size)\n    for raw_task in raw_tasks:\n        validated_task = validate_and_clamp_task(raw_task, env_config, fallback_seed)\n        TaskSpec.from_dict(validated_task)  # validate structure\n        pool.add(validated_task, meta=metadata)\n```\n\n**Error Handling:**\n- `--max_empty_batches` — Abort after N consecutive empty responses\n- `--max_backend_errors` — Abort after N consecutive call failures\n- Invalid tasks are dropped with warnings (first 5 logged)\n\n**Output:** JSONL file with one `TaskSpec` per line, including generation metadata.\n\n---\n\n### inspect_ckpt.py — Checkpoint Inspector\n\nExtracts and displays configuration from trial directories or experiment directories.\n\n**Usage:**\n```bash\n# Inspect a specific trial\npython -m itrader.scripts.inspect_ckpt --trial_dir /path/to/trial\n\n# Auto-pick best trial from experiment\npython -m itrader.scripts.inspect_ckpt --exp_dir /path/to/experiment --metric custom_metrics/episode_return_mean --mode max\n```\n\n**Arguments:**\n\n| Argument | Description |\n|----------|-------------|\n| `--trial_dir` | Path to a specific trial directory |\n| `--exp_dir` | Path to experiment directory (auto-selects best trial) |\n| `--metric` | Metric for best-trial selection (default: `custom_metrics/episode_return_mean`) |\n| `--mode` | `max` or `min` for metric optimization |\n| `--out` | Optional path to write full config JSON |\n\n**Output Sections:**\n1. **Trial Info** — Path, best metric value, checkpoint location\n2. **PPO/RLlib Config** — Learning rate, clip parameters, batch sizes, entropy coeff, etc.\n3. **Env Config** — Data path, window size, embedding settings\n4. **TaskSampler Config** — Horizon ranges, reward parameters, task pool path\n5. **Tune Overrides** — Flattened config keys with `/` separators\n\n**Config Loading Priority:**\n1. `params.json` in trial directory (preferred)\n2. `result.json` — extracts config from the iteration with best metric\n\n---\n\n### pbt_output.py — Experiment Scanner\n\nScans experiment directories to identify top-performing trials based on metrics.\n\n**Usage:**\n```bash\npython -m itrader.scripts.pbt_output \\\n    --exp_dir ~/ray_results/Phase_A \\\n    --metric custom_metrics/episode_return_mean \\\n    --mode max \\\n    --top_k 10\n```\n\n**Key Function:**\n```python\ndef scan_experiment(exp_dir: Path, metric_key: str, mode: str, top_k: int) -> List[BestRow]:\n    \"\"\"Scan experiment directory and return top-k trials by metric.\"\"\"\n```\n\n**BestRow Dataclass:**\n```python\n@dataclass\nclass BestRow:\n    trial_dir: Path\n    trial_id: str\n    iteration: int\n    metric: float\n    checkpoint: Optional[Path]\n    params_path: Path\n```\n\n**Metric Extraction Sources:**\n1. `result.json` — JSONL file with per-iteration metrics (preferred)\n2. `progress.csv` — Fallback CSV with training progress\n\n**Checkpoint Matching:**\n- Parses checkpoint directory names (`checkpoint_000123`, `checkpoint-123`, `iter_123`)\n- Selects checkpoint nearest to the best iteration\n- Falls back to most recently modified if no iteration in name\n\n---\n\n## Shared Utilities\n\n### Metric Extraction Pattern\n\nBoth `inspect_ckpt.py` and `pbt_output.py` use identical metric extraction logic:\n\n```python\ndef _get_metric(rec: Dict[str, Any], metric_key: str) -> Optional[float]:\n    # 1. Direct key lookup\n    if metric_key in rec:\n        return _safe_float(rec.get(metric_key))\n    \n    # 2. Nested under \"custom_metrics\"\n    if metric_key.startswith(\"custom_metrics/\"):\n        sub = metric_key.split(\"/\", 1)[1]\n        cm = rec.get(\"custom_metrics\")\n        if isinstance(cm, dict) and sub in cm:\n            return _safe_float(cm.get(sub))\n    \n    # 3. Nested under \"sampler_results\"\n    sr = rec.get(\"sampler_results\")\n    if isinstance(sr, dict):\n        # ... same pattern\n```\n\n### Checkpoint Discovery Pattern\n\nBoth scripts share checkpoint listing and selection:\n\n```python\ndef _list_checkpoints(trial_dir: Path) -> List[Path]:\n    patterns = (\"checkpoint_*\", \"checkpoint-*\", \"rllib_checkpoints\", \"rllib_checkpoint*\")\n    # ... glob matching\n\ndef _pick_checkpoint_near_iter(checkpoints: List[Path], target_iter: int) -> Optional[Path]:\n    # Returns checkpoint <= target_iter, or closest available\n```\n\n---\n\n## Integration Points\n\n```mermaid\nflowchart LR\n    subgraph Scripts\n        A[gen_task_pool.py] --> B[TaskPool]\n        C[run_ablation.py] --> D[Training Module]\n        E[inspect_ckpt.py] --> F[pbt_output.py]\n    end\n    \n    subgraph External\n        D --> G[ray_results/]\n        F --> G\n        A --> H[proposers/]\n    end\n    \n    subgraph Output\n        C --> I[Comparison Plots]\n        E --> J[Config Dump]\n        F --> K[Best Trial Info]\n    end\n```\n\n**Dependencies:**\n- `itrader.proposers` — Task generation backends\n- `itrader.rl_lib.tasks` — TaskSpec, TaskPool, validation\n- `itrader.rl_lib.tasks.families` — Default bar resolution\n- `itrader.scripts.pbt_output` — Used by `inspect_ckpt.py` for `--exp_dir` mode\n\n**Ray Results Structure:**\n```\n~/ray_results/\n├── experiment_name/\n│   └── training_fn_abc123/    # Trial directory\n│       ├── params.json\n│       ├── result.json         # JSONL per-iteration\n│       ├── progress.csv\n│       └── checkpoint_000050/\n└── _stable_metrics/\n    └── training_fn_abc123/\n        ├── report_rows.csv\n        ├── metrics_full.jsonl\n        └── plots/\n```","knowledge-management":"# Knowledge Management\n\n# Knowledge Management Module\n\n## Overview\n\nThe Knowledge Management module synchronizes and reports on GitNexus-generated artifacts, making indexed code knowledge available in the repository's documentation structure. It bridges the gap between GitNexus's internal `.gitnexus/` metadata and human-readable documentation under `docs/knowledge/`.\n\n## Architecture\n\n```mermaid\ngraph LR\n    A[.gitnexus/meta.json] --> B[sync_artifacts.py]\n    A --> C[status_summary.py]\n    D[.gitnexus/wiki/] --> B\n    B --> E[docs/knowledge/INDEX_STATUS.md]\n    B --> F[docs/knowledge/wiki/]\n    B --> G[docs/knowledge/module_tree.json]\n    C --> H[stdout summary]\n```\n\n## Key Paths\n\n| Path | Source/Target | Description |\n|------|---------------|-------------|\n| `.gitnexus/meta.json` | Source | GitNexus index metadata |\n| `.gitnexus/wiki/` | Source | Generated wiki pages |\n| `docs/knowledge/INDEX_STATUS.md` | Target | Human-readable index status |\n| `docs/knowledge/wiki/` | Target | Tracked wiki pages |\n| `docs/knowledge/module_tree.json` | Target | Repository file tree |\n\n## Scripts\n\n### sync_artifacts.py\n\nSynchronizes GitNexus outputs into tracked documentation. Run after indexing to update all knowledge artifacts.\n\n**Entry point:** `main()` orchestrates three sync operations:\n\n1. **`write_index_status()`** — Generates `INDEX_STATUS.md` with index metadata and statistics. Falls back to a placeholder document if no index exists.\n\n2. **`sync_wiki()`** — Mirrors `.gitnexus/wiki/*.md` files to `docs/knowledge/wiki/`. Removes orphaned pages that no longer exist in the source.\n\n3. **`write_module_tree()`** — Produces `module_tree.json` representing the repository structure. Uses GitNexus's tree if available, otherwise falls back to `git ls-files`.\n\n**Usage:**\n```bash\npython tools/knowledge/sync_artifacts.py --repo-root /path/to/repo\n```\n\n#### Module Tree Generation\n\nWhen GitNexus doesn't provide a pre-built tree, `build_tree_from_paths()` constructs a hierarchical structure from file paths:\n\n```python\n# Input: [\"src/main.py\", \"src/lib/utils.py\"]\n# Output:\n{\n  \"repo\": \"myproject\",\n  \"source\": \"git-ls-files fallback\",\n  \"children\": [\n    {\n      \"name\": \"src\",\n      \"type\": \"directory\",\n      \"children\": [\n        {\"name\": \"main.py\", \"type\": \"file\"},\n        {\n          \"name\": \"lib\",\n          \"type\": \"directory\",\n          \"children\": [{\"name\": \"utils.py\", \"type\": \"file\"}]\n        }\n      ]\n    }\n  ]\n}\n```\n\nThe internal `normalize()` function recursively transforms the intermediate dict structure into sorted, clean JSON output.\n\n### status_summary.py\n\nPrints a concise summary of local knowledge artifacts to stdout. Used for quick status checks without modifying files.\n\n**Usage:**\n```bash\npython tools/knowledge/status_summary.py --repo-root /path/to/repo\n```\n\n**Output example:**\n```\n[knowledge] Local artifact summary\n[knowledge] Indexed at: 2024-01-15T10:30:00Z\n[knowledge] Indexed commit: abc1234\n[knowledge] Stats: 142 files, 892 nodes, 2341 edges, 15 flows\n[knowledge] INDEX_STATUS.md stale: no\n[knowledge] Tracked wiki pages: 8\n[knowledge] module_tree.json present: yes\n```\n\n#### Staleness Detection\n\n`build_summary()` compares modification times to detect stale artifacts:\n\n```python\nis_stale = status_doc.stat().st_mtime < meta_path.stat().st_mtime\n```\n\nIf `INDEX_STATUS.md` is older than `meta.json`, it indicates the index was updated but artifacts weren't synced.\n\n## Integration Points\n\n### GitNexus Backend\n\nThe module expects GitNexus to produce:\n\n- `.gitnexus/meta.json` — Contains `indexedAt`, `lastCommit`, and `stats` (files, nodes, edges, communities, processes, embeddings)\n- `.gitnexus/wiki/*.md` — Generated documentation pages\n- `.gitnexus/wiki/module_tree.json` — Optional pre-computed file tree\n\n### Downstream Consumers\n\n- Documentation sites can render `docs/knowledge/wiki/` pages\n- Tools can parse `module_tree.json` for repository structure\n- CI pipelines can check staleness via `status_summary.py`\n\n## Typical Workflow\n\n1. Run `tools/knowledge/index_repo.sh` to generate GitNexus artifacts\n2. Run `sync_artifacts.py` to sync outputs to tracked docs\n3. Run `status_summary.py` to verify sync completed\n4. Commit changes to `docs/knowledge/`","llm-integration":"# LLM Integration\n\n# LLM Integration Module\n\n## Overview\n\nThe LLM Integration module provides two distinct approaches for integrating large language models into the trading system:\n\n1. **Lightweight Engine** (`engine.py`) — A minimal llama.cpp-based interface for fast local inference\n2. **Task Proposer** (`proposer_llm.py`) — A full-featured task generation system using Transformers with 4-bit quantization\n\nThese components serve different purposes: the engine provides simple text completion capabilities, while the proposer generates structured task specifications from market data.\n\n## Architecture\n\n```mermaid\ngraph TD\n    A[Factory] --> B[ProposerLLM]\n    B --> C[BaseProposer]\n    B --> D[Shared Utilities]\n    D --> E[parse_json_with_repair]\n    D --> F[schema_hint]\n    B --> G[Transformers Model]\n    G --> H[4-bit Quantization]\n    \n    I[engine.py] --> J[Llama GGUF]\n    J --> K[GPU Layers]\n```\n\n---\n\n## Components\n\n### engine.py — Lightweight LLM Engine\n\nA minimal wrapper around `llama_cpp` for local model inference. Designed for scenarios requiring simple text completion without the overhead of the full Transformers stack.\n\n#### Configuration\n\n| Setting | Value | Description |\n|---------|-------|-------------|\n| Model | DeepSeek Coder 6.7B Q4_K_M | GGUF quantized model |\n| Context Window | 4096 tokens | Maximum sequence length |\n| GPU Layers | -1 | Offload all layers to GPU |\n\n#### Functions\n\n**`get_llm() -> Llama`**\n\nReturns a cached `Llama` instance. Uses `@lru_cache` to ensure the model is loaded only once per process.\n\n```python\nfrom itrader.llm.engine import get_llm\n\nllm = get_llm()  # Loads model on first call\nllm2 = get_llm()  # Returns same instance\n```\n\n**`ask(prompt: str, **gen) -> str`**\n\nGenerates a text completion for the given prompt.\n\n| Parameter | Type | Default | Description |\n|-----------|------|---------|-------------|\n| `prompt` | `str` | required | Input text to complete |\n| `**gen` | `dict` | — | Override generation parameters |\n\nDefault generation parameters:\n- `max_tokens`: 128\n- `temperature`: 0.7\n\n```python\nfrom itrader.llm.engine import ask\n\nresponse = ask(\"Analyze this market trend:\")\nresponse = ask(\"Predict price movement:\", max_tokens=256, temperature=0.3)\n```\n\n---\n\n### proposer_llm.py — Task Generation System\n\nA `BaseProposer` implementation that generates structured `TaskSpec` objects from market summaries using a HuggingFace Transformers model with efficient 4-bit quantization.\n\n#### Class: `ProposerLLM`\n\n**Inheritance:** `BaseProposer`\n\n**Initialization**\n\n```python\nProposerLLM(\n    model_id: str = \"Qwen2.5-7B-Instruct\",\n    device: Optional[str] = None\n)\n```\n\n| Parameter | Type | Default | Description |\n|-----------|------|---------|-------------|\n| `model_id` | `str` | `\"Qwen2.5-7B-Instruct\"` | HuggingFace model identifier |\n| `device` | `Optional[str]` | `None` | Target device; auto-detects CUDA availability |\n\n**Quantization Behavior:**\n\n- On CUDA: Attempts 4-bit quantization via `BitsAndBytesConfig`\n- Fallback: Full precision if bitsandbytes unavailable\n- On CPU: Loads in full precision (quantization not supported)\n\n**Methods**\n\n**`generate_tasks(market_summary, n, schema_hint, temperature, max_new_tokens) -> List[Dict]`**\n\nGenerates `n` task specifications from a market summary.\n\n| Parameter | Type | Default | Description |\n|-----------|------|---------|-------------|\n| `market_summary` | `str` | required | Market context/conditions description |\n| `n` | `int` | required | Number of tasks to generate |\n| `schema_hint` | `Optional[str]` | `None` | Custom schema; uses default if None |\n| `temperature` | `float` | `0.7` | Sampling temperature |\n| `max_new_tokens` | `int` | `512` | Maximum tokens to generate |\n\n**Returns:** `List[Dict[str, Any]]` — List of TaskSpec dictionaries; empty list if parsing fails.\n\n**`propose_tasks(market_summary, n, **kwargs) -> List[Dict]`**\n\nAlias for `generate_tasks`. Implements the `BaseProposer` interface.\n\n```python\nfrom itrader.llm.proposer_llm import ProposerLLM\n\nproposer = ProposerLLM(model_id=\"Qwen2.5-7B-Instruct\")\n\ntasks = proposer.propose_tasks(\n    market_summary=\"BTC showing high volatility with 15% swing in 24h\",\n    n=3,\n    temperature=0.8\n)\n```\n\n---\n\n## Execution Flow\n\n### Task Generation Pipeline\n\n```mermaid\nsequenceDiagram\n    participant F as Factory\n    participant P as ProposerLLM\n    participant M as Transformers Model\n    participant S as Shared Utils\n    \n    F->>P: ProposerLLM()\n    P->>M: Load with 4-bit quantization\n    \n    Note over P: Later...\n    \n    P->>P: propose_tasks()\n    P->>P: generate_tasks()\n    P->>S: schema_hint()\n    S-->>P: JSON schema string\n    P->>M: generate()\n    M-->>P: Raw text output\n    P->>P: _parse_json_with_repair()\n    P->>S: parse_json_with_repair()\n    S-->>P: List[Dict]\n```\n\n### Integration Points\n\n| Entry Point | Script | Flow |\n|-------------|--------|------|\n| Training | `rl_lib/train/train_AZR.py` | `main` → `_generate_task_pool` → `_build_proposer_from_args` → `build_proposer` → `ProposerLLM` |\n| Task Pool Generation | `itrader/scripts/gen_task_pool.py` | `main` → `_build_proposer_from_args` → `build_proposer` → `ProposerLLM` |\n\n---\n\n## Dependencies\n\n### External Libraries\n\n| Library | Purpose |\n|---------|---------|\n| `llama_cpp` | GGUF model inference (engine.py) |\n| `transformers` | HuggingFace model loading |\n| `bitsandbytes` | 4-bit quantization (optional) |\n| `torch` | Tensor operations |\n\n### Internal Dependencies\n\n| Module | Usage |\n|--------|-------|\n| `itrader.proposers.base.BaseProposer` | Abstract base class |\n| `itrader.proposers._shared.parse_json_with_repair` | JSON extraction with error recovery |\n| `itrader.proposers._shared.schema_hint` | Default TaskSpec schema |\n\n---\n\n## Model Files\n\nThe engine expects the following model file structure:\n\n```\nitrader/\n└── models/\n    └── deepseek-llm-6b-q4_k_m/\n        └── deepseek-coder-6.7b-instruct.Q4_K_M.gguf\n```\n\nEnsure the GGUF file is downloaded before using `engine.py`.\n\n---\n\n## Error Handling\n\n### Quantization Fallback\n\nIf bitsandbytes is unavailable on CUDA systems, `ProposerLLM` logs a warning and falls back to full precision:\n\n```\nWarning: bitsandbytes not available, loading model in full precision\n```\n\n### JSON Parsing Recovery\n\nGenerated JSON may be malformed. The `_parse_json_with_repair` method delegates to shared utilities that attempt multiple repair strategies before returning an empty list on complete failure.\n\n---\n\n## Testing\n\nTests in `itrader/tests/test_llm.py` verify JSON parsing behavior:\n\n- `test_parse_json_with_repair_direct_array` — Parses clean JSON arrays\n- `test_parse_json_with_repair_embedded_object` — Extracts JSON from surrounding text","neural-network-models":"# Neural Network Models\n\n# Neural Network Models\n\nThis module provides custom PyTorch neural network models for RLlib-based reinforcement learning agents. All models implement the `TorchModelV2` interface and follow the actor-critic pattern, outputting both policy logits and value estimates.\n\n## Architecture Overview\n\n```mermaid\ngraph TB\n    subgraph \"Model Hierarchy\"\n        A[TorchModelV2] \n        B[nn.Module]\n        C[SolverMLPModel]\n        D[SolverLSTMModel]\n        E[SolverMLPFiLM]\n    end\n    \n    A --> C\n    B --> C\n    A --> D\n    B --> D\n    A --> E\n    B --> E\n    \n    subgraph \"Output Heads\"\n        F[Policy Head pi]\n        G[Value Head vf]\n    end\n    \n    C --> F\n    C --> G\n    D --> F\n    D --> G\n    E --> F\n    E --> G\n```\n\n## Models\n\n### SolverMLPModel\n\n**File:** `itrader/models/solver_MLP.py`  \n**Registration name:** `\"solver_mlp\"`\n\nA straightforward multi-layer perceptron for policy and value estimation. Best suited for environments where observations are already feature-engineered or don't require temporal modeling.\n\n#### Architecture\n\n```\nObservation → Linear(flat_dim, hidden) → ReLU → Linear(hidden, hidden) → ReLU → [pi_head, vf_head]\n```\n\n#### Configuration\n\n| Parameter | Default | Description |\n|-----------|---------|-------------|\n| `fcnet_hiddens` | `[256, 256]` | Hidden layer sizes (uses first element) |\n\n#### Forward Pass\n\n```python\ndef forward(self, input_dict, state, seq_lens):\n    x = input_dict[\"obs\"].float()\n    h = self.trunk(x)\n    logits = self.pi(h)\n    self._value_out = self.vf(h).squeeze(-1)\n    return logits, state\n```\n\nThe model expects flat observations and processes them through a 2-layer MLP trunk before branching into policy logits and a scalar value estimate.\n\n---\n\n### SolverLSTMModel\n\n**File:** `itrader/models/solver_lstm.py`  \n**Registration name:** `\"solver_lstm_v2\"`\n\nAn LSTM-based model for temporal sequence processing. Reshapes flat observations into a time series format before processing.\n\n#### Architecture\n\n```\nObservation (B, win·F) → reshape(B, win, F) → Linear(F, 128) → ReLU → LSTM(128, 64) → last_hidden → [pi_head, vf_head]\n```\n\n#### Configuration\n\n| Parameter | Default | Description |\n|-----------|---------|-------------|\n| `window_size` | `30` | Number of timesteps in observation window |\n\n**Important:** The model assumes `flat_dim = window_size × n_features`. The feature dimension is inferred as `flat_dim // window_size`.\n\n#### Forward Pass\n\n```python\ndef forward(self, input_dict, state, seq_lens):\n    obs = input_dict[\"obs\"].float()\n    B = obs.size(0)\n    x = obs.view(B, self.win, self.n_feat)    # Reshape to (B, T, F)\n    x = F.relu(self.fc(x))                    # (B, T, 128)\n    seq, _ = self.lstm(x)                     # (B, T, 64)\n    h = seq[:, -1]                            # Last timestep (B, 64)\n    \n    logits = self.pi(h)\n    self._value_out = self.vf(h).squeeze(-1)\n    return logits, state\n```\n\nThe model extracts the final LSTM hidden state for policy and value prediction.\n\n---\n\n### SolverMLPFiLM\n\n**File:** `itrader/models/solver_mlp_film.py`  \n**Registration name:** Not registered by default (instantiate directly)\n\nAn MLP with Feature-wise Linear Modulation (FiLM) conditioning. Designed for multi-task learning where a task embedding modulates the network's hidden representations.\n\n#### Architecture\n\n```\nObservation → split → [price_features, task_embed]\n                         ↓                      ↓\n                    trunk MLP              t_mlp → (gamma, beta)\n                         ↓                      ↓\n                    hidden ←─────── FiLM conditioning ←───────┘\n                         ↓\n                  [pi_head, vf_head]\n```\n\n#### Observation Layout\n\nObservations must be structured as: `[price_window_flat, t_embed]`\n\n- `price_window_flat`: Market/price features\n- `t_embed`: Task embedding vector\n\n#### Configuration\n\n| Parameter | Default | Description |\n|-----------|---------|-------------|\n| `t_embed_dim` | `32` | Dimension of task embedding |\n| `fcnet_hiddens` | `[256, 256]` | Trunk MLP hidden layer sizes |\n| `t_proj` | `64` | Intermediate projection dimension for task MLP |\n| `conditioning` | `\"film\"` | Conditioning type (only `\"film\"` supported) |\n| `t_keep_p` | `0.9` | Keep probability for task embedding dropout |\n\n#### FiLM Conditioning\n\nThe FiLM mechanism applies feature-wise affine transformations:\n\n```python\ndef _condition_hidden(self, hidden, task_embed):\n    gamma_beta = self.t_mlp(task_embed)\n    gamma, beta = torch.chunk(gamma_beta, 2, dim=-1)\n    gamma = torch.tanh(gamma)  # Clamped to [-1, 1] for stability\n    return gamma * hidden + beta\n```\n\nThis allows the task embedding to scale and shift hidden activations, enabling the network to adapt its behavior per-task.\n\n#### Forward Pass\n\n```python\ndef forward(self, input_dict, state, seq_lens):\n    x = torch.nan_to_num(input_dict[\"obs\"].float())  # NaN handling\n    price, task_embed = self._split_obs(x)\n    \n    if self.training and self.t_keep_p < 1.0:\n        task_embed = self.dropout(task_embed)\n    \n    hidden = self.trunk(price)\n    hidden = self._condition_hidden(hidden, task_embed)\n    \n    logits = self.pi(hidden)\n    self._value_out = self.vf(hidden).squeeze(-1)\n    return logits, state\n```\n\n**Note:** The model applies `nan_to_num` for robustness and uses dropout on task embeddings during training when `t_keep_p < 1.0`.\n\n## RLlib Integration\n\nAll models follow the RLlib `TorchModelV2` interface:\n\n| Method | Purpose |\n|--------|---------|\n| `__init__` | Initialize architecture from `obs_space`, `action_space`, `model_config` |\n| `forward` | Compute policy logits; cache value estimate |\n| `value_function` | Return cached value estimate from last forward pass |\n\n### Registration\n\nModels are registered with RLlib's `ModelCatalog`:\n\n```python\n# Automatic registration at import\nModelCatalog.register_custom_model(\"solver_mlp\", SolverMLPModel)\nModelCatalog.register_custom_model(\"solver_lstm_v2\", SolverLSTMModel)\n```\n\nTo use in an RLlib config:\n\n```python\nconfig = {\n    \"model\": {\n        \"custom_model\": \"solver_mlp\",\n        \"fcnet_hiddens\": [256, 256],\n    }\n}\n```\n\nFor LSTM:\n\n```python\nconfig = {\n    \"model\": {\n        \"custom_model\": \"solver_lstm_v2\",\n        \"custom_model_config\": {\"window_size\": 30},\n    }\n}\n```\n\n## Model Selection Guide\n\n| Model | Use Case |\n|-------|----------|\n| `SolverMLPModel` | Simple state-based observations, no temporal dependencies |\n| `SolverLSTMModel` | Sequential data, temporal patterns, time-series forecasting |\n| `SolverMLPFiLM` | Multi-task learning, meta-learning, conditional policies |\n\n## Testing\n\nThe `SolverMLPFiLM` model has dedicated tests in `itrader/tests/test_no_nan_forward.py`:\n\n- `test_forward_no_nan_inf_in_logits`: Validates output numerical stability\n- `test_value_function_shape_and_finiteness`: Checks value function output shape and finiteness","other-agents-md":"# Other — AGENTS.md\n\n# AGENTS.md — Agent Guidance Module\n\n## Purpose\n\n`AGENTS.md` provides operational guidance for AI agents working in this repository. It documents the GitNexus knowledge layer integration and establishes preferred workflows for common development tasks.\n\nThis module is **advisory documentation** — it contains no executable code and defines no APIs. Instead, it serves as a reference for agents to understand:\n\n1. What knowledge tools are available\n2. When to use knowledge-layer queries vs. direct source inspection\n3. How to maintain knowledge-layer freshness during development\n\n---\n\n## Knowledge Layer\n\nThe repository includes a GitNexus knowledge layer located at `tools/knowledge/`. This layer provides indexed, queryable metadata about the codebase that enables faster exploration and more accurate impact analysis.\n\n### Key Concept: Dual-Path Investigation\n\nAgents should work with two parallel information sources:\n\n| Source | Use Case | Trust Level |\n|--------|----------|-------------|\n| GitNexus queries | Architecture understanding, symbol relationships, impact analysis | Primary for exploration |\n| Direct source reads | Verification, spot-checking, when GitNexus unavailable | Ground truth |\n\n**Rule**: If GitNexus and source disagree, trust the code and report the mismatch.\n\n---\n\n## Advisory Guidance\n\n### Index Freshness\n\nThe knowledge layer requires periodic refresh to remain accurate:\n\n- **Check status**: `tools/knowledge/status.sh` — confirms whether the index is fresh enough for architecture-sensitive work\n- **Refresh index**: `tools/knowledge/index_repo.sh` — run after major code changes or when GitNexus reports staleness\n\n### Wiki Generation\n\nDo not auto-run wiki generation. Only execute when:\n- The task explicitly requires refreshed tracked docs\n- LLM configuration is available\n\n### HTTP Serving (Optional)\n\nGitNexus HTTP serving is available on this Mac via `tools/knowledge/serve_http_mcp.sh`. This is optional and provides an alternative access method for the knowledge backend.\n\n---\n\n## Preferred Workflows\n\n### Exploration\n\n```\nquery → context → source reads\n```\n\n1. Start with a GitNexus `query` to understand the landscape\n2. Use `context` to get detailed symbol information\n3. Fall back to direct source reads for verification\n\n### Debugging\n\n```\nquery (symptom) → context (suspect) → source confirmation\n```\n\n1. `query` the symptom or error pattern\n2. `context` the suspected symbol or function\n3. Confirm findings in source code\n\n### Refactoring\n\n```\ncontext + impact → edits → graph refresh\n```\n\n1. Use `context` and `impact` tools before making edits\n2. Perform the refactoring\n3. Refresh the graph with `index_repo.sh`\n\n### Live UI Sessions\n\nWhen the GitNexus HTTP backend is running:\n\n```bash\nGITNEXUS_USE_HTTP=1 tools/knowledge/codex_with_gitnexus.sh\n```\n\nIn this mode, `codex mcp list` will show the shared backend as `gitnexus_http`.\n\n---\n\n## Reference Documentation\n\nFor detailed workflow documentation, see `docs/knowledge/WORKFLOWS.md`.\n\n---\n\n## Module Characteristics\n\n| Attribute | Value |\n|-----------|-------|\n| Type | Advisory documentation |\n| Executable code | None |\n| Dependencies | GitNexus tools (external) |\n| Call graph | N/A — no executable functions |\n| Maintenance | Update when workflows change or new tools are added |","other-best-config-json":"# Other — best_config.json\n\n# best_config.json — RLlib Training Configuration\n\n## Overview\n\nThis configuration file defines the hyperparameters and settings for training a reinforcement learning agent using RLlib's PPO algorithm on the `ITraderEnv` trading environment. The configuration represents an optimized set of parameters, likely derived from hyperparameter tuning.\n\n## Purpose\n\nThe file serves as the primary configuration input for the training pipeline, specifying:\n- Environment parameters for the trading simulation\n- Neural network architecture (custom FiLM-conditioned MLP)\n- PPO algorithm hyperparameters\n- Resource allocation for distributed training\n- TensorFlow/PyTorch session settings\n\n---\n\n## Configuration Sections\n\n### Environment Settings\n\n```json\n\"env\": \"ITraderEnv\",\n\"env_config\": {\n  \"df_path\": \"itrader/data/ohlcv.parquet\",\n  \"window_size\": 60,\n  \"t_embed_mode\": \"concat\",\n  \"t_scale\": 1.0,\n  ...\n}\n```\n\n| Parameter | Value | Description |\n|-----------|-------|-------------|\n| `env` | `\"ITraderEnv\"` | Registered environment name |\n| `df_path` | `\"itrader/data/ohlcv.parquet\"` | Path to OHLCV market data |\n| `window_size` | `60` | Observation window size (timesteps) |\n| `t_embed_mode` | `\"concat\"` | Task embedding concatenation mode |\n| `t_embed_dim` | `32` | Task embedding dimension |\n\n### Task Sampler Configuration\n\nThe task sampler defines the distribution of training tasks with varying difficulty:\n\n```json\n\"task_sampler\": {\n  \"horizons\": [96, 128, 160, 200],\n  \"turnover_w_choices\": [0.0, 0.0005, 0.001, 0.002],\n  \"dd_modes\": [\"delta\"],\n  \"dd_w_range\": [0.0, 0.04],\n  \"turnover_cap\": 0.02,\n  \"dd_cap\": 0.1\n}\n```\n\n**Task Parameters:**\n- **Horizons**: Episode lengths sampled from `[96, 128, 160, 200]`\n- **Turnover weights**: Penalty coefficients for trading activity\n- **Drawdown modes**: Uses delta-based drawdown calculation\n- **Caps**: Maximum allowed turnover (2%) and drawdown (10%)\n\n**Override Values** (fixed during this training run):\n```json\n\"task_sampler_overrides\": {\n  \"turnover_w\": 0.001478969213630136,\n  \"dd_w\": 0.01573559912930409,\n  \"dd_T_weight\": 0.08909330514088692\n}\n```\n\n---\n\n### Model Architecture\n\n```json\n\"model\": {\n  \"custom_model\": \"solver_mlp_film\",\n  \"custom_model_config\": {\n    \"window_size\": 60,\n    \"t_embed_dim\": 32,\n    \"fcnet_hiddens\": [256, 256],\n    \"conditioning\": \"film\",\n    \"t_keep_p\": 0.7,\n    \"t_proj\": 64\n  }\n}\n```\n\nThe model uses a **FiLM-conditioned MLP** architecture:\n\n| Parameter | Value | Description |\n|-----------|-------|-------------|\n| `custom_model` | `\"solver_mlp_film\"` | Registered custom model class |\n| `fcnet_hiddens` | `[256, 256]` | Hidden layer dimensions |\n| `conditioning` | `\"film\"` | Feature-wise Linear Modulation |\n| `t_keep_p` | `0.7` | Task embedding dropout probability |\n| `t_proj` | `64` | Task projection dimension |\n\n**FiLM Conditioning**: The network modulates its features based on task embeddings, allowing the same network to handle multiple task configurations dynamically.\n\n---\n\n### PPO Hyperparameters\n\n```json\n\"gamma\": 0.15945066086400006,\n\"lr\": 2.9931256986154753e-05,\n\"grad_clip\": 10.0,\n\"train_batch_size\": 4800,\n\"sgd_minibatch_size\": 97,\n\"num_sgd_iter\": 30,\n\"clip_param\": 0.1,\n\"lambda\": 0.9\n```\n\n| Parameter | Value | Description |\n|-----------|-------|-------------|\n| `gamma` | `0.159` | Discount factor (unusually low, optimized for short horizons) |\n| `lr` | `2.99e-05` | Learning rate |\n| `grad_clip` | `10.0` | Gradient clipping threshold |\n| `train_batch_size` | `4800` | Total samples per training iteration |\n| `sgd_minibatch_size` | `97` | Minibatch size for SGD updates |\n| `num_sgd_iter` | `30` | Number of SGD epochs per iteration |\n| `clip_param` | `0.1` | PPO clipping parameter |\n| `lambda` | `0.9` | GAE (Generalized Advantage Estimation) parameter |\n\n**Entropy Schedule**:\n```json\n\"entropy_coeff_schedule\": [\n  [0, 0.02],\n  [200000, 0.01],\n  [800000, 0.003]\n]\n```\n\nThe entropy coefficient decays from `0.02` → `0.01` → `0.003` over training steps, encouraging early exploration and later exploitation.\n\n---\n\n### Resource Allocation\n\n```json\n\"num_workers\": 4,\n\"num_cpus_per_worker\": 1,\n\"num_gpus_per_worker\": 0,\n\"num_gpus\": 0,\n\"framework\": \"torch\",\n\"placement_strategy\": \"PACK\"\n```\n\n| Parameter | Value | Description |\n|-----------|-------|-------------|\n| `num_workers` | `4` | Parallel rollout workers |\n| `num_cpus_per_worker` | `1` | CPU cores per worker |\n| `num_gpus_per_worker` | `0` | GPUs per worker (CPU-only inference) |\n| `num_gpus` | `0` | Total GPUs for learner |\n| `placement_strategy` | `\"PACK\"` | Co-locate workers on same node |\n\n---\n\n### TensorFlow Session Configuration\n\n```json\n\"tf_session_args\": {\n  \"intra_op_parallelism_threads\": 2,\n  \"inter_op_parallelism_threads\": 2,\n  \"gpu_options\": { \"allow_growth\": true },\n  \"allow_soft_placement\": true\n}\n```\n\nThese settings optimize TensorFlow execution for multi-worker scenarios, limiting per-worker threading to avoid contention.\n\n---\n\n## Training Control\n\n```json\n\"stop_iters\": 100000,\n\"checkpoint_interval\": 3\n```\n\n- **Maximum iterations**: 100,000\n- **Checkpoint frequency**: Every 3 iterations\n\n---\n\n## Usage\n\nLoad the configuration in your training script:\n\n```python\nimport json\nfrom ray.rllib.algorithms.ppo import PPOConfig\n\nwith open(\"best_config.json\", \"r\") as f:\n    config_dict = json.load(f)\n\n# Apply to PPOConfig\nconfig = PPOConfig().from_dict(config_dict)\nalgo = config.build()\n```\n\n---\n\n## Modification Guide\n\n### Adjusting Task Difficulty\n\nModify `task_sampler_overrides` to change the reward shaping:\n\n```json\n\"task_sampler_overrides\": {\n  \"turnover_w\": 0.002,    // Increase turnover penalty\n  \"dd_w\": 0.02,           // Adjust drawdown penalty\n  \"dd_T_weight\": 0.05     // Time-weighted drawdown coefficient\n}\n```\n\n### Changing Model Capacity\n\nAdjust `fcnet_hiddens` in both `model` and `custom_model_config`:\n\n```json\n\"fcnet_hiddens\": [512, 512, 256]  // Larger network\n```\n\n### Enabling GPU Training\n\n```json\n\"num_gpus\": 1,\n\"num_gpus_per_worker\": 0  // Workers typically remain CPU-only\n```\n\n---\n\n## Key Relationships\n\n```mermaid\ngraph LR\n    A[best_config.json] --> B[PPOConfig]\n    B --> C[ITraderEnv]\n    B --> D[solver_mlp_film Model]\n    C --> E[Task Sampler]\n    D --> F[FiLM Conditioning]\n    E --> G[Task Embeddings]\n    G --> F\n```\n\nThe configuration binds together:\n1. **Environment** (`ITraderEnv`) with task sampling\n2. **Model** (`solver_mlp_film`) with task-conditioned architecture\n3. **Algorithm** (PPO) with optimized hyperparameters for this specific environment-model combination","other-data-wal":"# Other — data-wal\n\n# Data — Write-Ahead Log (WAL)\n\n## Overview\n\nThe `data/wal/` directory contains Write-Ahead Log segment files used for durability and crash recovery. These are binary data files, not source code, and are generated and consumed by the storage engine at runtime.\n\n## Purpose\n\nWrite-Ahead Logging is a recovery mechanism that ensures data integrity:\n\n1. **Durability** — All operations are persisted to disk before being applied to in-memory state\n2. **Crash Recovery** — After an unexpected shutdown, the system replays WAL entries to restore the last consistent state\n3. **Atomicity** — Transactions can be completed or rolled back based on WAL contents\n\n## File Structure\n\n```\ndata/wal/\n├── 00000000    # Oldest segment\n├── 00000001\n├── 00000002\n├── 00000003\n├── 00000004\n└── 00000005    # Newest segment (active)\n```\n\n### Naming Convention\n\nFiles use zero-padded sequential numbering:\n\n- **Format**: 8-digit decimal numbers (`%08d`)\n- **Ordering**: Numerically ascending from `00000000`\n- **Active segment**: The highest-numbered file receives new writes\n\n### Segment Rotation\n\nThe WAL is split into segments to:\n\n- Limit individual file sizes for easier management\n- Enable safe deletion of old segments after compaction\n- Support incremental backup strategies\n\n## Lifecycle\n\n```mermaid\nflowchart LR\n    A[Write Operation] --> B[Append to Active Segment]\n    B --> C[Flush to Disk]\n    C --> D[Apply to MemTable]\n    \n    E[Segment Full] --> F[Create New Segment]\n    F --> G[Increment Number]\n    \n    H[Compaction] --> I[Checkpoint Complete]\n    I --> J[Delete Old Segments]\n```\n\n## Usage Notes\n\n| Operation | Description |\n|-----------|-------------|\n| **Read** | Sequential scan during recovery; random access for specific entries |\n| **Write** | Append-only to the active (highest-numbered) segment |\n| **Delete** | Old segments removed after successful checkpoint/compaction |\n| **Backup** | Copy segments in order; active segment may require special handling |\n\n## Integration Points\n\nThis directory is managed by the WAL subsystem of the storage engine. The actual implementation lives elsewhere in the codebase — this directory contains only the runtime data files.\n\n**Expected callers** (not in this module):\n- WAL writer — appends entries to the active segment\n- WAL reader — replays entries during recovery\n- Compaction manager — removes obsolete segments\n\n## Configuration\n\nSegment size, flush policies, and retention rules are typically configured in the main storage engine configuration, not in this directory.","other-data":"# Other — data\n\n# Data Module — Active Queries Marker\n\n## Overview\n\nThe `data/queries.active` file serves as a marker or state file within the data module. Based on its naming convention and location, this file appears to track active query state or serve as a lock/indicator file for query processing operations.\n\n## File Characteristics\n\n| Property | Value |\n|----------|-------|\n| Location | `data/` |\n| Filename | `queries.active` |\n| Content | Empty/placeholder |\n| Dependencies | None detected |\n\n## Purpose\n\nThe `.active` extension convention typically indicates one of the following patterns:\n\n1. **State Marker** — Signals that queries are currently being processed\n2. **Lock File** — Prevents concurrent access to query resources\n3. **Feature Flag** — Enables or disables query-related functionality\n4. **Runtime Indicator** — Created/modified at runtime to track active query sessions\n\n## Integration Points\n\nThis file has no detected code dependencies:\n\n- **No incoming calls** — Not directly invoked by other modules\n- **No outgoing calls** — Does not call other functions or modules\n- **No execution flows** — Not part of any detected call chain\n\nThis isolation suggests the file is likely:\n- Read/written by external tooling or scripts\n- Managed by the runtime environment\n- Used as a configuration toggle rather than executable code\n\n## Usage Notes\n\nWhen working with this file:\n\n- **Do not delete** — May be required for proper system operation\n- **Check before modifying** — Could affect query processing state\n- **Monitor for changes** — Runtime systems may modify this file dynamically\n\n## Related Files\n\nThis file resides in the `data/` directory, suggesting it works alongside other data-related resources. Check sibling files in the same directory for related query handling logic.","other-docs-daily-logs":"# Other — docs-daily_logs\n\n# Daily Logs Documentation System\n\n## Overview\n\nThe `docs/daily_logs/` module provides a structured workflow for maintaining a persistent engineering record across development sessions. It enables consistent tracking of changes, rationale, validation steps, and follow-up items—particularly valuable when work spans multiple sessions or involves different AI assistants.\n\n## Purpose\n\n- **Session continuity**: Preserve context between development sessions\n- **Change traceability**: Record what changed, why, and how it was validated\n- **Cross-model handoff**: Enable different AI assistants to understand prior work\n- **Audit trail**: Maintain a chronological record of engineering decisions\n\n## File Structure\n\n```\ndocs/daily_logs/\n├── README.md           # System overview and workflow guide\n├── COMMANDS.md         # Ready-to-use prompts for log generation\n├── _TEMPLATE.md        # Template for new daily log files\n├── 2026-02-15.md       # Example: completed daily log\n└── 2026-03-03.md       # Example: completed daily log\n```\n\n## Workflow\n\n```mermaid\nflowchart TD\n    A[Start Session] --> B[Copy _TEMPLATE.md]\n    B --> C[Create YYYY-MM-DD.md]\n    C --> D[Work on Task]\n    D --> E{Meaningful Change?}\n    E -->|Yes| F[Append Entry]\n    F --> G[Document: Change, Why, Validation, Notes]\n    G --> D\n    E -->|No| D\n    D --> H{Session End?}\n    H -->|Yes| I[Write End Of Session Summary]\n    I --> J[Optional: Export to Notion]\n```\n\n## Entry Format\n\n### Daily Log Header\n\nEach daily log file begins with context metadata:\n\n```markdown\n# Daily Log - YYYY-MM-DD\n\n## Context\n- Branch: `feature-branch-name`\n- Session goal: Description of intended work\n- Constraints: Environment limitations, restrictions\n```\n\n### Automatic Daily Log Entries\n\nIndividual work entries follow this structure:\n\n```markdown\n### Entry HH:MM\n- Change: What was modified or added\n- Why: Rationale for the change\n- Validation: How the change was verified\n- Notes: Additional context, caveats, or follow-ups\n```\n\n### End Of Session Summary\n\nClosing section aggregates session outcomes:\n\n```markdown\n## End Of Session\n- Key outcomes: Summary of achievements\n- Files changed: List of modified files\n- Commands run: Executed commands for reproducibility\n- Open items: Pending work or blockers\n```\n\n## Usage Prompts\n\n### During Session\n\n```\nAppend an automatic daily log entry to docs/daily_logs/YYYY-MM-DD.md \nwith what changed, why, validation, and follow-ups.\n```\n\n### End Of Session\n\n```\nGenerate daily log for today and append a final AUTOMATIC DAILY LOG \nsection to docs/daily_logs/YYYY-MM-DD.md.\n```\n\n### Notion Export\n\n```\nGenerate a Notion-ready daily summary from docs/daily_logs/YYYY-MM-DD.md \nwith sections: Outcomes, Changes, Validation, Pending.\n```\n\n## File Naming Convention\n\n| Pattern | Example | Description |\n|---------|---------|-------------|\n| `YYYY-MM-DD.md` | `2026-02-15.md` | One file per calendar day |\n\nFiles use ISO 8601 date format for natural chronological sorting.\n\n## Integration Points\n\n### Pre-commit Hooks\n\nDaily logs integrate with the project's pre-commit workflow. The `.pre-commit-config.yaml` references hygiene checks that may validate log file structure.\n\n### Healthcheck Script\n\nThe `itrader/tools/healthcheck.py` script can verify documentation integrity as part of environment diagnostics.\n\n### Notion Sync (Optional)\n\nThe COMMANDS.md file includes a prompt template for generating Notion-compatible summaries, enabling optional synchronization with external project management tools.\n\n## Best Practices\n\n1. **Timestamp entries**: Use `HH:MM` format for chronological clarity\n2. **Be specific about validation**: Note exact commands run and their outputs\n3. **Link related work**: Reference previous entries when continuing work\n4. **Document blockers**: Record environment issues or dependency problems\n5. **Close loops**: Mark open items as resolved in subsequent entries\n\n## Example: Complete Entry\n\n```markdown\n### Entry 14:32\n- Change: added `itrader/tools/healthcheck.py` for environment diagnostics\n- Why: introduce repeatable pre-commit checks for faster debugging\n- Validation: healthcheck script compiled; runtime execution pending \n  environment dependency setup\n- Notes: pre-commit hooks include hygiene checks, healthcheck, and tests\n```\n\n## Relationship to Codebase\n\nThe daily logs system is purely documentary—it contains no executable code and has no runtime dependencies. It serves as a meta-layer for tracking changes to:\n\n- `itrader/rl_lib/` - Reinforcement learning training modules\n- `itrader/envs/` - Trading environment implementations\n- `itrader/tests/` - Test suites\n- `itrader/tools/` - Utility scripts\n- Configuration files (`pyproject.toml`, `.pre-commit-config.yaml`)","other-docs-knowledge":"# Other — docs-knowledge\n\n# Knowledge Layer (`docs/knowledge/`)\n\n## Purpose\n\nThe `docs/knowledge/` module provides a graph-native code intelligence layer for the `itrader-azr` repository. It uses **GitNexus** as the backend to give agents (Codex, Cursor) structured understanding of code relationships—call graphs, dependencies, and impact analysis—beyond what grep and direct file reading provide.\n\nThis is an **advisory layer**: GitNexus augments but does not replace source inspection. When graph context and source disagree, the code wins.\n\n## Architecture\n\n```mermaid\ngraph LR\n    subgraph \"Knowledge Layer\"\n        INDEX[INDEX_STATUS.md]\n        WIKI[wiki/]\n        TREE[module_tree.json]\n        DECISIONS[DECISIONS.md]\n        EVAL[EVAL.md]\n    end\n    \n    subgraph \"GitNexus Backend\"\n        DB[(.gitnexus/)]\n        CLI[gitnexus CLI]\n        MCP[MCP Server]\n    end\n    \n    subgraph \"Consumers\"\n        CODEX[Codex]\n        CURSOR[Cursor]\n        WEB[Web UI]\n    end\n    \n    CLI --> DB\n    MCP --> DB\n    CODEX --> MCP\n    CURSOR --> MCP\n    WEB --> MCP\n    CLI --> INDEX\n    CLI --> WIKI\n    CLI --> TREE\n```\n\n## Key Components\n\n### Tracked Artifacts\n\n| Artifact | Purpose |\n|----------|---------|\n| `INDEX_STATUS.md` | Current index freshness, commit hash, node/edge counts |\n| `module_tree.json` | JSON representation of repository structure |\n| `wiki/` | Human-readable module documentation (synced from `.gitnexus/wiki/`) |\n| `DECISIONS.md` | Architectural decisions and rationale |\n| `EVAL.md` | Evaluation framework for GitNexus vs baseline comparison |\n\nThe local `.gitnexus/` database is **never committed**—it's regenerated from source.\n\n### Tooling Scripts (`tools/knowledge/`)\n\n| Script | Function |\n|--------|----------|\n| `setup_gitnexus.sh` | One-time GitNexus installation |\n| `index_repo.sh` | Build/rebuild the knowledge graph |\n| `status.sh` | Check index freshness against current commit |\n| `generate_wiki.sh` | LLM-backed wiki generation (requires API key) |\n| `serve_http_mcp.sh` | Expose GitNexus via HTTP MCP for remote access |\n| `codex_with_gitnexus.sh` | Launch Codex with GitNexus MCP injected |\n| `post_commit_refresh.sh` | Update index after commit (recommended automation) |\n| `pre_commit_advisory.sh` | Optional advisory hook for pre-commit |\n| `gitnexus.sh` | Wrapper for direct CLI commands |\n\n### Bootstrap Layer (`tools/knowledge/bootstrap/`)\n\nReusable setup for seeding other repositories:\n\n```bash\ntools/knowledge/bootstrap/init_repo_knowledge.sh /path/to/other-repo\n```\n\nCreates runtime scripts, configs, and docs skeleton without overwriting existing `AGENTS.md` or editor configs.\n\n## Usage\n\n### First-Time Setup\n\n```bash\ntools/knowledge/setup_gitnexus.sh\ntools/knowledge/index_repo.sh\ntools/knowledge/status.sh\n```\n\nExpected output: `Status: up-to-date` with node/edge/flow counts.\n\n### CLI Queries\n\n```bash\n# List indexed symbols\n./tools/knowledge/gitnexus.sh list\n\n# Query for a concept\n./tools/knowledge/gitnexus.sh query TaskPool\n\n# Get context around a symbol\n./tools/knowledge/gitnexus.sh context TaskPool\n\n# Analyze impact of changes\n./tools/knowledge/gitnexus.sh impact TaskPool\n```\n\n### Codex Integration\n\n**Stdio mode (default):**\n```bash\ntools/knowledge/codex_with_gitnexus.sh\n```\n\n**HTTP mode (shared backend):**\n```bash\n# Start the HTTP backend first\ntools/knowledge/serve_http_mcp.sh\n\n# Then attach Codex\nGITNEXUS_USE_HTTP=1 tools/knowledge/codex_with_gitnexus.sh\n```\n\nIn HTTP mode, `codex mcp list` shows `gitnexus_http` as the shared backend.\n\n### Remote Access\n\nThe HTTP MCP endpoint enables LAN access from other machines:\n\n```text\nhttp://<mac-ip>:4747/api/mcp\n```\n\nThis is optional—same-machine editor access is the default.\n\n## Agent Workflows\n\n### Exploring Unfamiliar Code\n\n1. Run `tools/knowledge/status.sh` to verify freshness\n2. `./tools/knowledge/gitnexus.sh query <concept>`\n3. `./tools/knowledge/gitnexus.sh context <symbol>`\n4. Read the source files GitNexus identifies\n\nGood starting points in `itrader`: `TaskPool`, `_generate_task_pool`, `train_AZR`, `TaskSampler00`\n\n### Debugging\n\n1. `./tools/knowledge/gitnexus.sh query <error-text-or-symptom>`\n2. `./tools/knowledge/gitnexus.sh context <suspect-symbol>`\n3. Inspect surrounding process cluster in the web UI if available\n4. Confirm root cause in source\n\n### Impact Analysis (Before Edits)\n\n1. `./tools/knowledge/gitnexus.sh impact <symbol>`\n2. Review direct dependents (depth 1 = break risk)\n3. Check whether affected files are tests, training code, samplers, or task definitions\n4. Only then start editing\n\n### Refactoring\n\n1. `./tools/knowledge/gitnexus.sh context <symbol>`\n2. `./tools/knowledge/gitnexus.sh impact <symbol>`\n3. Make code changes\n4. `tools/knowledge/post_commit_refresh.sh` after commit\n\n## Freshness Model\n\nGitNexus tracks freshness against **git commits**, not file timestamps:\n\n- Indexing after edits but before commit shows \"fresh\" until the commit changes\n- After a new commit, re-run `index_repo.sh` or `post_commit_refresh.sh`\n- This is why `post-commit` hooks are more accurate than `pre-commit` for graph updates\n\n## Wiki Generation\n\nWiki generation requires an OpenAI-compatible chat endpoint:\n\n```bash\n# With OpenAI API key\nOPENAI_API_KEY=... tools/knowledge/generate_wiki.sh\n\n# With Azure OpenAI\nAZURE_OPENAI_API_KEY=... tools/knowledge/generate_wiki.sh\n\n# With self-hosted endpoint\ntools/knowledge/generate_wiki.sh --base-url http://host:11434/v1 --api-key dummy --model <model>\n```\n\n**Note:** ChatGPT Plus subscription does not provide a reusable API key. Codex can still work in this repo without wiki generation—this limitation only affects `gitnexus wiki`.\n\n## Evaluation Framework\n\n`EVAL.md` defines a comparison protocol between:\n\n1. **Baseline**: raw grep + direct file reading\n2. **GitNexus-assisted**: `query`, `context`, `impact`, `detect_changes`\n\nRecord for each prompt:\n- Correctness of answer\n- Key files found\n- Dependencies missed\n- Time to first useful answer\n- Overconfidence level\n- Whether direct reads changed the conclusion\n\n**Decision rule**: Keep advisory mode unless GitNexus consistently finds right files faster, misses fewer dependencies, and stays calibrated when the graph is stale.\n\n## Design Decisions\n\n| Decision | Rationale |\n|----------|-----------|\n| GitNexus as backend | Real standalone CLI, MCP tools for agents, local + HTTP serving |\n| Advisory rollout | Measurable comparison before hard-switch; graph augments, doesn't override |\n| Post-commit over pre-commit | Indexing is heavy; wiki generation is LLM-backed; commit-based freshness is accurate |\n| Mac as p

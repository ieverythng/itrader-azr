@register(\n    \"custom_reward\",\n    normalize_params=my_normalizer,\n    sample_params=my_sampler,\n)\ndef my_reward(params: dict, ctx: dict) -> tuple[float, dict]:\n    reward = params.get(\"weight\", 1.0) * ctx.get(\"value\", 0.0)\n    return reward, {\"value\": ctx.get(\"value\", 0.0)}\n\n# Immediately available\nRewardEngine.compute(\"custom_reward\", {\"weight\": 2.0}, {\"value\": 0.5})\n```\n\n## Helper Functions\n\n### Value Sanitization\n\n| Function | Purpose |\n|----------|---------|\n| `_finite_float(value)` | Convert to float, return 0.0 for non-finite |\n| `_clamp_signed(value, cap)` | Clamp absolute value, preserve sign |\n| `_bounded_float(value, default, lo, hi)` | Bound value within range |\n\n### Type Coercion\n\n| Function | Purpose |\n|----------|---------|\n| `_coerce_bool(value, default)` | Convert str/int/bool to bool |\n| `_normalized_mode(value, default, allowed)` | Validate mode string |\n\n### RNG Wrappers\n\n| Function | Purpose |\n|----------|---------|\n| `_rng_choice(rng, choices)` | Call `rng.choice()` with fallback |\n| `_rng_uniform(rng, lo, hi)` | Call `rng.uniform()` with fallback |\n\nBoth wrappers support NumPy arrays (calling `.item()` on results) and raise `TypeError` if the RNG lacks required methods.\n\n## Integration Points\n\n### Environment Integration\n\nCalled from `itrader/envs/itrader_env.py` during `step()`:\n\n```python\nreward, components = RewardEngine.compute(\n    reward_id=self.reward_id,\n    params=self.reward_params,\n    ctx={\n        \"pnl_delta\": pnl_delta,\n        \"turnover_t\": turnover,\n        \"dd_inc\": dd_increment,\n        \"terminal\": done,\n        ...\n    }\n)\n```\n\n### Task Validation\n\n`rl_lib/tasks/validation.py` normalizes parameters before task validation:\n\n```python\nnormalized = RewardEngine.normalize_params(reward_id, params)\n```\n\n### Parameter Sampling\n\n`rl_lib/tasks/samplers.py` and `itrader/proposers/rule_based.py` sample random parameters:\n\n```python\nparams = RewardEngine.sample_params(reward_id, rng)\n# Internally: sample → normalize_params\n```\n\n## Parameter Normalization Flow\n\n```mermaid\nsequenceDiagram\n    participant Caller\n    participant Engine as RewardEngine\n    participant Spec as RewardSpec\n    participant Normalizer\n    \n    Caller->>Engine: sample_params(id, rng)\n    Engine->>Spec: get from registry\n    Spec->>Normalizer: sample_params(rng)\n    Normalizer-->>Spec: raw params\n    Spec->>Normalizer: normalize_params(raw)\n    Normalizer-->>Spec: validated params\n    Spec-->>Engine: final params\n    Engine-->>Caller: return\n```\n\n## Design Notes\n\n1. **Registry Pattern**: Decouples reward definitions from consumers, enabling runtime discovery and extension.\n\n2. **Parameter Sanitization**: All normalizers use `_bounded_float` and `_finite_float` to ensure valid parameter ranges, preventing NaN/Inf propagation.\n\n3. **Component Transparency**: Reward functions return both total reward and individual components, enabling logging and analysis.\n\n4. **Extensibility**: `composed_linear` allows adding new reward components without modifying environment code—just add a `*_w` parameter.\n\n5. **RNG Abstraction**: Sampler functions accept any RNG with `choice()` and `uniform()` methods (NumPy, PyTorch, etc.).","task-proposers":"# Task Proposers\n\n# Task Proposers Module\n\n## Overview\n\nThe Task Proposers module generates task specifications for trading reinforcement learning experiments. It provides a backend-agnostic abstraction layer supporting multiple generation strategies: deterministic rule-based sampling, local LLM inference via Ollama, and OpenAI-compatible endpoints (vLLM, SGLang).\n\n## Architecture\n\n```mermaid\ngraph TD\n    A[build_proposer] --> B[RuleBasedProposer]\n    A --> C[OllamaProposer]\n    A --> D[OpenAICompatProposer]\n    A --> E[ProposerLLM]\n    \n    B --> F[RewardEngine]\n    C --> G[Ollama API]\n    D --> H[vLLM/SGLang]\n    \n    I[_shared.py] --> J[parse_json_with_repair]\n    I --> K[schema_hint]\n    I --> L[normalize_count]\n    \n    C --> I\n    D --> I\n```\n\n## Core Components\n\n### BaseProposer\n\nAbstract base class defining the proposer contract. All implementations must inherit from this class.\n\n**Attributes:**\n- `backend_name` — Class attribute identifying the backend type\n\n**Abstract Method:**\n- `propose_tasks(market_summary: str, n: int, **kwargs) -> List[Dict[str, Any]]` — Returns up to `n` task specification dictionaries\n\n### Factory Function\n\n```python\nfrom itrader.proposers import build_proposer\n\n# Create a rule-based proposer\nproposer = build_proposer(\"rule_based\", seed=42, horizons=[64, 128])\n\n# Create an Ollama proposer\nproposer = build_proposer(\"ollama\", model=\"qwen2.5:7b-instruct\")\n\n# Create an OpenAI-compatible proposer\nproposer = build_proposer(\"openai_compat\", base_url=\"http://localhost:8000/v1\")\n```\n\n**Supported Backend Aliases:**\n\n| Backend | Aliases |\n|---------|---------|\n| RuleBasedProposer | `rule`, `rule_based`, `random` |\n| OllamaProposer | `ollama`, `ollama_local` |\n| OpenAICompatProposer | `openai`, `openai_compat`, `openai_compatible`, `vllm`, `sglang` |\n| ProposerLLM (lazy) | `llm`, `transformers` |\n\nThe factory normalizes backend names by stripping whitespace, lowercasing, and replacing hyphens with underscores.\n\n## Proposer Implementations\n\n### RuleBasedProposer\n\nDeterministic, dependency-light proposer for local development and testing. Does not use LLM inference.\n\n**Initialization Parameters:**\n\n| Parameter | Type | Default | Description |\n|-----------|------|---------|-------------|\n| `seed` | int | 42 | Random seed for reproducibility |\n| `window_size` | int | 30 | Observation window size |\n| `n_features` | int | 5 | Number of features per bar |\n| `t_embed_dim` | int | 32 | Time embedding dimension |\n| `action_dim` | int | 3 | Action space dimension |\n| `price_ids` | Sequence[str] | [\"SIM\"] | Available price data identifiers |\n| `horizons` | Sequence[int] | [64, 96, 128, 160, 200, 256] | Episode horizon options |\n| `reward_id` | str | \"pnl_linear\" | Reward function identifier |\n| `reward_params` | Dict[str, Any] | None | Base reward parameters |\n| `bar_resolution` | str | DEFAULT_BAR_RESOLUTION | Data bar resolution |\n\n**Computed Property:**\n- `obs_dim` — Calculated as `window_size * n_features + t_embed_dim`\n\n**Task Generation Flow:**\n1. Samples `price_id` from configured options\n2. Samples `horizon` from configured options\n3. Generates reward parameters via `RewardEngine.sample_params()` and `normalize_params()`\n4. Assigns random seed for task reproducibility\n\n### OllamaProposer\n\nLLM-backed proposer using Ollama's local inference API.\n\n**Initialization Parameters:**\n\n| Parameter | Type | Default | Description |\n|-----------|------|---------|-------------|\n| `model` | str | \"qwen2.5:7b-instruct\" | Ollama model identifier |\n| `base_url` | str | \"http://localhost:11434\" | Ollama server URL |\n| `timeout_s` | float | 60.0 | Request timeout in seconds |\n| `temperature` | float | 0.2 | Sampling temperature |\n| `num_predict` | int | 768 | Maximum tokens to generate |\n\n**API Endpoint:** `{base_url}/api/generate`\n\n**Error Handling:**\n- HTTP errors include status code and first 400 characters of response\n- Connection errors wrap the underlying URLError with context\n\n### OpenAICompatProposer\n\nLLM-backed proposer for OpenAI-compatible chat completion endpoints (vLLM, SGLang, etc.).\n\n**Initialization Parameters:**\n\n| Parameter | Type | Default | Description |\n|-----------|------|---------|-------------|\n| `model` | str | \"Qwen/Qwen3.5-9B\" | Model identifier |\n| `base_url` | str | \"http://localhost:8000/v1\" | API base URL |\n| `api_key` | str | None | Optional API key for authentication |\n| `timeout_s` | float | 60.0 | Request timeout in seconds |\n| `temperature` | float | 0.2 | Sampling temperature |\n| `max_tokens` | int | 768 | Maximum tokens in response |\n\n**API Endpoint:** `{base_url}/chat/completions`\n\n**Message Structure:**\n- System message: Instructs the model as a trading task generator\n- User message: Contains market summary, task count, and schema hint\n\n## Shared Utilities\n\nThe `_shared.py` module provides common functionality for LLM-backed proposers.\n\n### JSON Parsing with Repair\n\n```python\nfrom itrader.proposers._shared import parse_json_with_repair\n\ntasks = parse_json_with_repair(raw_llm_output, expected_n=10)\n```\n\n**Repair Strategy:**\n1. Attempt direct `json.loads()` parsing\n2. Fall back to regex extraction using patterns `r\"\\[[\\s\\S]*\\]\"` and `r\"\\{[\\s\\S]*\\}\"`\n3. Return up to `expected_n` valid task dictionaries\n\n### Schema Hint\n\n```python\nfrom itrader.proposers._shared import schema_hint\n\nhint = schema_hint()  # Returns task schema guidance for LLM prompts\n```\n\nThe schema hint instructs LLMs to output valid JSON arrays with canonical task fields.\n\n### Count Normalization\n\n```python\nfrom itrader.proposers._shared import normalize_count\n\ncount = normalize_count(n)  # Ensures non-negative integer\n```\n\n## Task Specification Schema\n\nGenerated tasks follow this canonical structure:\n\n| Field | Type | Description |\n|-------|------|-------------|\n| `family_id` | str | Task family identifier |\n| `price_id` | str | Price data source identifier |\n| `horizon` | int | Episode length in bars |\n| `reward_id` | str | Reward function identifier |\n| `reward_params` | dict | Reward function parameters |\n| `seed` | int | Random seed for task |\n| `obs_dim` | int | Observation space dimension |\n| `action_dim` | int | Action space dimension |\n| `start_idx` | int | None | Starting bar index |\n| `bar_resolution` | str | Data bar resolution |\n\n**Optional Forward-Compatible Fields:**\n- `regime_tags` — Market regime labels\n- `difficulty_target` — Target difficulty level\n- `metadata` — Additional task metadata\n\n## Integration Points\n\n### Inbound Calls\n\nThe factory function is called from:\n- `rl_lib/train/train_AZR.py` — Training script builds proposer from CLI arguments\n- `itrader/scripts/gen_task_pool.py` — Task pool generation script\n\n### Outbound Dependencies\n\n- `itrader.rl_lib.tasks.rewards.RewardEngine` — RuleBasedProposer samples and normalizes reward parameters\n- `itrader.llm.proposer_llm.ProposerLLM` — Lazy-loaded via factory for \"llm\"/\"transformers\" backends\n\n## Usage Examples\n\n### Basic Usage\n\n```python\nfrom itrader.proposers import build_proposer\n\n# Create and use a rule-based proposer\nproposer = build_proposer(\"rule_based\", seed=42)\ntasks = proposer.propose_tasks(market_summary=\"BTC/USD volatile\", n=5)\n```\n\n### LLM-Backed Proposer\n\n```python\n# Ollama local inference\nproposer = build_proposer(\n    \"ollama\",\n    model=\"qwen2.5:7b-instruct\",\n    base_url=\"http://localhost:11434\",\n    temperature=0.3\n)\ntasks = proposer.propose_tasks(\n    market_summary=\"High volatility regime detected\",\n    n=10\n)\n\n# vLLM endpoint\nproposer = build_proposer(\n    \"vllm\",\n    base_url=\"http://gpu-server:8000/v1\",\n    model=\"Qwen/Qwen3.5-9B\"\n)\ntasks = proposer.propose_tasks(market_summary=\"...\", n=5)\n```\n\n### Custom Configuration\n\n```python\n# Rule-based with custom horizons and price sources\nproposer = build_proposer(\n    \"rule_based\",\n    seed=123,\n    horizons=[32, 64, 128],\n    price_ids=[\"BTC\", \"ETH\", \"SOL\"],\n    reward_id=\"sharpe_ratio\"\n)\n```","task-system":"# Task System\n\n# Task System\n\nThe Task System provides a unified configuration layer for reinforcement learning training tasks. It handles task specification, validation, storage, sampling, and embedding generation for the training pipeline.\n\n## Architecture Overview\n\n```mermaid\ngraph TB\n    subgraph \"Core Specification\"\n        TaskSpec[TaskSpec]\n        TaskFamilySpec[TaskFamilySpec]\n        FamilyRegistry[Family Registry]\n    end\n    \n    subgraph \"Validation Layer\"\n        ValidateTask[validate_and_clamp_task]\n        ValidateCandidate[validate_candidate_task]\n        ValidateDecision[validate_decision_record]\n    end\n    \n    subgraph \"Storage & Sampling\"\n        TaskPool[TaskPool JSONL]\n        TaskSampler[TaskSampler00]\n    end\n    \n    subgraph \"Supporting Structures\"\n        CandidateTask[CandidateTask]\n        ExecutionIntent[ExecutionIntent]\n        CapabilityProfile[CapabilityProfile]\n        DecisionRecord[DecisionRecord]\n    end\n    \n    TaskFamilySpec --> FamilyRegistry\n    FamilyRegistry --> ValidateTask\n    TaskSpec --> ValidateTask\n    ValidateTask --> CandidateTask\n    CandidateTask --> DecisionRecord\n    ExecutionIntent --> CandidateTask\n    TaskPool --> TaskSampler\n    TaskSpec --> TaskPool\n```\n\n## Core Components\n\n### TaskSpec\n\nThe `TaskSpec` dataclass is the single source of truth for training task configuration. It captures all parameters needed to define a reproducible training episode.\n\n```python\nfrom rl_lib.tasks.spec import TaskSpec\n\n# Create directly\nspec = TaskSpec(\n    family_id=\"00\",\n    price_id=\"AAPL\",\n    horizon=128,\n    reward_id=\"pnl_linear\",\n    reward_params={\"pnl_w\": 1.0, \"dd_w\": 0.1},\n    seed=42,\n    obs_dim=182,  # window_size * n_features + t_embed_dim\n    action_dim=3,\n)\n\n# Or from dict with alias normalization\nspec = TaskSpec.from_dict({\n    \"task_family\": \"00\",        # alias for family_id\n    \"horizon_bars\": 128,        # alias for horizon\n    \"reward_config\": {          # nested reward config\n        \"name\": \"pnl_linear\",\n        \"params\": {\"pnl_w\": 1.0}\n    }\n})\n```\n\n**Key Fields:**\n\n| Field | Type | Description |\n|-------|------|-------------|\n| `family_id` | `str` | Logical task family identifier (e.g., \"00\" for directional predictor) |\n| `price_id` | `str` | Price stream or generator identifier |\n| `horizon` | `int` | Episode length in timesteps |\n| `reward_id` | `str` | Key into RewardEngine registry |\n| `reward_params` | `Dict[str, Any]` | Parameters passed to reward function |\n| `t_embed` | `Optional[List[float]]` | Precomputed task embedding (or None for encoder derivation) |\n| `seed` | `int` | RNG seed for reproducibility |\n| `obs_dim` | `int` | Total observation space dimension |\n| `action_dim` | `int` | Action space dimension |\n| `start_idx` | `Optional[int]` | Starting index in dataframe (None = random sampling) |\n| `regime_tags` | `List[str]` | Market regime labels |\n| `difficulty_target` | `Dict[str, Any]` | Difficulty targeting parameters |\n\n**Alias Support:** The `from_dict` method normalizes legacy field names:\n- `task_family` → `family_id`\n- `horizon_bars` → `horizon`\n- `start_index` → `start_idx`\n- `reward_config` (nested) → `reward_id` + `reward_params`\n\n### Task Families\n\nTask families define groups of related tasks with shared defaults.\n\n```python\nfrom rl_lib.tasks.families import get_family_spec, known_family_ids, family_registry\n\n# List available families\nids = known_family_ids()  # (\"00\", \"01\", \"02\")\n\n# Get family defaults\nfamily = get_family_spec(\"00\")\nprint(family.name)           # \"directional_predictor\"\nprint(family.action_dim)     # 3\nprint(family.horizon_range)  # (64, 512)\n```\n\n**Registered Families:**\n\n| ID | Name | Description |\n|----|------|-------------|\n| `00` | directional_predictor | Proven short-horizon directional task family |\n| `01` | breakout_expansion | Directional breakout/expansion framing |\n| `02` | mean_reversion | Directional mean-reversion framing |\n\nEach `TaskFamilySpec` provides:\n- `default_reward_id`: Default reward function (\"pnl_linear\")\n- `default_bar_resolution`: Default bar timeframe (\"1m\")\n- `horizon_range`: Valid horizon bounds `(min, max)`\n- `action_dim`: Action space dimension (default 3)\n\n## Validation Layer\n\nThe validation layer normalizes raw task dictionaries into safe, validated payloads. All validation functions return new dictionaries rather than mutating inputs.\n\n### Task Validation\n\n```python\nfrom rl_lib.tasks.validation import validate_and_clamp_task\n\nvalidated = validate_and_clamp_task(\n    {\"family_id\": \"00\", \"horizon\": 1000},  # horizon exceeds max\n    env_config={\"min_horizon\": 64, \"max_horizon\": 512},\n    fallback_seed=42,\n)\n# horizon clamped to 512\n```\n\n`validate_and_clamp_task` performs:\n1. **Alias normalization** via `normalize_task_spec_payload`\n2. **Family lookup** for defaults\n3. **Horizon clamping** to `[min_horizon, max_horizon]`\n4. **Reward param normalization** via `RewardEngine.normalize_params`\n5. **Type coercion** for all fields\n6. **Default population** for missing fields\n\n### Candidate Task Validation\n\n```python\nfrom rl_lib.tasks.validation import validate_candidate_task\n\ncandidate = validate_candidate_task({\n    \"task_spec\": {\"family_id\": \"00\"},\n    \"execution_intent\": {\"ttl_bars\": 100},\n    \"expected_difficulty\": 0.5,\n    \"abstain_option\": False,\n})\n```\n\n### Execution Intent Validation\n\n```python\nfrom rl_lib.tasks.validation import validate_and_clamp_execution_intent\n\nintent = validate_and_clamp_execution_intent({\n    \"entry_logic\": {\"type\": \"market\", \"params\": {}},\n    \"exit_logic\": {\"type\": \"ttl\", \"params\": {}},\n    \"ttl_bars\": 100,\n    \"confidence_band\": {\"min\": 0.3, \"target\": 0.7},\n    \"risk_envelope\": {\"max_position_pct\": 0.05},\n})\n```\n\nClamps:\n- `ttl_bars` to `[1, 1024]`\n- `confidence_band` values to `[0.0, 1.0]`\n- `risk_envelope.max_position_pct` to `[0.0, 1.0]`\n\n### Decision Record Validation\n\n```python\nfrom rl_lib.tasks.validation import validate_decision_record\n\nrecord = validate_decision_record({\n    \"market_summary_ref\": \"2024-01-15T10:30:00Z\",\n    \"candidate_tasks\": [...],\n    \"selected_candidate_id\": \"abc123\",\n    \"wait_selected\": False,\n})\n```\n\n## Task Pool\n\n`TaskPool` provides persistent task storage with JSONL backend and in-memory indexing for fast sampling.\n\n```python\nfrom rl_lib.tasks.task_pool import TaskPool, task_uid\n\n# Create or load pool\npool = TaskPool(\"tasks.jsonl\", read_only=False)\n\n# Add task (returns stable UID)\nuid = pool.add(task_spec.to_dict(), meta={\"source\": \"proposer\"})\n\n# Sample tasks\ntasks = pool.sample(batch_size=32, strategy=\"weighted\")\n\n# Update performance stats\npool.update_stats(uid, episode_return=1.5, success=True)\n\n# Prune to keep top performers\npool.prune(max_size=1000, keep_elite_k=100)\n```\n\n**Sampling Strategies:**\n\n| Strategy | Behavior |\n|-----------|----------|\n| `weighted` | 40% elite + 30% recent + 30% random (default) |\n| `uniform` | Random uniform sampling |\n| `elite` | Top performers by mean return |\n| `recent` | Most recently added tasks |\n\n**Task UID:** Each task gets a stable 16-character UID derived from SHA-256 hash of its canonical JSON representation. This ensures identical tasks have identical UIDs across processes.\n\n## Task Sampling\n\n`TaskSampler00` generates tasks for the \"00\" family, with optional TaskPool integration.\n\n```python\nfrom rl_lib.tasks.samplers import TaskSampler00\n\nsampler = TaskSampler00({\n    \"price_ids\": [\"AAPL\", \"BTCUSDT\"],\n    \"horizons\": [64, 128, 256],\n    \"reward_ids\": [\"pnl_linear\", \"pnl_sharpe\"],\n    \"reward_params\": {\"pnl_w\": 1.0, \"dd_w\": 0.1},\n    \"window_size\": 30,\n    \"n_features\": 5,\n    \"t_embed_dim\": 32,\n    \"action_dim\": 3,\n    \"seed\": 1234,\n    \"task_pool_path\": \"tasks.jsonl\",\n    \"p_pool\": 0.7,  # 70% from pool, 30% random\n})\n\ntask = sampler.sample()\n```\n\n**Sampling Flow:**\n\n1. If TaskPool enabled and `rng.random() < p_pool`, sample from pool\n2. Otherwise, generate random task:\n   - Random `price_id` from `price_ids`\n   - Random `horizon` from `horizons`\n   - Random `reward_id` from `reward_ids`\n   - Merge global and per-reward params\n\n**Reward Parameter Merging:**\n\n```python\n# Global params\n\"reward_params\": {\"pnl_w\": 1.0, \"dd_w\": 0.1}\n\n# Per-reward overrides\n\"reward_params_by_id\": {\n    \"pnl_sharpe\": {\"sharpe_window\": 50}\n}\n```\n\n## Task Encoding\n\n`TaskEncoder` produces fixed-length embeddings for task specifications.\n\n```python\nfrom rl_lib.tasks.encoder import TaskEncoder\n\n# Use precomputed embedding\nspec.t_embed = [0.1, 0.2, ...]  # 32 floats\nembedding = TaskEncoder.embed(spec, dim=32)\n\n# Or derive from spec fields\nspec.t_embed = None\nembedding = TaskEncoder.embed(spec, dim=32)  # derived from family_id, price_id, etc.\n```\n\n**Derivation Strategy:**\n\n1. Hash categorical fields (`family_id`, `price_id`, `reward_id`) to vectors\n2. Scale numeric fields (`horizon`, `obs_dim`, `action_dim`, `seed`) to `[-1, 1]`\n3. Mix categorical and numeric vectors\n4. Normalize to zero mean, unit variance\n\n## Supporting Data Structures\n\n### CandidateTask\n\nWraps a TaskSpec with execution metadata.\n\n```python\nfrom rl_lib.tasks.candidate_task import CandidateTask\n\ncandidate = CandidateTask(\n    task_spec=spec,\n    execution_intent=intent,\n    expected_difficulty=0.5,\n    expected_utility=1.2,\n    rationale=\"High momentum regime\",\n    abstain_option=False,\n)\n```\n\n### ExecutionIntent\n\nSpecifies how a task should be executed.\n\n```python\nfrom rl_lib.tasks.execution_intent import ExecutionIntent\n\nintent = ExecutionIntent(\n    entry_logic={\"type\": \"market\", \"params\": {}},\n    exit_logic={\"type\": \"ttl\", \"params\": {}},\n    ttl_bars=100,\n    confidence_band={\"min\": 0.3, \"target\": 0.7},\n    risk_envelope={\"max_position_pct\": 0.05, \"max_spread_bps\": 10.0},\n    abstain_allowed=True,\n)\n```\n\n### CapabilityProfile\n\nTracks agent capability metrics per task family.\n\n```python\nfrom rl_lib.tasks.capability_profile import CapabilityProfile\n\nprofile = CapabilityProfile(\n    task_family=\"00\",\n    bar_resolution=\"1m\",\n    regime_tags=[\"trending\", \"high_vol\"],\n    horizon_bars=128,\n    estimated_p_solve=0.65,\n    expected_net_utility=0.8,\n    calibration_error=0.05,\n    sample_count=1000,\n    last_updated=\"2024-01-15T10:30:00Z\",\n)\n```\n\n### DecisionRecord\n\nRecords a complete decision cycle with candidates and outcomes.\n\n```python\nfrom rl_lib.tasks.decision_record import DecisionRecord\n\nrecord = DecisionRecord(\n    market_summary_ref=\"2024-01-15T10:30:00Z\",\n    candidate_tasks=[candidate1, candidate2],\n    selected_candidate_id=\"abc123\",\n    wait_selected=False,\n    solver_scores={\"solver_a\": 0.8, \"solver_b\": 0.6},\n    risk_decisions={\"approved\": True},\n    executor_action={\"action\": \"long\", \"size\": 0.05},\n    realized_outcome={\"pnl\": 1.5, \"success\": True},\n)\n```\n\n## Integration Points\n\n### Environment Reset Flow\n\nDuring environment reset, the sampler provides a task:\n\n```\nenv.reset() → sampler.sample() → TaskSpec\n```\n\nIf TaskPool is configured, sampling prioritizes stored tasks with performance history.\n\n### Validation Flow\n\nAll external task dictionaries flow through validation:\n\n```\nraw_task_dict → validate_and_clamp_task() → TaskSpec.from_dict()\n```\n\nThis ensures:\n1. All required fields populated\n2. Values clamped to valid ranges\n3. Types coerced correctly\n4. Family defaults applied\n\n### Serialization Flow\n\nAll dataclasses support bidirectional serialization:\n\n```python\n# To dict\npayload = spec.to_dict()  # removes None/empty optional fields\n\n# From dict\nspec = TaskSpec.from_dict(payload)\n```\n\n## Best Practices\n\n1. **Always validate external input** - Use validation functions for any task dictionaries from external sources (APIs, files, LLMs)\n\n2. **Use TaskPool for curriculum learning** - Store successful tasks and sample weighted toward high performers\n\n3. **Precompute embeddings** - Set `t_embed` on TaskSpec when possible to avoid recomputation\n\n4. **Leverage family defaults** - Let family specs fill in defaults rather than specifying everything\n\n5. **Handle aliases** - Use `from_dict` which normalizes legacy field names","trading-environment":"# Trading Environment\n\n# Trading Environment Module\n\nA Gymnasium-compatible trading environment for reinforcement learning, supporting long/flat/short positions with rolling OHLCV observations and multi-task learning capabilities.\n\n## Overview\n\n`ITraderEnv` implements a discrete-action trading environment where an agent learns to take one of three positions at each timestep:\n\n| Action | Position |\n|--------|----------|\n| 0 | Short (-1) |\n| 1 | Flat (0) |\n| 2 | Long (+1) |\n\nThe environment returns a flattened rolling window of OHLCV features concatenated with an optional task embedding, enabling both single-task and multi-task reinforcement learning workflows.\n\n## Architecture\n\n```mermaid\nflowchart TB\n    subgraph Init[\"Initialization\"]\n        A[env_config] --> B[Load DataFrame]\n        B --> C[Resolve Feature Columns]\n        C --> D[Initialize TaskSampler]\n        D --> E[Define Observation Space]\n    end\n    \n    subgraph Reset[\"reset()\"]\n        F[Sample Task] --> G[Choose Start Index]\n        G --> H[Reset Episode State]\n        H --> I[Generate Task Embedding]\n        I --> J[Build Observation]\n    end\n    \n    subgraph Step[\"step(action)\"]\n        K[Map Action to Position] --> L[Advance Index]\n        L --> M[Compute Return/PnL]\n        M --> N[Update Drawdown]\n        N --> O[Build Reward Context]\n        O --> P[Compute Reward]\n        P --> Q[Build Next Observation]\n    end\n    \n    Init --> Reset --> Step\n```\n\n## Configuration\n\n### Core Parameters\n\n| Parameter | Type | Default | Description |\n|-----------|------|---------|-------------|\n| `df_path` | `str \\| Path` | `itrader/data/ohlcv.parquet` | Path to parquet file containing OHLCV data |\n| `window_size` | `int` | `30` | Number of timesteps in each observation window |\n| `feature_cols` | `list[str]` | OHLCV columns | Feature columns to use from dataframe |\n| `t_embed_dim` | `int` | `DEFAULT_T_EMBED_DIM` | Dimension of task embedding vector |\n| `t_embed_mode` | `str` | `\"concat\"` | Task embedding mode: `\"off\"`, `\"scale\"`, or `\"concat\"` |\n| `t_scale` | `float` | `1.0` | Scaling factor when `t_embed_mode=\"scale\"` |\n\n### Episode Start Modes\n\n| `start_idx_mode` | Behavior |\n|------------------|----------|\n| `\"random_episode\"` | Random starting index per episode using task seed |\n| `\"stream_worker\"` | Sequential streaming with optional jumps; worker-aware |\n| `\"task_spec\"` | Use `start_idx` from TaskSpec if provided |\n\n### Streaming Configuration\n\nFor `start_idx_mode=\"stream_worker\"`:\n\n| Parameter | Default | Description |\n|-----------|---------|-------------|\n| `stream_stride` | `horizon` | Steps to advance between episodes (0 = use horizon) |\n| `stream_jump_every_episodes` | `0` | Jump to random position after N episodes (0 = disabled) |\n| `stream_jump_on_wrap` | `True` | Jump to random position when stream wraps |\n\n### Return Normalization\n\n| Parameter | Default | Description |\n|-----------|---------|-------------|\n| `ret_norm_alpha` | `0.01` | EMA smoothing factor for return normalization |\n| `ret_norm_reset` | `\"episode\"` | When to reset EMA: `\"episode\"` or `\"stream\"` |\n\n### Debug Options\n\n| Parameter | Default | Description |\n|-----------|---------|-------------|\n| `debug_resets` | `False` | Enable reset logging |\n| `debug_reset_every` | `100` | Log every N resets |\n\n## Spaces\n\n```python\n# Observation: flattened window + task embedding\nobservation_space = Box(low=-inf, high=inf, shape=(window_size * n_features + t_embed_dim,), dtype=float32)\n\n# Action: discrete position choice\naction_space = Discrete(3)  # 0=short, 1=flat, 2=long\n```\n\n## Episode Lifecycle\n\n### Initialization\n\n```python\nenv = ITraderEnv({\n    \"df_path\": \"data/ohlcv.parquet\",\n    \"window_size\": 30,\n    \"task_sampler\": {\"seed\": 42}\n})\n```\n\nDuring `__init__`:\n1. Loads and validates the OHLCV dataframe\n2. Extracts feature columns and CLOSE column\n3. Initializes `TaskSampler00` with worker-aware seeding\n4. Creates observation/action spaces\n5. Calls `_reset_state()` to initialize episode buffers\n\n### Reset\n\n```python\nobs, info = env.reset(seed=42)\n```\n\nThe `reset()` method:\n1. Samples a task from `TaskSampler00`\n2. Chooses starting index based on `start_idx_mode`\n3. Resets episode state (position, PnL, drawdown tracking)\n4. Generates task embedding via `TaskEncoder.embed()`\n5. Returns initial observation and task info\n\n### Step\n\n```python\nobs, reward, done, truncated, info = env.step(action)\n```\n\nEach step:\n1. Maps action to position target (-1, 0, +1)\n2. Advances dataframe index by one timestep\n3. Computes scale-invariant return: `(price_next - price_t) / price_t`\n4. Updates mark-to-market PnL: `pnl += position * return`\n5. Tracks drawdown from peak equity\n6. Updates return normalization EMA\n7. Builds reward context and computes reward via `RewardEngine`\n8. Returns next observation, reward, and episode info\n\n## Reward Computation\n\nThe environment delegates reward computation to `RewardEngine.compute()`:\n\n```python\nr, comps = RewardEngine.compute(\n    task.reward_id,\n    task.reward_params,\n    reward_context\n)\n```\n\n### Reward Context\n\nThe `_reward_context()` method builds a dictionary containing:\n\n| Field | Description |\n|-------|-------------|\n| `pnl_t`, `pnl_t1` | PnL before and after step |\n| `pnl_delta` | Change in PnL |\n| `dd_t`, `dd_t1` | Drawdown before and after step |\n| `dd_inc` | Drawdown increase (max 0) |\n| `max_dd` | Maximum drawdown this episode |\n| `turnover_t` | Position change magnitude (0, 1, or 2) |\n| `ret` | Price return this step |\n| `ret_unit` | Normalization factor (1/ret_ema) |\n| `position_t` | Current position |\n| `action_t` | Action taken |\n| `terminal` | Whether episode ended |\n\n## Episode Statistics\n\nThe environment tracks episode-level statistics:\n\n```python\n# In info dict when done=True:\n{\n    \"ep_sums\": {\n        \"steps\": int,\n        \"horizon\": int,\n        \"act_counts\": np.ndarray,  # action counts\n        \"rc_sums\": dict[str, float]  # summed reward components\n    }\n}\n```\n\n## Task Integration\n\n### Task Sampling\n\nTasks are sampled via `TaskSampler00`:\n\n```python\nself.current_task = self.task_sampler.sample()\n```\n\nEach task provides:\n- `horizon`: Episode length\n- `reward_id`: Reward function identifier\n- `reward_params`: Reward function parameters\n- `seed`: For reproducible start index sampling\n\n### Task Embedding\n\nTask embeddings are generated via `TaskEncoder.embed()`:\n\n```python\nself._t_embed = TaskEncoder.embed(self.current_task, dim=self.t_embed_dim)\n```\n\nThree embedding modes:\n- `\"off\"`: Zero vector (no task info)\n- `\"scale\"`: Scaled embedding (`t_embed * t_scale`)\n- `\"concat\"`: Concatenated to observation (default)\n\n## Data Requirements\n\nThe input dataframe must:\n1. Be in parquet format\n2. Contain columns matching `_FEATURE_COLUMN_NAMES`: `OPEN`, `HIGH`, `LOW`, `CLOSE`, `VOLUME` (case-insensitive)\n3. Have a `CLOSE` column for price calculations\n\n## Numerical Stability\n\nThe `_sanitize()` function guards against NaN/Inf values:\n\n```python\ndef _sanitize(x: np.ndarray) -> np.ndarray:\n    return np.nan_to_num(x, nan=0.0, posinf=1e6, neginf=-1e6)\n```\n\nThis is applied to:\n- Feature rows via `_row()`\n- Observations via `_get_obs()` and `_build_obs()`\n\n## Worker-Aware Initialization\n\nFor distributed training, the environment supports worker-aware seeding:\n\n```python\n# Seeds are derived from worker_index and vector_index\nts_cfg[\"seed\"] = base_seed + 1_000_003 * worker_index + 97 * vector_index\nstream_seed = base_seed + 7 * worker_index + 13 * vector_index + 99\n```\n\nThis ensures different workers sample different tasks and starting positions.\n\n## Example Usage\n\n```python\nfrom itrader.envs import ITraderEnv\n\n# Basic usage\nenv = ITraderEnv({\n    \"df_path\": \"data/ohlcv.parquet\",\n    \"window_size\": 30,\n})\n\nobs, info = env.reset()\ndone = False\nwhile not done:\n    action = env.action_space.sample()\n    obs, reward, done, truncated, info = env.step(action)\n\n# Multi-task with streaming\nenv = ITraderEnv({\n    \"df_path\": \"data/ohlcv.parquet\",\n    \"start_idx_mode\": \"stream_worker\",\n    \"stream_stride\": 1000,\n    \"stream_jump_every_episodes\": 10,\n    \"task_sampler\": {\n        \"seed\": 42,\n        \"horizon_range\": [100, 500],\n    },\n})\n```","training-pipeline":"# Training Pipeline\n\n# Training Pipeline\n\nThe training pipeline provides the core infrastructure for training reinforcement learning agents using Ray RLlib and Ray Tune. It supports both direct PPO training (Phase A) and task-curriculum bootstrapping (Phase B) with Population-Based Training (PBT) support.\n\n## Architecture Overview\n\n```mermaid\nflowchart TD\n    subgraph Entry[\"Entry Points\"]\n        A[train_solo_V2.py<br/>Phase A Training]\n        B[train_AZR.py<br/>Phase B Bootstrap]\n        C[train_test.py<br/>Compatibility Shim]\n    end\n\n    subgraph Core[\"Core Components\"]\n        D[training_fn<br/>PPO Training Loop]\n        E[Callbacks]\n    end\n\n    subgraph Callbacks[\"Callbacks\"]\n        F[PSMetrics<br/>Episode Metrics]\n        G[AutoPlotterCallback<br/>Plot Generation]\n        H[CombinedCallback<br/>Both Callbacks]\n        I[MetricsOnlyCallback<br/>PBT Mode]\n    end\n\n    subgraph External[\"External Dependencies\"]\n        J[ITraderEnv]\n        K[TaskPool]\n        L[Proposer Factory]\n    end\n\n    B --> D\n    C --> A\n    A --> D\n    D --> E\n    E --> H\n    E --> I\n    H --> F\n    H --> G\n    F --> J\n    F --> K\n    B --> L\n    B --> K\n```\n\n## Entry Points\n\n### train_solo_V2.py — Phase A Training\n\nThe primary training entry point for PPO-based policy optimization with Ray Tune.\n\n**Usage:**\n```bash\npython -m itrader.rl_lib.train.train_solo_V2 \\\n    --data_path ~/data/ohlcv.parquet \\\n    --iters 200 \\\n    --workers 6 \\\n    --experiment_name Phase_A\n```\n\n**Key Arguments:**\n\n| Argument | Default | Description |\n|----------|---------|-------------|\n| `--iters` | 200 | Number of training iterations |\n| `--workers` | 6 | Number of parallel workers |\n| `--window` | 30 | Observation window size |\n| `--lr` | 5e-5 | Learning rate |\n| `--gamma` | 0.99 | Discount factor |\n| `--lambda` | 0.95 | GAE lambda |\n| `--train_batch_size` | 4800 | Samples per training batch |\n| `--pbt` | False | Enable Population-Based Training |\n| `--cpu_pbt` | False | Run PBT on CPU (many trials) |\n| `--pop` | 10 | Population size for PBT |\n| `--timeout_hours` | 5 | Global timeout |\n| `--restore_ckpt` | \"\" | Path to checkpoint to restore from |\n| `--task_pool_path` | \"\" | JSONL task pool for curriculum |\n| `--p_pool` | 0.7 | Probability of sampling from task pool |\n| `--start_idx_mode` | random_episode | Episode start index policy |\n| `--seed` | 1234 | Global random seed |\n\n### train_AZR.py — Phase B Bootstrap\n\nGenerates task curricula via proposers and hands off to the solver training.\n\n**Usage:**\n```bash\npython -m itrader.rl_lib.train.train_AZR \\\n    --backend rule_based \\\n    --n_tasks 200 \\\n    --task_pool_path ~/data/task_pool_azr.jsonl\n\n# Or with LLM proposer:\npython -m itrader.rl_lib.train.train_AZR \\\n    --backend llm \\\n    --model_id Qwen/Qwen2.5-7B-Instruct \\\n    --n_tasks 200\n```\n\n**Key Arguments:**\n\n| Argument | Default | Description |\n|----------|---------|-------------|\n| `--backend` | rule_based | Proposer backend (rule_based or llm) |\n| `--model_id` | Qwen/Qwen2.5-7B-Instruct | LLM model for llm backend |\n| `--n_tasks` | 200 | Number of tasks to generate |\n| `--gen_batch_size` | 8 | Tasks per proposer call |\n| `--max_empty_batches` | 10 | Max consecutive empty batches before abort |\n| `--no_train` | False | Generate task pool only, skip training |\n\n### train_test.py — Compatibility Shim\n\nDeprecated entry point that delegates to `train_solo_V2`. Maintained for backward compatibility.\n\n## Core Training Function\n\n### training_fn(config)\n\nThe trainable function executed by Ray Tune. Handles the complete training lifecycle:\n\n1. **Initialization**: Creates PPO algorithm with custom logger pointing to Tune trial directory\n2. **Checkpoint Restoration**: Supports PBT weight inheritance and explicit `--restore_ckpt`\n3. **Training Loop**: Iterates `stop_iters` times, calling `algo.train()` and reporting metrics\n4. **Metric Persistence**: Writes to three locations:\n   - `trial_dir/rllib/metrics_full.jsonl` — Full flattened metrics\n   - `~/ray_results/_stable_metrics/<trial>/metrics_full.jsonl` — Stable path for plotting\n   - `~/ray_results/_stable_metrics/<trial>/report_rows.csv` — CSV for analysis\n5. **Checkpointing**: Saves checkpoints at configurable intervals for PBT exploitation\n6. **Final Plotting**: Generates plots on completion if `auto_plot_on_end` is enabled\n\n**Key Helper Functions:**\n\n- `_extract_report(result, default_iteration)` — Extracts scalar metrics for Tune reporting\n- `_flatten_scalar_metrics(result)` — Recursively flattens nested result dicts\n- `_append_json_line(path, payload)` — Appends JSON lines atomically\n- `_append_report_row(path, row)` — Handles CSV with dynamic column expansion\n\n## Callbacks\n\n### PSMetrics — Episode Metrics Callback\n\nLogs custom metrics at episode end for monitoring training progress.\n\n**Metrics Logged:**\n\n| Metric | Description |\n|--------|-------------|\n| `episode_return_mean` | Primary scalar — total episode reward |\n| `act_{i}_frac` | Action fraction for action index i |\n| `act_short_frac` | Legacy: action 0 fraction |\n| `act_flat_frac` | Legacy: action 1 fraction |\n| `act_long_frac` | Legacy: action 2 fraction |\n| `rc_<component>` | Per-step average of reward components |\n| `success_mean` | Episode success flag average |\n| `task_horizon_mean` | Task horizon average |\n| `task_pool_return_mean` | Aggregate return across task pool |\n| `task_pool_success_rate_mean` | Aggregate success rate |\n\n**Environment Resolution:**\n\nThe callback resolves the underlying environment through multiple access paths:\n1. `base_env.get_sub_environments()` — Vector env (RLlib standard)\n2. `base_env.vector_env.envs` — Older vector env access\n3. `base_env.envs` — Fallback env list\n\n### AutoPlotterCallback — Automatic Plot Generation\n\nGenerates training plots at configurable intervals without interrupting training.\n\n**Initialization:**\n```python\ncallback = AutoPlotterCallback(\n    plot_interval=50,           # Plot every N iterations\n    plot_script_path=None,      # Auto-detect tools/plot_ray_results.py\n    auto_plot=True,             # Enable/disable plotting\n    plot_at_end_of_loop=False,  # Plot at end vs. during training\n)\n```\n\n**Trial Directory Resolution:**\n\nThe callback resolves the Ray Tune trial directory through a priority chain:\n1. `ray.air.session.get_trial_dir()` — Most reliable (AIR session)\n2. `result[\"logdir\"]` — From training result\n3. `algorithm.logdir` — From algorithm object\n4. Fallback: Scan `~/ray_results` for most recent trial\n\n**Plot Generation Flow:**\n1. Check `_should_plot(current_iter)` based on interval and mode\n2. Resolve trial directory via `_trial_dir()`\n3. Compute stable output path: `~/ray_results/_stable_metrics/<trial_name>/`\n4. Execute `tools/plot_ray_results.py` as subprocess\n5. Handle errors gracefully (never interrupts training)\n\n### CombinedCallback and MetricsOnlyCallback\n\n**CombinedCallback**: Combines `PSMetrics` and `AutoPlotterCallback` for single-trial runs.\n\n**MetricsOnlyCallback**: Uses only `PSMetrics` for PBT mode to avoid file collisions across many parallel trials.\n\n## Configuration\n\n### Base Config Construction\n\n`build_base_config(args, data_path, use_pbt_mode)` assembles the complete PPO configuration:\n\n```python\nconfig = {\n    \"env\": \"ITraderEnv\",\n    \"env_config\": {\n        \"df_path\": str(data_path),\n        \"window_size\": args.window,\n        \"task_sampler\": {...},\n    },\n    \"model\": {\n        \"custom_model\": \"solver_mlp_film\",\n        \"custom_model_config\": {...},\n    },\n    \"num_gpus\": 1,\n    \"num_workers\": args.workers,\n    \"framework\": \"torch\",\n    \"callbacks\": CombinedCallback,  # or MetricsOnlyCallback for PBT\n    # ... PPO hyperparameters\n}\n```\n\n### Task Sampler Config\n\nConfigured via `_task_sampler_config(args)`:\n\n```python\n{\n    \"window_size\": args.window,\n    \"n_features\": 5,\n    \"t_embed_dim\": 32,\n    \"action_dim\": 3,\n    \"horizons\": [96, 128, 160, 200],\n    \"turnover_w_choices\": [0.0, 0.0005, 0.001, 0.002],\n    \"dd_w_range\": (0.0, 0.04),\n    \"task_pool_path\": \"...\",  # Optional\n    \"p_pool\": 0.7,            # Probability of pool sampling\n}\n```\n\n### Model Config\n\nConfigured via `_model_config(args)`:\n\n```python\n{\n    \"custom_model\": \"solver_mlp_film\",\n    \"custom_model_config\": {\n        \"window_size\": 30,\n        \"t_embed_dim\": 32,\n        \"fcnet_hiddens\": [256, 256],\n        \"conditioning\": \"film\",\n        \"t_keep_p\": 0.7,\n        \"t_proj\": 64,\n    },\n}\n```\n\n## Population-Based Training\n\nWhen `--pbt` is enabled, the training uses Ray Tune's `PopulationBasedTraining` scheduler:\n\n```python\npbt = PopulationBasedTraining(\n    time_attr=\"training_iteration\",\n    perturbation_interval=3,\n    quantile_fraction=0.25,\n    resample_probability=0.25,\n    hyperparam_mutations={\n        \"lr\": tune.loguniform(1e-5, 5e-3),\n        \"clip_param\": tune.choice([0.1, 0.2]),\n        \"lambda\": tune.choice([0.90, 0.95, 0.97]),\n        \"gamma\": tune.choice([0.98, 0.99]),\n        # ... more hyperparameters\n    },\n)\n```\n\n**PBT Workflow:**\n1. Runs `--pop` trials in parallel\n2. Every 3 iterations, bottom 25% replaced by top 25% with perturbations\n3. Checkpoints saved at `checkpoint_interval` for weight inheritance\n4. Best params can be loaded via `--best_params_json` for retraining\n\n## Run Manifest\n\nEach run writes a manifest for reproducibility:\n\n```python\n{\n    \"run_id\": \"20240115T143022Z\",\n    \"created_at_utc\": \"2024-01-15T14:30:22Z\",\n    \"experiment_name\": \"Phase_A\",\n    \"git_commit\": \"abc123...\",\n    \"seed\": 1234,\n    \"config_hash\": \"def456...\",\n    \"dataset_path\": \"/path/to/data.parquet\",\n    \"dataset_sha256\": \"789abc...\",\n    \"is_pbt\": false,\n}\n```\n\n## Metric Persistence\n\nTraining metrics are persisted to multiple locations:\n\n| Path | Format | Purpose |\n|------|--------|---------|\n| `trial_dir/rllib/metrics_full.jsonl` | JSONL | Full nested metrics |\n| `~/ray_results/_stable_metrics/<trial>/metrics_full.jsonl` | JSONL | Stable path for plotting |\n| `~/ray_results/_stable_metrics/<trial>/report_rows.csv` | CSV | Tabular analysis |\n\nThe stable metrics directory provides a consistent location for plotting tools, avoiding the variable trial directory names generated by Tune.\n\n## Error Handling\n\nThe pipeline is designed for robustness:\n\n- **AutoPlotterCallback**: All exceptions caught and logged; never interrupts training\n- **PSMetrics**: Task pool errors logged once and suppressed\n- **Training Loop**: Checkpoint failures fall back to metric-only reporting\n- **PBT**: `max_failures=3` allows trial recovery\n\n## Integration Points\n\n### Environment Factory\n\n```python\ndef make_env(cfg):\n    e = ITraderEnv(cfg)\n    e.spec = EnvSpec(\"ITraderEnv\")\n    return e\n\ntune.register_env(\"ITraderEnv\", make_env)\n```\n\n### Model Registration\n\n```python\nModelCatalog.register_custom_model(\"solver_lstm_v2\", SolverLSTMModel)\nModelCatalog.register_custom_model(\"solver_mlp\", SolverMLPModel)\nModelCatalog.register_custom_model(\"solver_mlp_film\", SolverMLPFiLM)\n```\n\n### Task Pool Integration\n\nWhen `--task_pool_path` is set:\n1. `TaskPool` loads tasks from JSONL\n2. Environment samples from pool with probability `--p_pool`\n3. `PSMetrics` updates task pool statistics after each episode\n4. Aggregate metrics logged: `task_pool_return_mean`, `task_pool_success_rate_mean`"};

(function() {
  var activePage = 'overview';

  document.addEventListener('DOMContentLoaded', function() {
    mermaid.initialize({ startOnLoad: false, theme: 'neutral', securityLevel: 'loose' });
    renderMeta();
    renderNav();
    document.getElementById('menu-toggle').addEventListener('click', function() {
      document.getElementById('sidebar').classList.toggle('open');
    });
    if (location.hash && location.hash.length > 1) {
      activePage = decodeURIComponent(location.hash.slice(1));
    }
    navigateTo(activePage);

    if (META.model) parts.push(META.model);
    if (META.fromCommit) parts.push(META.fromCommit.slice(0, 8));
    el.textContent = parts.join(' \u00b7 ');
  }

    var container = document.getElementById('nav-tree');

    container.innerHTML = html;
    container.addEventListener('click', function(e) {
      var target = e.target;
      while (target && !target.dataset.page) { target = target.parentElement; }
      if (target && target.dataset.page) {
        e.preventDefault();
        navigateTo(target.dataset.page);
      }
    });
  }

  function buildNavTree(nodes) {
    var html = '';
    for (var i = 0; i < nodes.length; i++) {
      var node = nodes[i];
      html += '<div class="nav-section">';
      html += '<a class="nav-item" data-page="' + escH(node.slug) + '" href="#' + encodeURIComponent(node.slug) + '">' + escH(node.name) + '</a>';
      if (node.children && node.children.length > 0) {
        html += '<div class="nav-children">' + buildNavTree(node.children) + '</div>';
      }
      html += '</div>';
    }
    return html;

  function escH(s) {

      var div = document.createElement('div');
      div.className = 'mermaid';
      div.textContent = mermaidBlocks[i].textContent;
      pre.parentNode.replaceChild(div, pre);
    }
    try { mermaid.run({ querySelector: '.mermaid' }); } catch(e) {}

    window.scrollTo(0, 0);
    document.getElementById('sidebar').classList.remove('open');
  }
})();

</script>
</body>
</html>

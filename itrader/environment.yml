name: itrader
channels:
  - conda-forge
  - pytorch
dependencies:
  # ---------- Python ----------
  - python=3.11
  - pip

  # ---------- Numerical stack ----------
  - numpy>=1.26
  - pandas>=2.2
  - scipy
  - pyarrow=16.1          # parquet IO
  - ta-lib

  # ---------- RL / multi-agent ----------
  - pip:
      # Ray & RLlib (2.9.0 is last Win-wheel right now)
      - "ray[default,rllib]==2.9.0"
      - "pettingzoo==1.24.1"

      # Data / back-testing
      - duckdb==0.10.2
      - vectorbt==0.26.0        # pure-python build OK

      # LLM bits (NO auto-gptq yet)
      - transformers==4.41.1
      - accelerate==0.28.0
      # You can do GGUF quant inference with llama-cpp-python
      - llama-cpp-python==0.2.70.post2

      # Dev / tooling
      - black
      - isort
      - pytest

# itrader/environment.yml
name: itrader
channels:
  - conda-forge
  - pytorch
dependencies:
  # Core runtime (canonical Ray 2.58 migration baseline)
  - python=3.11
  - numpy=1.26.*
  - pandas=2.1.4
  - pyarrow=17.0.0
  - duckdb=0.10.2
  - pytorch=2.3.*
  - torchvision=0.18.*
  - ta-lib
  - requests>=2.31
  - websockets>=12.0
  - pip
  # Pip extras
  - pip:
      - "ray[rllib]==2.58.0"
      - gymnasium==1.2.2
      - transformers==4.57.3
      - accelerate==0.27.2
      - llama-cpp-python==0.3.9
      - fire
      - black
      - isort
      - pre-commit
      - pytest
      - pydantic>=2,<3
      - setuptools==69.5.1

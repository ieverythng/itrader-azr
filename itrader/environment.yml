name: itrader
channels:
  - conda-forge
  - pytorch     # still fine – has CUDA wheels for Windows
dependencies:
  # ------- core -------
  - python =3.11
  - pip
  - numpy
  - pandas
  - pyarrow
  - pytorch =2.2
  - torchvision
  - torchaudio         # CUDA runtime; comment out if CPU-only
  # tech-analysis C lib (conda-forge has a Win build)
  - ta-lib

  # ------- install the rest via pip -------
  - pip:
      # RL & envs
      - "ray[default,rllib]==2.9.0"
      - pettingzoo==1.24.1
      - gymnasium==0.29.1
      # Data / back-test
      - duckdb==0.10.2
      - vectorbt==0.25.6
      - pandas-ta==0.3.14b
      - backtrader
      # LLM stack
      - transformers==4.41.2
      - accelerate==0.30.1
      - peft==0.10.0
      - bitsandbytes==0.43.0
      - sentencepiece
      - einops
      - huggingface-hub
      # utils
      - wandb==0.17.1
      - tqdm
      - typer[all]

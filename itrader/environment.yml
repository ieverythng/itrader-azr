name: itrader
channels:
  - conda-forge
  - pytorch
dependencies:
  # ---------- Core Python ----------
  - python=3.11
  - pip                        # so pip is available inside env

  # ---------- Core numeric stack ----------
  - numpy>=1.26
  - pandas>=2.2
  - scipy
  - pyarrow=16.1               # wheels for py311

  # ---------- Finance helpers ----------
  - ta-lib                      # conda-forge has pre-built wheel
  # - pandas-ta                 # optional; pure-python, can be pip-installed

  # ---------- RL / multi-agent ----------
  - pip:
      - "ray[default,rllib]==2.9.0"
      - "pettingzoo==1.24.1"
      - duckdb==0.10.2
      - vectorbt==0.25.6        # CPU-only back-testing lib
      - bitsandbytes-windows    # tiny Q4 LoRA linear layers (optional)

      # LLM backend (quantised 6-B model via GGUF)
      - "transformers==4.41.1"
      - "accelerate>=0.28"
      - "optimum==1.21.1"
      - "auto-gptq==0.7.2"
      - "einops"

      # ---------- Dev / tooling ----------
      - black
      - isort
      - pytest
      # - jupyterlab            # uncomment if you want notebooks inside env

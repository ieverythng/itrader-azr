# itrader/environment.yml
name: itrader
channels:
  - conda-forge
  - pytorch
dependencies:
  # ── core ────────────────────────────────────────────────
  - python=3.11               # 64-bit
  - numpy=1.26.*              # last pure-NumPy release
  - pyarrow=13.0.0           # satisfies ray 2.9 / 2.20
  - pandas=2.2.*
  - duckdb=0.10.2
  - pytorch=2.3.    # swap to cuda build later if you like
  - torchvision=0.18.
  - ta-lib                     # conda build on cf
  - pip
  # ── pip section ─────────────────────────────────────────
  - pip:
      - "ray[rllib]==2.20.0"     # matches your screen-shot
      - pettingzoo==1.24.1
      - vectorbt==0.26.0
      - transformers==4.41.1
      - accelerate==0.27.2
      - llama-cpp-python==0.3.9
      - fire
      - black
      - isort
      - pytest

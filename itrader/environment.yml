name: itrader
channels:
  - conda-forge
  - pytorch
dependencies:
  # ---------- Core ----------
  - python=3.11
  - pip

  # ---------- Numeric / data ----------
  - numpy>=1.26
  - pandas>=2.2
  - scipy
  - pyarrow=16.1
  - ta-lib
  - duckdb=0.10.2          # parquet / SQL

  # ---------- Deep learning ----------
  - pytorch=2.3.*          # CPU build; add CUDA later with pip wheel
  - torchvision            # pulls the matching build

  # ---------- RL / multi-agent ----------
  - pip:
      # Ray & RLlib
      - "ray[default,rllib]==2.9.0"
      - "pettingzoo==1.24.1"

      # Back-testing
      - vectorbt==0.26.0

      # LLM / inference
      - transformers==4.41.1
      - accelerate==0.27.2        # 0.28 wheels missing for Win+py311
      - llama-cpp-python==0.2.71  # first CP311 win_amd64 wheel

      # Dev / tooling
      - black
      - isort
      - pytest

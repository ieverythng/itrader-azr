# itrader/environment.yml  (v0.4 – "just-works" edition)
name: itrader
channels:
  - conda-forge
  - pytorch
dependencies:
  # ---------- interpreter ----------
  - python=3.11
  - pip                       # use the latest pip wheel

  # ---------- BLAS / array stack ----------
  - numpy=1.26.*              # modern, has wheels
  - pyarrow=16.1.*            # WIN cp311 wheel exists
  - pandas=2.2.*

  # ---------- ML / DL ----------
  - pytorch=2.3.*
  - torchvision

  # ---------- misc libs ----------
  - scipy
  - ta-lib                     # comes from conda-forge
  - duckdb=0.10.2

  # ---------- use pip for the rest ----------
  - pip:
      - "ray[default,rllib]==2.9.0"
      - pettingzoo==1.24.1
      - vectorbt==0.26.0

      # LLM pieces
      - transformers==4.41.1
      - accelerate==0.27.2
      - llama-cpp-python==0.2.71          # cp311 win wheel

      # dev / test
      - black
      - isort
      - pytest

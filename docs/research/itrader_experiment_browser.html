<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">

  <title>iTrader Experiment Browser</title>
  <style>
    :root{--ink:#17221c;--muted:#627067;--paper:#f6f2e8;--card:#fffdf7;--line:#d8d4c8;--green:#176b51;--mint:#cce8dc;--amber:#b66a1b;--red:#a23b34;--blue:#2b5f8a;--shadow:0 14px 38px rgba(34,48,39,.09)}

    header{padding:34px clamp(22px,5vw,72px) 24px;border-bottom:1px solid var(--line);background:rgba(255,253,247,.78);backdrop-filter:blur(14px)}
    h1{margin:0;font:700 clamp(30px,4vw,50px)/1.04 Georgia,serif;letter-spacing:-.035em} header p{max-width:820px;color:var(--muted);font-size:15px;margin:12px 0 0}
    main{display:grid;grid-template-columns:250px minmax(0,1fr);min-height:calc(100vh - 150px)}
    nav{padding:22px 14px 40px clamp(14px,3vw,44px);border-right:1px solid var(--line);background:rgba(248,246,239,.72)}
    nav button{display:block;width:100%;border:0;background:transparent;text-align:left;padding:11px 12px;margin:3px 0;border-radius:9px;color:var(--muted);cursor:pointer;font:600 13px/1.3 inherit}
    nav button:hover,nav button.active{background:var(--ink);color:white} nav .eyebrow{margin:17px 12px 7px;color:var(--green);font-size:10px;font-weight:800;text-transform:uppercase;letter-spacing:.16em}
    #content{padding:30px clamp(20px,4vw,58px) 70px;overflow:hidden}.panel{display:none}.panel.active{display:block}
    h2{font:700 29px/1.15 Georgia,serif;margin:0 0 9px} h3{margin:26px 0 10px}.lede{color:var(--muted);max-width:900px;margin:0 0 22px}
    .toolbar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin:17px 0}.toolbar input,.toolbar select{border:1px solid var(--line);border-radius:8px;background:var(--card);padding:10px 12px;min-width:220px;color:var(--ink)}
    .grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:13px}.card{background:var(--card);border:1px solid var(--line);border-radius:13px;padding:17px;box-shadow:var(--shadow)}
    .stat{font:700 25px/1.1 Georgia,serif}.label{font-size:10px;text-transform:uppercase;letter-spacing:.13em;color:var(--muted);font-weight:800}.tag{display:inline-block;border-radius:999px;padding:4px 8px;background:var(--mint);color:var(--green);font-size:11px;font-weight:700;margin:2px}
    .tag.warn{background:#f6ddbf;color:#8a4d10}.tag.bad{background:#f2d1ce;color:var(--red)}
    .table-wrap{overflow:auto;border:1px solid var(--line);border-radius:12px;background:var(--card);box-shadow:var(--shadow)}table{width:100%;border-collapse:collapse;min-width:900px}th,td{padding:11px 12px;border-bottom:1px solid #e7e3d9;text-align:left;white-space:nowrap}th{position:sticky;top:0;background:#eee9dd;color:#4d5b52;font-size:10px;text-transform:uppercase;letter-spacing:.1em}tr:last-child td{border-bottom:0}tr:hover td{background:#f6f4ed}
    a{color:var(--blue);text-decoration:none}a:hover{text-decoration:underline}.mono{font-family:"SFMono-Regular",Consolas,monospace;font-size:12px}.muted{color:var(--muted)}
    .factor-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:8px;margin:16px 0}.factor{padding:10px 12px;background:#eee9dd;border-radius:8px}.factor b{display:block;font-size:10px;text-transform:uppercase;letter-spacing:.1em;color:var(--muted)}
    .chart{width:100%;height:240px;background:var(--card);border:1px solid var(--line);border-radius:12px;margin:15px 0}.axis{stroke:#bcb7aa;stroke-width:1}.zero{stroke:#c76e61;stroke-dasharray:5 4}.series-a{fill:none;stroke:var(--green);stroke-width:3}.series-b{fill:none;stroke:var(--amber);stroke-width:3}.dot-a{fill:var(--green)}.dot-b{fill:var(--amber)}
    .comparison{display:grid;grid-template-columns:1fr 1fr;gap:14px}.match{border-left:5px solid var(--green)}.mismatch{border-left:5px solid var(--amber)}
    @media(max-width:850px){main{grid-template-columns:1fr}nav{border-right:0;border-bottom:1px solid var(--line);display:flex;overflow:auto;padding:10px}nav .eyebrow{display:none}nav button{min-width:max-content}.comparison{grid-template-columns:1fr}}
  </style>
</head>

    const indexRows=data.experiments.flatMap(e=>e.records.map(r=>({e,r})));addPanel('index',`<h2>Experiment index</h2><p class="lede">${indexRows.length} normalized records from ${data.experiments.length} authoritative experiment summaries. Registry: <span class="mono">${esc(data.generated_from)}</span>.</p><div class="toolbar"><input id="search" type="search" placeholder="Search run, member, checkpoint, factor…"><span id="search-count" class="muted"></span></div><div class="table-wrap"><table><thead><tr><th>Experiment</th><th>Date</th><th>Run</th><th>Record</th><th>Member</th><th>Observed env steps</th><th>Cost factor</th><th>Representation</th><th>Source</th></tr></thead><tbody id="index-body">${indexRows.map(({e,r})=>`<tr data-search="${esc(`${e.title} ${e.id} ${e.date} ${r.run_id??''} ${r.trial_dir??''} ${r.label} ${r.member} ${r.pbt_progress_steps??''} ${r.checkpoint_path??''} ${Object.values(e.factors).join(' ')} ${JSON.stringify(r.attributes||{})}`.toLowerCase())}"><td><button class="jump" data-target="exp-${data.experiments.indexOf(e)}">${esc(e.title)}</button></td><td>${esc(e.date)}</td><td class="mono">${esc(r.run_id)}</td><td>${esc(r.label)}</td><td class="mono">${esc(r.member)}</td><td>${fmt(r.pbt_progress_steps)}</td><td>${esc(e.factors.cost)}</td><td>${esc(e.factors.representation)}</td><td>${link(e.source,'JSON')}</td></tr>`).join('')}</tbody></table></div>`);
    const opts=data.experiments.map((e,i)=>`<option value="${i}">${esc(e.title)}</option>`).join('');addPanel('compare',`<h2>Comparability gate</h2><p class="lede">Choose two experiment families. Exact factor matches are direct comparisons; differences are displayed explicitly rather than silently pooled.</p><div class="toolbar"><select id="cmp-a">${opts}</select><select id="cmp-b">${opts}</select></div><div id="comparison" class="comparison"></div>`);
    data.experiments.forEach((e,i)=>addPanel(`exp-${i}`,`<div class="label">${esc(e.date)} · ${esc(e.status)}</div><h2>${esc(e.title)}</h2><p class="lede">${esc(e.summary)}</p><div><span class="tag">${esc(e.id)}</span><span class="tag ${e.factors.cost.includes('causal')?'warn':''}">${esc(e.factors.cost)}</span><span class="tag">comparison ${esc(e.comparability_id)}</span></div><div class="factor-grid">${factorHtml(e)}</div><h3>Authoritative identities</h3><div class="factor-grid">${Object.entries(e.identities).map(([k,v])=>`<div class="factor"><b>${esc(k)}</b>${v?esc(v):'<span class="muted">unknown</span>'}</div>`).join('')}</div><div class="toolbar">${link(e.report,'research report')} ${e.legacy_dashboard?' · '+link(e.legacy_dashboard,'legacy dashboard snapshot'):''} · ${link(e.source,'authoritative summary')}</div>${chart(e)}${rows(e)}`));
    const show=id=>{document.querySelectorAll('.panel').forEach(p=>p.classList.toggle('active',p.id===`panel-${id}`));document.querySelectorAll('nav button').forEach(b=>b.classList.toggle('active',b.dataset.tab===id));location.hash=id};document.addEventListener('click',ev=>{const b=ev.target.closest('[data-tab],[data-target]');if(b)show(b.dataset.tab||b.dataset.target)});
    const search=document.getElementById('search'),count=document.getElementById('search-count');const filter=()=>{const q=search.value.trim().toLowerCase();let visible=0;document.querySelectorAll('#index-body tr').forEach(tr=>{const on=!q||tr.dataset.search.includes(q);tr.hidden=!on;if(on)visible++});count.textContent=`${visible} records`};search.addEventListener('input',filter);filter();
    const compare=()=>{const a=data.experiments[+document.getElementById('cmp-a').value],b=data.experiments[+document.getElementById('cmp-b').value],keys=Object.keys(a.factors),same=a.id===b.id,result=same?null:data.comparisons.find(c=>(c.left===a.id&&c.right===b.id)||(c.left===b.id&&c.right===a.id)),exact=result?.directly_comparable===true,diff=result?.different_factors||[],identityDiff=result?.different_identities||[],missing=result?.missing_identities||[];let label='Not directly comparable',message=same?'Choose two distinct experiments.':exact?'All declared factors and authoritative identities match.':`${diff.length} factor difference(s): ${diff.map(esc).join(', ')||'none'}; ${identityDiff.length} identity difference(s): ${identityDiff.map(esc).join(', ')||'none'}; missing identities: ${missing.map(esc).join(', ')||'none'}.`;if(exact)label='Directly comparable';if(same)label='Same experiment selected';document.getElementById('comparison').innerHTML=`<div class="card ${exact?'match':'mismatch'}"><div class="label">${label}</div><h3>${esc(a.title)} ↔ ${esc(b.title)}</h3><p>${message}</p></div><div class="card"><div class="label">Factor ledger</div>${keys.map(k=>`<p><b>${esc(k)}</b><br>${esc(a.factors[k])}<br><span class="muted">vs ${esc(b.factors[k])}</span></p>`).join('')}</div>`};document.getElementById('cmp-a').addEventListener('change',compare);document.getElementById('cmp-b').addEventListener('change',compare);if(data.experiments.length>1)document.getElementById('cmp-b').value='1';compare();
    show(location.hash.slice(1)||'index');
  })();
  </script>
</body>
